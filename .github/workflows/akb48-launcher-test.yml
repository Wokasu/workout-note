name: AKB48 申込ランチャーのテスト

on:
  push:
    paths: ['akb48-calendar/launcher/**', '.github/workflows/akb48-launcher-test.yml']
  pull_request:
    paths: ['akb48-calendar/launcher/**', '.github/workflows/akb48-launcher-test.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Windows標準の PowerShell 5.1 で、Chromeを起動しないモードで動かして出力を確かめる
      - name: Dry run
        shell: powershell
        run: |
          $dir = 'akb48-calendar/launcher'
          $out = & "$dir/launcher.ps1" -DryRun -NoWait -Select '1-3' -LocalState "$dir/test/Local State" -Links "$dir/test/links.json" *>&1 | Out-String
          Write-Host $out
          $expected = @(
            '申込アカウント（Chromeのプロファイル）: 2 個',
            '[ 2] 11/09(月) 18:30 「ここからだ」公演  伊藤百花  ← 申込URL未設定',
            '次の 2 公演を、2 個のアカウントで1つずつ開きます',
            '[1/2] AKB 01 柱の会 で開きます',
            'chrome --profile-directory="Profile 1" --new-window https://akb48.zaiko.io/ja/e/2026-reset-1107-1230 https://akb48.zaiko.io/ja/e/2026-reset-1111-1900',
            '[2/2] AKB 02 映像倉庫 で開きます'
          )
          foreach ($e in $expected) {
            if (-not $out.Contains($e)) { throw "出力に見つかりません: $e" }
          }
          if ($out.Contains('個人用')) { throw 'AKB以外のプロファイルが含まれています' }
