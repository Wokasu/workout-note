name: 競馬AI データ取得の調査

on:
  push:
    branches: [claude/epic-tesla-0chqik]
    paths: [keiba-ai/scrape/probe.py, .github/workflows/keiba-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: python keiba-ai/scrape/probe.py
