name: 競馬AI データ取得の調査

on:
  push:
    branches: [claude/epic-tesla-0chqik]
    paths: [keiba-ai/scrape/probe.py, .github/workflows/keiba-probe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: OUT=/tmp/fixtures python keiba-ai/scrape/probe.py
      # 見本ページを keiba-fixtures ブランチに置く（パーサーのテスト用）
      - name: Save fixtures
        run: |
          cd /tmp/fixtures
          git init -q -b keiba-fixtures
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -q -m "JRA 見本ページ $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" keiba-fixtures
