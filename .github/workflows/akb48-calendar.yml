name: AKB48 劇場公演カレンダー更新

on:
  schedule:
    - cron: '17 */3 * * *' # 3時間ごと
  workflow_dispatch:
    inputs:
      probe:
        description: '調査用: 本文とリンク一覧を出すだけのページ（カンマ区切り）。空なら通常の更新'
        required: false
        default: ''
      x_post_month:
        description: 'この月の出演告知文を X に投稿する（例 2026-11）。投稿済みのメンバーは飛ばす'
        required: false
        default: ''
      ntfy_test:
        description: 'ntfy にテスト通知を送る'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: akb48-calendar
  cancel-in-progress: false

env:
  FEED_BRANCH: akb48-calendar-feed

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 公開用ブランチ（.ics と前回までの記録）を feed/ に取り出す。初回は空のブランチを作る
      - name: Checkout feed branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$FEED_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$FEED_BRANCH" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
          else
            mkdir feed && cd feed && git init -b "$FEED_BRANCH"
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parser
        run: node --test akb48-calendar/test.mjs

      - name: Build calendars
        id: build
        continue-on-error: true
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          if [ -n "$PROBE" ]; then
            node akb48-calendar/update.mjs --out feed --dump dump --probe "$PROBE"
          else
            node akb48-calendar/update.mjs --out feed --dump dump --notify notify-apply.md
          fi

      - name: Show fetched text (for debugging)
        if: always()
        run: for f in dump/*.txt; do echo "::group::$f"; cat "$f"; echo '::endgroup::'; done

      - name: Upload fetched text (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-text
          path: dump/
          if-no-files-found: ignore
          retention-days: 7

      # 中身が変わったときだけコミットする（.ics の DTSTAMP は毎回変わるので比べない）
      - name: Publish
        if: ${{ !inputs.probe }}
        working-directory: feed
        run: |
          git add -A
          if git rev-parse --verify HEAD >/dev/null 2>&1 && git diff --cached --quiet -I '^DTSTAMP:'; then
            echo '予定に変化なし'
            exit 0
          fi
          changed_sns=$(git diff --cached --name-only -- 'sns/*.txt' | grep -E '^sns/[0-9]{4}-[0-9]{2}\.txt$' || true)
          new_sns=$(git diff --cached --name-only --diff-filter=A -- 'sns/*.txt' | grep -E '^sns/[0-9]{4}-[0-9]{2}\.txt$' || true)
          git commit -m "カレンダー更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push origin "HEAD:$FEED_BRANCH"
          echo "$changed_sns" > ../changed-sns.txt
          echo "$new_sns" > ../new-sns.txt

      # 来月以降の出演告知文ができた・変わったら Issue で知らせる（GitHub の通知が届く）
      - name: Notify SNS announcement
        if: ${{ !inputs.probe }}
        working-directory: feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s ../changed-sns.txt ] || exit 0
          while read -r file; do
            [ -n "$file" ] || continue
            ym=$(basename "$file" .txt)
            title="出演告知文 ${ym%-*}年$((10#${ym#*-}))月"
            body=$(printf '%s\n\n' "${ym%-*}年$((10#${ym#*-}))月の劇場公演の出演告知文です。下の枠をそれぞれコピーして使えます。"
              for f in sns/$ym/*.txt; do printf '### %s\n\n```\n%s\n```\n\n' "$(basename "$f" .txt)" "$(cat "$f")"; done
              printf '※出演メンバーの変更があると、このIssueにコメントで新しい告知文が届きます。\n')
            number=$(gh issue list --repo "${{ github.repository }}" --state all --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "${{ github.repository }}" --body "出演メンバーの変更で告知文が変わりました。

          $body"
            else
              gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
            fi
          done < ../changed-sns.txt

      # 推しが出る公演の申込が始まったら Issue で知らせる（GitHub の通知が届く）
      - name: Notify application open
        if: ${{ !inputs.probe && hashFiles('notify-apply.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "申込開始 $(TZ=Asia/Tokyo date '+%-m/%-d %H:%M')" \
            --body-file notify-apply.md

      - name: Test push (ntfy)
        if: ${{ inputs.ntfy_test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo '::error::NTFY_TOPIC が設定されていません'; exit 1; }
          curl -fsS -H "Title: テスト通知" -H "Tags: white_check_mark" \
            -d "AKB48 申込開始のお知らせは、この形で届きます。" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null

      # 同じ内容を ntfy でスマホにプッシュ通知する（Secrets の NTFY_TOPIC を購読している人全員に届く）
      - name: Push application open (ntfy)
        if: ${{ !inputs.probe && hashFiles('notify-apply.txt') != '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo 'NTFY_TOPIC が設定されていないので送りません'; exit 0; }
          curl -fsS \
            -H "Title: 🎫 推しの公演の申込が始まりました" \
            -H "Tags: ticket" \
            -H "Click: $(cat notify-apply.url)" \
            --data-binary @notify-apply.txt \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null

      # 新しい月の出演告知文ができたら、自分の X アカウントに投稿する（Secrets に X の認証情報があるときだけ）
      - name: Post to X
        if: ${{ !inputs.probe }}
        working-directory: feed
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_POST_MONTH: ${{ inputs.x_post_month }}
        run: |
          months=$( (cat ../new-sns.txt 2>/dev/null | xargs -r -n1 basename | sed 's/\.txt$//'; echo "$X_POST_MONTH") | grep -E '^[0-9]{4}-[0-9]{2}$' | sort -u || true)
          [ -n "$months" ] || exit 0
          failed=0
          for m in $months; do
            node ../akb48-calendar/post-x.mjs --dir . --month "$m" || failed=1
          done
          # 途中で失敗しても、投稿できた分の記録は残す（二重投稿を防ぐため）
          # 前の手順で DTSTAMP だけの変更がステージに残っていることがあるので、投稿記録だけをコミットする
          git reset -q
          git add -A sns/posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "X に投稿した記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push origin "HEAD:$FEED_BRANCH"
          fi
          exit $failed

      - name: Report fetch failure
        if: steps.build.outcome == 'failure'
        run: |
          echo '::error::公式サイトから公演情報を取得できませんでした。前回の予定を残しています。'
          exit 1
