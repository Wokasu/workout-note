<title>フィジークログ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16191d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: one app column — a sticky header with tabs, then stacked panels; the measuring view takes the whole column */
:root {
  --bg: #eceef1;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #16191d;
  --muted: #5b646e;
  --line: #d3d8de;
  --accent: #b05a1e;        /* tanned bronze: current session */
  --accent-soft: #f6e6d9;
  --accent-ink: #ffffff;
  --prev: #3b74b0;          /* steel blue: the session it is compared with */
  --fig: #e7c9ae;
  --fig-edge: #8a4a1c;
  --up: #2c7a4b;
  --down: #b3362f;
  --overlay: rgba(10, 12, 15, .55);
  --display: "Barlow Condensed", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111316; --surface: #1a1d22; --surface-2: #22262c; --ink: #eceef1; --muted: #9aa3ad; --line: #2e333a;
    --accent: #c4733a; --accent-soft: #3a2719; --accent-ink: #ffffff; --prev: #5f8fc8;
    --fig: #6b4a33; --fig-edge: #e0a274; --up: #5cbf84; --down: #ef7a72; --overlay: rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111316; --surface: #1a1d22; --surface-2: #22262c; --ink: #eceef1; --muted: #9aa3ad; --line: #2e333a;
  --accent: #c4733a; --accent-soft: #3a2719; --accent-ink: #ffffff; --prev: #5f8fc8;
  --fig: #6b4a33; --fig-edge: #e0a274; --up: #5cbf84; --down: #ef7a72; --overlay: rgba(0,0,0,.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--body);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font: 700 24px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin-right: auto; }
.brand small { font: 500 12px var(--body); color: var(--muted); letter-spacing: 0; text-transform: none; margin-left: 8px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 500;
}
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--surface); }
main { padding-block: 18px 64px; display: grid; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font: 700 20px/1.2 var(--body); }
h3 { font: 700 15px/1.3 var(--body); }
.eyebrow { font: 600 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--down); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
.field textarea { min-height: 64px; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

/* session list */
.sessions { display: grid; gap: 10px; }
.sess {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 8px; width: 100%;
}
.sess:hover { border-color: var(--muted); }
.sess .thumb { width: 64px; height: 80px; border-radius: 6px; background: var(--surface-2) center/cover no-repeat; }
.sess .date { font: 700 22px/1 var(--display); }
.sess .meta { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.on { background: var(--accent-soft); color: var(--ink); border-color: transparent; }

/* photo grid */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.slot {
  position: relative; border: 1px dashed var(--line); background: var(--surface-2); border-radius: 8px; padding: 0;
  aspect-ratio: 3 / 4; max-width: 100%; overflow: hidden; display: grid; place-items: center; color: var(--muted); text-align: center;
}
.slot.filled { border-style: solid; }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot .cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: 12px; font-weight: 500; line-height: 1.3;
  background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff; text-align: left;
}
.slot .cap b { display: block; font: 600 11px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.slot:not(.filled) .cap { background: none; color: var(--muted); }
.slot .plus { font: 600 34px/1 var(--display); }
.slot .badge { position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.slot .badge.todo { background: rgba(0,0,0,.6); color: #fff; }
.group-title { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.group-title h2 { white-space: nowrap; }

/* results */
.result { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 720px) { .result { grid-template-columns: 1fr; } }
.figure svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.legend i.prev { border-top: 2px dashed var(--prev); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
td.v { font: 600 18px/1 var(--display); font-variant-numeric: tabular-nums; }
.d { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 15px; }
.d.up { color: var(--up); } .d.down { color: var(--down); } .d.flat { color: var(--muted); }
.est { font-size: 11px; color: var(--muted); }

/* measure editor */
.editor { display: grid; gap: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap;
}
.chip.done { background: var(--accent-soft); border-color: transparent; }
.chip.done::before { content: "✓ "; color: var(--accent); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"]::before { color: inherit; }
.hint { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px; }
.hint b { font-size: 15px; }
.stage {
  position: relative; overflow: auto; background: #0d0f12; border-radius: var(--radius);
  height: min(72vh, 820px); touch-action: pan-x pan-y; overscroll-behavior: contain;
}
.stage .canvas { position: relative; margin: 0 auto; }
.stage img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.stage .handle { cursor: grab; touch-action: none; }
.loupe {
  position: fixed; width: 132px; height: 132px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 18px rgba(0,0,0,.5);
  pointer-events: none; z-index: 30; background: #000;
}
.zoombar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* compare */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp.single { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; width: 100%; }
.cmp figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.cmp canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #0d0f12; max-width: 100%; }
.cmp figcaption { font-size: 13px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cmp figcaption .num { font-size: 18px; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
input[type="range"] { accent-color: var(--accent); width: 100%; }

/* trend chart */
.metric-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 6px;
  padding: 6px 9px; font-size: 12px; line-height: 1.4; transform: translate(-50%, -100%); white-space: nowrap;
}
.tip b { font: 700 16px/1 var(--display); }

/* overlays */
.sheet-bg { position: fixed; inset: 0; background: var(--overlay); z-index: 40; display: grid; place-items: end center; }
@media (min-width: 640px) { .sheet-bg { place-items: center; } }
.sheet {
  background: var(--surface); border-radius: 14px 14px 0 0; width: min(520px, 100%); display: grid; gap: 12px;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width: 640px) { .sheet { border-radius: 14px; } }
.sheet .actions { display: grid; gap: 8px; }
.sheet .actions .btn { justify-content: center; padding: 11px; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px);
}
.slot.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.slot.keep img { opacity: .35; }
.slot .tag { position: absolute; top: 6px; left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.tray .slot { aspect-ratio: 3 / 4; }
.bulkbar { position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 10px; justify-items: center; }
.sample-tag { font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
.store-note { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .sess { transition: border-color .15s, background .15s; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Physique Log<small>フィジークログ</small></div>
    <nav class="tabs" id="tabs">
      <button data-tab="log">記録</button>
      <button data-tab="compare">比較</button>
      <button data-tab="trend">推移</button>
      <button data-tab="profile">基準・補正</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><div class="panel"><p class="muted">読み込み中…</p></div></main>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="files" accept="image/*" multiple hidden>
<div id="layer"></div>

<script>
'use strict';
/* ====================== 定義 ====================== */
const SLOTS = [
  { k: 'q_front', g: 'qt', en: 'Front', name: '正面', measure: 'front' },
  { k: 'q_right', g: 'qt', en: 'Right', name: '右向き（右側面）', measure: 'side' },
  { k: 'q_back',  g: 'qt', en: 'Back',  name: '背面' },
  { k: 'q_left',  g: 'qt', en: 'Left',  name: '左向き（左側面）', measure: 'side' },
  { k: 'p_fdb', g: 'pose', en: '01', name: 'フロント・ダブルバイセップス' },
  { k: 'p_fls', g: 'pose', en: '02', name: 'フロント・ラットスプレッド' },
  { k: 'p_sc',  g: 'pose', en: '03', name: 'サイドチェスト' },
  { k: 'p_bdb', g: 'pose', en: '04', name: 'バック・ダブルバイセップス' },
  { k: 'p_bls', g: 'pose', en: '05', name: 'バック・ラットスプレッド' },
  { k: 'p_st',  g: 'pose', en: '06', name: 'サイドトライセップス' },
  { k: 'p_at',  g: 'pose', en: '07', name: 'アブドミナル・アンド・サイ' },
];
const SLOT = Object.fromEntries(SLOTS.map(s => [s.k, s]));

// 2点で測る項目。head は全写真共通の物差し（頭頂〜あご先）
const MARKS = {
  head:      { name: '頭の高さ', hint: '頭のてっぺん → あごの先', why: 'すべての長さの物差しになります（脂肪で変わりにくい）' },
  shoulder:  { name: '肩幅', hint: '左右の三角筋の一番外側', why: '腕を下ろしたリラックスの姿勢で' },
  neck:      { name: '首の幅', hint: '首の一番細いところの左右端' },
  chest:     { name: '胸の幅', hint: 'わきの下の高さで、胴体の左右端（広背筋まで含む）' },
  arm:       { name: '上腕の幅', hint: '片方の上腕の一番太いところの左右端' },
  forearm:   { name: '前腕の幅', hint: '片方の前腕の一番太いところの左右端' },
  waist:     { name: 'ウエストの幅', hint: '胴の一番細いところの左右端' },
  hip:       { name: 'ヒップの幅', hint: 'お尻（大転子）の一番幅の広いところ' },
  thigh:     { name: '太ももの幅', hint: '片脚の太ももの一番太いところ（付け根の少し下）' },
  calf:      { name: 'ふくらはぎの幅', hint: '片脚のふくらはぎの一番太いところ' },
  neck_d:    { name: '首の厚み', hint: '首の一番細いところの前端 → 後端' },
  chest_d:   { name: '胸の厚み', hint: '乳首の高さで、胸の前端 → 背中の後端' },
  arm_d:     { name: '上腕の厚み', hint: '上腕の一番太いところの前端（二頭）→ 後端（三頭）' },
  forearm_d: { name: '前腕の厚み', hint: '前腕の一番太いところの前端 → 後端' },
  waist_d:   { name: 'ウエストの厚み', hint: '胴の一番細いところの腹側 → 背中側' },
  hip_d:     { name: 'ヒップの厚み', hint: 'お尻の一番出ているところ → 下腹の前端' },
  thigh_d:   { name: '太ももの厚み', hint: '太ももの一番太いところの前端 → 後端（ハム）' },
  calf_d:    { name: 'ふくらはぎの厚み', hint: 'ふくらはぎの一番太いところの前端 → 後端' },
};
const MARKS_FOR = {
  front: ['head', 'shoulder', 'neck', 'chest', 'arm', 'forearm', 'waist', 'hip', 'thigh', 'calf'],
  side:  ['head', 'neck_d', 'chest_d', 'arm_d', 'forearm_d', 'waist_d', 'hip_d', 'thigh_d', 'calf_d'],
  align: ['head'],
};
// 周囲長は 正面の幅 × 側面の厚み の楕円で近似する。厚みがないときは ratio（厚み/幅の目安）で補う
const PARTS = [
  { k: 'shoulder', name: '肩幅', short: '肩幅', type: 'width' },
  { k: 'neck',    name: '首囲', short: '首', ratio: 1.0 },
  { k: 'chest',   name: '胸囲', short: '胸囲', ratio: 0.72 },
  { k: 'arm',     name: '上腕囲', short: '腕', ratio: 1.0 },
  { k: 'forearm', name: '前腕囲', short: '前腕', ratio: 0.85 },
  { k: 'waist',   name: 'ウエスト', short: 'ウエスト', ratio: 0.78, lowerBetter: true },
  { k: 'hip',     name: 'ヒップ', short: 'ヒップ', ratio: 0.85 },
  { k: 'thigh',   name: '太もも囲', short: '太もも', ratio: 1.0 },
  { k: 'calf',    name: 'ふくらはぎ囲', short: 'ふくらはぎ', ratio: 1.0 },
];
const PART = Object.fromEntries(PARTS.map(p => [p.k, p]));
const DEFAULT_HEAD_CM = 23;
const HEADS_PER_HEIGHT = 7.6; // 成人男性の平均的な頭身

/* ====================== ユーティリティ ====================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : v.toFixed(d);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${y}.${m}.${d}`; };
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function ellipsePerimeter(w, d) { // Ramanujan の近似
  const a = w / 2, b = d / 2;
  return Math.PI * (3 * (a + b) - Math.sqrt((3 * a + b) * (a + 3 * b)));
}
let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}
function loadImage(url) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}

/* ====================== 保存先 ======================
   claude.ai で開いたとき: 記録は db の本人専用領域（data/users/<id>/）、写真は assets。
   それ以外（ファイルを直接開いたなど）: このブラウザの IndexedDB。 */
const Store = {
  mode: 'local',
  async init() {
    const cloud = await this.tryCloud();
    if (cloud) { Object.assign(this, cloud); this.mode = 'cloud'; return; }
    await Local.open();
    Object.assign(this, Local.api); this.mode = 'local';
  },
  async tryCloud() {
    if (!window.claude || !window.claude.use) return null;
    try {
      const [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]);
      if (!db || !user || !assets) return null;
      const id = await user.id();
      if (!id) return null;
      const col = db.collection('data/users/' + id);
      return {
        async listDocs() { const s = await col.get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
        async putDoc(doc) { const { id: k, ...body } = doc; await col.doc(k).set(JSON.parse(JSON.stringify(body))); },
        async delDoc(k) { await col.doc(k).delete(); },
        async putPhoto(blob) { const r = await assets.upload(blob, { type: 'image/jpeg' }); return 'a:' + r.id; },
        async photoURL(ref) { return ref.startsWith('a:') ? '/_blob/' + ref.slice(2) : ''; },

const Local = {
  db: null, urls: new Map(),
  open() {
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open('physique-log', 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => { req.result.createObjectStore('docs', { keyPath: 'id' }); req.result.createObjectStore('blobs'); };
      req.onsuccess = () => { this.db = req.result; res(); };
      req.onerror = () => rej(req.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    });
  },
  get api() {
    const L = this;
    return {
      listDocs: () => L.tx('docs', 'readonly', s => s.getAll()),
      putDoc: doc => L.tx('docs', 'readwrite', s => s.put(JSON.parse(JSON.stringify(doc)))),
      delDoc: k => L.tx('docs', 'readwrite', s => s.delete(k)),
      async putPhoto(blob) { const k = uid(); await L.tx('blobs', 'readwrite', s => s.put(blob, k)); return 'l:' + k; },
      async photoURL(ref) {
        if (L.urls.has(ref)) return L.urls.get(ref);
        const blob = await L.tx('blobs', 'readonly', s => s.get(ref.slice(2)));
        const url = blob ? URL.createObjectURL(blob) : '';
        L.urls.set(ref, url); return url;
      },
      async delPhoto(ref) { await L.tx('blobs', 'readwrite', s => s.delete(ref.slice(2))); L.urls.delete(ref); },
    };
  },
};

/* ====================== 計算 ====================== */
function headBasis() {
  const p = S.profile;
  if (p.headCm > 0) return { cm: +p.headCm, label: `頭の高さ ${fmt(+p.headCm)}cm（入力値）` };
  if (p.heightCm > 0) { const cm = p.heightCm / HEADS_PER_HEIGHT; return { cm, label: `身長 ${p.heightCm}cm ÷ ${HEADS_PER_HEIGHT}頭身 ≒ ${fmt(cm)}cm` }; }
  return { cm: DEFAULT_HEAD_CM, label: `仮の値 ${DEFAULT_HEAD_CM}cm（「基準・補正」で設定できます）` };
}
// 1回分の記録から各部位を出す。単位は「頭の高さ」=1 と cm の両方
function computeMetrics(s) {
  const out = { parts: {}, hasFront: false, hasSide: false };
  if (!s) return out;
  const basis = headBasis();
  const front = s.photos?.q_front, side = s.photos?.q_right?.marks?.head ? s.photos.q_right : s.photos?.q_left;
  const len = (ph, k) => { const m = ph?.marks?.[k]; return m && m.length === 2 ? dist(m[0], m[1]) : null; };
  const fh = len(front, 'head'), sh = len(side, 'head');
  out.hasFront = !!fh; out.hasSide = !!sh;
  if (!fh) return out;
  for (const p of PARTS) {
    const wpx = len(front, p.k);
    if (!wpx) continue;
    const wH = wpx / fh, wCm = wH * basis.cm;
    if (p.type === 'width') { out.parts[p.k] = { wH, wCm, value: wCm, valueH: wH }; continue; }
    const dpx = sh ? len(side, p.k + '_d') : null;
    const dH = dpx ? dpx / sh : wH * p.ratio;
    const factor = S.profile.calib?.[p.k] || 1;
    const rawH = ellipsePerimeter(wH, dH);
    out.parts[p.k] = { wH, wCm, dH, dCm: dH * basis.cm, depthEstimated: !dpx, factor, rawH, valueH: rawH * factor, value: rawH * factor * basis.cm };
  }
  if (out.parts.shoulder && out.parts.waist) out.vtaper = out.parts.shoulder.wH / out.parts.waist.wH;
  return out;
}
function previousOf(s) {
  const list = sorted(); const i = list.findIndex(x => x.id === s.id);
  return i > 0 ? list.slice(0, i).reverse() : [];
}
function deltaInfo(cur, prev, lowerBetter) {
  if (cur == null || prev == null) return { html: '<span class="d flat">—</span>' };
  const d = cur - prev; const ad = Math.abs(d);
  if (ad < 0.05) return { html: '<span class="d flat">±0.0</span>' };
  const good = lowerBetter ? d < 0 : d > 0;
  return { html: `<span class="d ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${ad.toFixed(1)}</span>` };
}

/* ====================== 人体図 ======================
   単位は頭の高さ。y=0 が頭頂、7.6 付近が足裏。測った幅で輪郭の太さが変わる */
const FIG_DEFAULT = { neck: 0.55, shoulder: 2.45, chest: 1.75, arm: 0.62, forearm: 0.5, waist: 1.3, hip: 1.45, thigh: 0.82, calf: 0.56 };
function smoothClosed(pts) {
  const n = pts.length; const f = p => p[0].toFixed(3) + ' ' + p[1].toFixed(3);
  let d = 'M' + f(pts[0]);
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ' C' + f(c1) + ' ' + f(c2) + ' ' + f(p2);
  }
  return d + 'Z';
}
function figureGeometry(widths) {
  const w = { ...FIG_DEFAULT, ...widths };
  const sh = w.shoulder / 2, ch = w.chest / 2, wa = w.waist / 2, hi = w.hip / 2, nk = w.neck / 2;
  const legTop = 0.03 + w.thigh / 2, legBot = 0.3;
  const lx = y => legTop + (legBot - legTop) * (y - 4.3) / (7.3 - 4.3);
  const right = [
    [nk * 0.95, 0.85], [nk, 1.15], [nk + (sh - nk) * 0.45, 1.36], [Math.max(ch + 0.1, sh - 0.35), 1.55], [ch, 1.98], [ch * 0.97, 2.25],
    [wa, 2.95], [hi * 0.97, 3.35], [hi, 3.6], [lx(4.3) + w.thigh / 2, 4.3],
    [lx(5.1) + 0.23, 5.1], [lx(5.4) + 0.2, 5.4], [lx(5.95) + w.calf * 0.55, 5.95], [lx(6.7) + 0.14, 6.7], [lx(7.3) + 0.11, 7.3], [lx(7.3) + 0.2, 7.62],
    [lx(7.3) - 0.12, 7.65], [lx(7.3) - 0.1, 7.3], [lx(6.6) - 0.1, 6.6], [lx(6.0) - w.calf * 0.45, 6.0], [lx(5.4) - 0.19, 5.4], [lx(4.6) - w.thigh * 0.45, 4.6],
    [0.0, 4.08],
  ];
  const left = right.slice(0, -1).reverse().map(([x, y]) => [-x, y]);
  const body = smoothClosed([...right, ...left]);
  // 腕（右側。左は鏡写し）
  const xa = Math.max(sh - w.arm / 2, ch + w.arm / 2 + 0.03);
  const xe = xa + 0.1, xf = xe + 0.04, xw = xf + 0.03;
  const arm = [
    [ch + 0.02, 1.92], [nk + (sh - nk) * 0.55, 1.4], [sh * 0.93, 1.5], [sh, 1.72], [xa + w.arm / 2, 2.35], [xe + 0.17, 2.95],
    [xf + w.forearm / 2, 3.3], [xw + 0.13, 3.85], [xw + 0.16, 4.3], [xw, 4.45], [xw - 0.15, 4.3], [xw - 0.12, 3.85],
    [xf - w.forearm / 2, 3.3], [xe - 0.15, 2.95], [xa - w.arm / 2, 2.4],
  ];
  const armR = smoothClosed(arm), armL = smoothClosed(arm.map(([x, y]) => [-x, y]));
  // 測定線: [y, x1, x2]
  const lines = {
    neck: [1.12, -nk, nk], shoulder: [1.72, -sh, sh], chest: [2.02, -ch, ch], waist: [2.95, -wa, wa], hip: [3.6, -hi, hi],
    arm: [2.35, xa - w.arm / 2, xa + w.arm / 2], forearm: [3.3, xf - w.forearm / 2, xf + w.forearm / 2],
    thigh: [4.3, -(lx(4.3) + w.thigh / 2), -(lx(4.3) - w.thigh / 2)], calf: [5.95, -(lx(5.95) + w.calf * 0.55), -(lx(5.95) - w.calf * 0.45)],
  };
  return { body, armR, armL, lines };
}
function figureSVG(m, prevM, opts = {}) {
  const widths = {}; const prevW = {};
  for (const k in m?.parts || {}) widths[k] = m.parts[k].wH;
  for (const k in prevM?.parts || {}) prevW[k] = prevM.parts[k].wH;
  const g = figureGeometry(widths);
  const pg = prevM && Object.keys(prevW).length ? figureGeometry(prevW) : null;
  const leftSide = ['neck', 'shoulder', 'chest', 'waist', 'hip', 'thigh'];
  const labels = PARTS.map(p => {
    const ln = g.lines[p.k]; if (!ln) return '';
    const part = m?.parts?.[p.k]; const has = !!part;
    const [y, x1, x2] = ln; const onLeft = leftSide.includes(p.k);
    const tx = onLeft ? -3.15 : 3.15, anchor = onLeft ? 'start' : 'end';
    const ex = onLeft ? x1 : x2;
    const val = has ? fmt(part.value) : '—';
    const pv = prevM?.parts?.[p.k]?.value;
    const dl = has && pv != null ? (part.value - pv) : null;
    const dtxt = dl == null ? '' : (Math.abs(dl) < 0.05 ? '±0.0' : (dl > 0 ? '+' : '−') + Math.abs(dl).toFixed(1));
    const good = dl == null ? null : (PART[p.k].lowerBetter ? dl < 0 : dl > 0);
    const ly = y + ({ neck: -0.17, shoulder: -0.17, chest: 0.13, thigh: 0.05 }[p.k] || 0);
    return `<g opacity="${has ? 1 : 0.45}">
      <line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="0.022" ${has ? '' : 'stroke-dasharray="0.05 0.05"'}/>
      <circle cx="${x1}" cy="${y}" r="0.035" fill="var(--ink)"/><circle cx="${x2}" cy="${y}" r="0.035" fill="var(--ink)"/>
      <line x1="${ex}" x2="${onLeft ? tx + 1.25 : tx - 1.25}" y1="${y}" y2="${ly}" stroke="var(--muted)" stroke-width="0.012"/>
      <text x="${tx}" y="${ly - 0.06}" text-anchor="${anchor}" font-size="0.17" fill="var(--muted)" font-family="var(--body)">${esc(p.short)}</text>
      <text x="${tx}" y="${ly + 0.19}" text-anchor="${anchor}" font-size="0.25" font-weight="700" fill="var(--ink)" font-family="var(--display)">${val}${has && dtxt ? `<tspan font-size="0.17" fill="${dl != null && Math.abs(dl) >= 0.05 ? (good ? 'var(--up)' : 'var(--down)') : 'var(--muted)'}" dx="0.06">${dtxt}</tspan>` : ''}</text>
    </g>`;
  }).join('');
  const prevLayer = pg ? `<g fill="none" stroke="var(--prev)" stroke-width="0.025" stroke-dasharray="0.08 0.05">
      <path d="${pg.body}"/><path d="${pg.armR}"/><path d="${pg.armL}"/></g>` : '';
  return `<svg viewBox="-3.3 -0.15 6.6 7.95" role="img" aria-label="${esc(opts.aria || '推定した体型の図')}">
    <g fill="var(--fig)" stroke="var(--fig-edge)" stroke-width="0.025">
      <path d="${g.body}"/><path d="${g.armR}"/><path d="${g.armL}"/>
      <ellipse cx="0" cy="0.5" rx="0.34" ry="0.5"/>
    </g>
    ${prevLayer}
    <g>
      <line x1="-0.5" x2="0.5" y1="0" y2="0" stroke="var(--accent)" stroke-width="0.02"/>
      <line x1="-0.5" x2="0.5" y1="1" y2="1" stroke="var(--accent)" stroke-width="0.02"/>
      <text x="0.56" y="0.56" font-size="0.15" fill="var(--accent)" font-family="var(--body)">基準</text>
    </g>
    ${labels}
  </svg>`;
}

  BULK.saving = { done: 0, total: jobs.length }; renderBulk();
  let failed = 0;
  for (const job of jobs) {

      const ref = await Store.putPhoto(blob);
      const old = s.photos[job.slot];
      s.photos[job.slot] = { ref, w, h, marks: {} };

async function shrink(file) {

async function drawCompare() {
  const C = S.compare; const out = $('#c-out'); if (!out) return;
  const A = getSession(C.a), B = getSession(C.b);
  const [ia, ib] = await Promise.all([A, B].map(async s => loadImage(await photoURL(s.photos[C.slot].ref)).catch(() => null)));
  const W = 600, H = 900;
  const both = A.photos[C.slot].marks?.head && B.photos[C.slot].marks?.head;
  const place = (ctx, img, ph) => {
    if (!img) return;
    const hm = both ? ph.marks.head : null;
    if (hm) { // 頭の高さを 0.1H に、頭頂を上から 0.07H、頭の中心を左右中央に
      const s = (H * 0.1) / dist(hm[0], hm[1]);
      const top = hm[0][1] < hm[1][1] ? hm[0] : hm[1];
      const cx = (hm[0][0] + hm[1][0]) / 2;
      ctx.drawImage(img, W / 2 - cx * s, H * 0.07 - top[1] * s, img.naturalWidth * s, img.naturalHeight * s);
    } else {
      const s = Math.min(W / img.naturalWidth, H / img.naturalHeight);
      ctx.drawImage(img, (W - img.naturalWidth * s) / 2, (H - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);

  const cap = s => `<figcaption><span class="num">${fmtDate(s.date)}</span>${s.weight ? `<span class="muted">${fmt(+s.weight)} kg</span>` : ''}</figcaption>`;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };

      ctx.fillStyle = '#0d0f12'; ctx.fillRect(0, 0, W, H); place(ctx, img, s.photos[C.slot]);

  else {

  out.append(f);
}

  if (S.tab !== 'profile') return;
  const un = e.target.closest('[data-uncal]');
  if (un) { delete S.profile.calib[un.dataset.uncal]; saveProfile(); renderProfile(); return; }
  if (e.target.closest('[data-act-cal]')) {
    const s = getSession($('#k-session').value), k = $('#k-part').value, tape = +$('#k-tape').value;
    const part = computeMetrics(s).parts[k];
    if (!part) return toast(`その記録では${PART[k].name}の幅がまだ計測されていません`);
    if (!(tape > 0)) return toast('メジャーの値を cm で入れてください');
    const raw = part.rawH * headBasis().cm;
    S.profile.calib = { ...S.profile.calib, [k]: tape / raw };
    saveProfile(); renderProfile(); toast(`${PART[k].name}を × ${(tape / raw).toFixed(3)} で補正します`);
  }
});

/* ====================== 起動 ====================== */
(async function start() {
  try { await Store.init(); }
  catch (e) {
    console.error(e);
    app.innerHTML = '<div class="panel"><h2>記録を保存できません</h2><p>このブラウザでは保存領域が使えません。プライベートブラウズを解除するか、claude.ai で公開したページから開いてください。</p></div>';
    return;
  }
  try {
    const docs = await Store.listDocs();
    for (const d of docs) {
      if (d.id === 'profile') S.profile = { ...S.profile, ...d, calib: d.calib || {} };
      else if (d.id?.startsWith('s_')) S.sessions.push({ photos: {}, ...d });
    }
  } catch (e) { console.error(e); toast('記録を読み込めませんでした。ページを開き直してください'); }
  const t = location.hash.slice(1);
  if (['log', 'compare', 'trend', 'profile'].includes(t)) S.tab = t;
  render();
})();
</script>
