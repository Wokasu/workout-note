<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-->
<title>Kairi Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one console column — the NES-ratio screen on top, controls under it */
:root {
  --bg: #060a14;
  --shell: #0f1a2e;
  --shell-edge: #24385e;
  --ink: #e8f2ff;
  --dim: #8fa3c4;
  --oshi: #78d0f4;
  --btn: #172640;
  --btn-press: #2c4a7a;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "MS Gothic", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.console {
  --reserve: 96px;
  width: min(100%, 768px, calc((100dvh - var(--reserve)) * 256 / 224));
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.screen-wrap {
  background: var(--shell);
  border: 2px solid var(--shell-edge);
  border-radius: 10px;
  padding: 8px;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 256 / 224;
  max-width: 100%;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 2px;
  outline: none;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  font-size: 13px;
  color: var(--dim);
}
.bar kbd {
  font-family: var(--font);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--shell-edge);
  border-radius: 4px;
  padding: 0 6px;
}
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; }
button {
  font-family: var(--font);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--shell-edge);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--oshi); outline-offset: 2px; }
.name-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--dim); }
.name-field[hidden] { display: none; }
.err { margin: 0; font-size: 12px; line-height: 1.5; color: #f8c070; overflow-wrap: anywhere; }
.code-panel textarea {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; line-height: 1.4;
  color: var(--ink); background: #000; border: 2px solid var(--shell-edge); border-radius: 6px;
  padding: 6px 10px; resize: none; word-break: break-all; min-width: 0;
  -webkit-user-select: text; user-select: text;
}
.code-panel .name-row { justify-content: flex-end; }
.code-panel button[hidden] { display: none; }
.name-row { display: flex; gap: 8px; }
.name-row input {
  flex: 1; min-width: 0;
  font-family: var(--font); font-size: 18px;
  color: var(--ink); background: #000;
  border: 2px solid var(--shell-edge); border-radius: 6px; padding: 6px 10px;
  -webkit-user-select: text; user-select: text;
}
.name-row input:focus-visible { outline: 2px solid var(--oshi); outline-offset: 1px; }
.pad {
  display: none;
  justify-content: space-between;
  align-items: center;
  padding: 4px 6px 0;
  touch-action: none;
}
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  grid-template-rows: repeat(3, 54px);
}
.dpad button, .ab button {
  padding: 0;
  font-size: 18px;
  touch-action: none;
}
.dpad button.on, .ab button.on { background: var(--btn-press); }
.dpad .u { grid-area: 1 / 2; border-radius: 8px 8px 0 0; }
.dpad .l { grid-area: 2 / 1; border-radius: 8px 0 0 8px; }
.dpad .r { grid-area: 2 / 3; border-radius: 0 8px 8px 0; }
.dpad .d { grid-area: 3 / 2; border-radius: 0 0 8px 8px; }
.dpad .c { grid-area: 2 / 2; background: var(--btn); border-radius: 0; pointer-events: none; }
.ab { display: flex; gap: 18px; align-items: center; transform: rotate(-12deg); }
.ab button {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--oshi); border-color: #cdeefc; color: #0a2440; font-size: 20px;
}
.ab .b { background: #3a86d8; margin-top: 34px; }
.ab button.on { background: #e4f6ff; color: #0a2440; }
@media (pointer: coarse) {
  .console { --reserve: 270px; }
  .pad { display: flex; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
<!--/PAGE-->
</head>
<body>
<!--BODY-->
<div class="console">
  <div class="screen-wrap"><canvas id="screen" tabindex="0" aria-label="Kairi Quest ゲーム画面"></canvas></div>
  <div class="name-field" id="name-field" hidden>
    <label for="hero-name">キーボードで入力（漢字もOK・6文字まで）</label>
    <div class="name-row">
      <input id="hero-name" type="text" maxlength="6" autocomplete="off" enterkeyhint="done" placeholder="アオ太">
      <button id="name-ok" type="button">けってい</button>
    </div>
  </div>
  <div class="name-field code-panel" id="code-panel" hidden>
    <label id="code-label" for="code-text">ふっかつのじゅもん</label>
    <textarea id="code-text" rows="3" spellcheck="false" autocomplete="off"></textarea>
    <div class="name-row">
      <button id="code-copy" type="button">コピー</button>
      <button id="code-ok" type="button">けってい</button>
      <button id="code-close" type="button">とじる</button>
    </div>
  </div>
  <p class="err" id="err" hidden></p>
  <div class="bar">
    <div class="keys">
      <span><kbd>↑↓←→</kbd> いどう</span>
      <span><kbd>Z</kbd> <kbd>Enter</kbd> けってい・はなす</span>
      <span><kbd>X</kbd> <kbd>Esc</kbd> キャンセル・メニュー</span>
    </div>
    <button id="sound" type="button" aria-pressed="true">サウンド ON</button>
  </div>
  <div class="pad" aria-hidden="true">
    <div class="dpad">
      <button class="u" data-k="up" type="button">▲</button>
      <button class="l" data-k="left" type="button">◀</button>
      <span class="c"></span>
      <button class="r" data-k="right" type="button">▶</button>
      <button class="d" data-k="down" type="button">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" type="button">B</button>
      <button class="a" data-k="a" type="button">A</button>
    </div>
  </div>
</div>
<script>
'use strict';
// ============================================================
//  Kairi Quest 〜蒼のメロディ〜 （百花クエスト 続編・非公式ファンゲーム）
// ============================================================
const W = 256, H = 224, S = 3, TS = 16;
const cv = document.getElementById('screen');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
const FONT = '"DotGothic16", "Hiragino Kaku Gothic ProN", "MS Gothic", monospace';
function resetT() { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false; }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ------------------------------------------------------------
//  Palette & sprites
// ------------------------------------------------------------
const PAL = {

  g: '#a0a0ae', G: '#4a4a5a', r: '#d83838', R: '#8a1c1c', y: '#f8d838',
  n: '#8a5a30', e: '#3a9a3a', o: '#f89838', c: '#78d8f8', m: '#f890b8',
  H: '#f8f8f8', Y: '#d83838',
};

const TPL = {
  hero_down: { rows: [
    '....kkkkkkkk....', '...khhhhhhhhk...', '..khHHYHHYHHhk..', '..khhhhhhhhhhk..',
    '..ksGGGssGGGsk..', '..ksGcGssGcGsk..', '..kssssSSssssk..', '...ksssrrsssk...',
    '....kkSSSSkk....', '..kpppwwwwpppk..', '.kspppwwwwpppsk.', '.kspppwyywpppsk.',
    '..kPPPPPPPPPPk..', '...kbbbbbbbbk...', '...kbbk..kbbk...', '...kkkk..kkkk...'],
    alt: { 14: '....kbbbbbbk....', 15: '....kkkkkkkk....' } },
  hero_up: { rows: [

    '.....kSSSSk.....', '...knpppppwk....', '..knnppppswk....', '..knnpppppsk....',
    '...knPPPPPPk....', '....kbbbbbbk....', '...kbbk..kbbk...', '...kkkk..kkkk...'],

    '.kpppwwwwwwpppk.', 'kspppwwwwwwpppsk', 'kspppwwwwwwpppsk', 'kspppwwyywwpppsk',
    '.kPPPPPPPPPPPPk.', '..kbbbbbbbbbbk..', '..kbbbk..kbbbk..', '..kkkkk..kkkkk..'],
    alt: { 14: '...kbbbbbbbbk...', 15: '...kkkkkkkkkk...' } },
  girl_down: { rows: [

    '..khhsssssshhk..', '..khskwsswkshk..', '..khskksskkshk..', '..khsmssssmshk..',
    '..khhssrrsshhk..', '..khkppwwppkhk..', '.kshpppwwppphsk.', '.kskppppppppksk.',
    '..kwlwlwlwlwlk..', '.kppppppppppppk.', '...kssk..kssk...', '...kPPk..kPPk...'],
    alt: { 14: '....kssssssk....', 15: '....kPPPPPPk....' } },
  girl_up: { rows: [
    '...kpkkkkkkpk...', '..kplhhhhhhlpk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..', '..khhpppppphhk..', '.kshpppppppphsk.', '.kskppppppppksk.',
    '..kwlwlwlwlwlk..', '.kppppppppppppk.', '...kssk..kssk...', '...kPPk..kPPk...'],

  maou: { rows: [
    '.r....kkkk....r.', '.rk..khhhhk..kr.', '..rkkhhhhhhkkr..', '...khhhhhhhhk...',
    '..ksGrGssGrGsk..', '..ksGGGssGGGsk..', '..kssssssssssk..', '..ksswkkkkwssk..',
    '.GGkSSSSSSSSkGG.', 'GrrkPPPwwPPPkrrG', 'GrrksPPwwPPskrrG', 'GrrksPPyyPPskrrG',
    'GrrrkPPPPPPkrrrG', 'GGrrkBBBBBBkrrGG', 'GGGrkBBkkBBkrGGG', 'GGGGkkk..kkkGGGG'],
    alt: { 15: 'GGGGkkkkkkkkGGGG' } },
  manhole: { rows: [
    '................', '................', '....kkkkkkkk....', '...kGGGGGGGGk...',
    '..kGgGgGgGgGGk..', '..kGGGGGGGGGGk..', '..kGgGgGgGgGGk..', '..kGGGGGGGGGGk..',
    '..kGgGgGgGgGGk..', '..kGGGGGGGGGGk..', '..kGgGgGgGgGGk..', '...kGGGGGGGGk...',
    '....kkkkkkkk....', '................', '................', '................'] },
  memo: { rows: [

    '.....kwwwwwk....', '.....kwGGwwk....', '.....kwwwwwk....', '.....kkkkkkk....',

};

const sprCache = {};
function buildSprite(rows, map) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (!ch || ch === '.') continue;
      const m = map && map[ch] !== undefined ? map[ch] : ch;
      if (m === '.') continue;
      g.fillStyle = PAL[m] || m;
      g.fillRect(x, y, 1, 1);
    }
  });
  return c;
}
function bigSprite(rows, extra) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '.') return; g.fillStyle = extra[ch] || PAL[ch] || ch; g.fillRect(x, y, 1, 1); }));
  return c;
}
function mirror(c) {
  const m = document.createElement('canvas'); m.width = m.height = 16;
  const g = m.getContext('2d'); g.translate(16, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return m;
}
function frames(tpl, map) {
  const t = TPL[tpl];
  const f1 = buildSprite(t.rows, map);
  const rows2 = t.rows.slice();
  if (t.alt) for (const k in t.alt) rows2[k] = t.alt[k];
  return [f1, buildSprite(rows2, map)];
}
// a character set: {down, up, left, right} → [frame1, frame2]
function charSet(kind, map) {
  if (kind === 'hero') {
    const d = frames('hero_down', map), u = frames('hero_up', map), r = frames('hero_right', map);
    return { down: d, up: u, right: r, left: r.map(mirror) };
  }
  if (kind === 'girl') {
    const d = frames('girl_down', map), u = frames('girl_up', map);
    return { down: d, up: u, right: d, left: d };
  }
  const d = frames(kind, map);
  return { down: d, up: d, right: d, left: d };
}
const NOBAND = { H: 'h', Y: 'h' };

Object.assign(TPL, {
  mic: { rows: [
    '................', '......kkkk......', '.....kGgGgk.....', '.....kgGgGk.....',
    '.....kGgGgk.....', '......kkkk......', '.......kk.......', '.......kG.......',
    '.......kG.......', '.......kG.......', '.......kG.......', '.......kG.......',
    '.......kG.......', '.....kkkkkk.....', '....kGGGGGGk....', '................'] },
});
// a small canvas painted with p(x, y, w, h, colour)
function paint(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  fn((x, y, ww, hh, col) => { g.fillStyle = PAL[col] || col; g.fillRect(x, y, ww, hh); }, g);
  return c;
}
function cloneC(src) { return paint(src.width, src.height, (p, g) => g.drawImage(src, 0, 0)); }
// カイリ's blue guitar held across the body: body lower left, neck up to the right
function guitarOn(c) {
  const g = c.getContext('2d'), r = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  r(1, 10, 5, 4, '#2f6cc0'); r(2, 9, 3, 6, '#2f6cc0'); r(2, 11, 2, 2, '#120c18'); r(1, 10, 1, 1, '#78c8f0'); r(5, 13, 1, 1, '#1a3a78');
  [[6, 10], [7, 10], [8, 9], [9, 9], [10, 9], [11, 8], [12, 8]].forEach(([x, y]) => r(x, y, 1, 1, '#c8a060'));
  r(13, 7, 2, 1, '#5a3418'); r(14, 6, 1, 1, '#5a3418');
  return c;
}
const still = c => ({ down: [c, c], up: [c, c], left: [c, c], right: [c, c] });
// the static blob Mute leaves behind; seed changes the grain
function noiseArt(seed, cols, eye) {
  return paint(16, 16, p => {
    let s = seed; const r = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let y = 1; y < 16; y++) for (let x = 1; x < 15; x++) {
      const d = Math.hypot(x - 7.5, (y - 8.5) * 1.1);
      if (d < 6.2 + r() * 1.4) p(x, y, 1, 1, cols[Math.floor(r() * cols.length)]);
    }
    p(4, 6, 3, 3, '#f8f8f8'); p(9, 6, 3, 3, '#f8f8f8'); p(5, 7, 1, 1, eye); p(10, 7, 1, 1, eye);
    p(5, 11, 6, 1, '#120c18'); p(6, 12, 1, 1, '#120c18'); p(9, 12, 1, 1, '#120c18');
  });
}
// 無音魔王ミュート: a hooded figure with a muted mask, holding カイリ's voice as a blue orb
function muteArt(orb) {
  return paint(32, 32, p => {
    p(10, 1, 12, 2, '#3a3a52'); p(8, 3, 16, 4, '#3a3a52'); p(6, 7, 20, 6, '#3a3a52');
    p(4, 13, 24, 17, '#2a2a3a'); p(2, 18, 28, 12, '#2a2a3a'); p(1, 30, 30, 2, '#1a1a26');
    p(9, 3, 1, 10, '#24243a'); p(22, 3, 1, 10, '#24243a');
    p(11, 5, 10, 10, '#e8e8f0'); p(12, 15, 8, 2, '#e8e8f0'); p(11, 5, 10, 1, '#c8c8d8'); p(11, 14, 1, 1, '#c8c8d8'); p(20, 14, 1, 1, '#c8c8d8');
    p(13, 8, 2, 2, orb ? '#5a6a8a' : '#78c8f0'); p(17, 8, 2, 2, orb ? '#5a6a8a' : '#78c8f0');
    if (orb) { p(14, 12, 1, 1, '#120c18'); p(17, 12, 1, 1, '#120c18'); p(15, 13, 2, 1, '#120c18'); p(14, 14, 1, 1, '#120c18'); p(17, 14, 1, 1, '#120c18'); }
    else { p(14, 12, 4, 1, '#120c18'); p(13, 11, 1, 1, '#120c18'); p(18, 11, 1, 1, '#120c18'); p(12, 10, 1, 1, '#78c8f0'); }
    p(4, 13, 24, 1, '#8a9ab8'); p(15, 17, 2, 13, '#8a9ab8');
    p(6, 19, 4, 7, '#3a3a52'); p(22, 19, 4, 7, '#3a3a52');
    if (orb) { p(23, 15, 7, 7, '#78d8f8'); p(24, 14, 5, 9, '#78d8f8'); p(25, 16, 3, 3, '#e4f6ff'); p(22, 16, 1, 5, '#3a78d8'); p(30, 16, 1, 5, '#3a78d8'); p(24, 22, 5, 1, '#3a78d8'); }
    else { p(23, 18, 3, 3, '#4a4a5a'); }

    if (orb) [[17, 20], [19, 22], [17, 24], [21, 20], [21, 24]].forEach(([x, y]) => p(x, y, 1, 1, '#d83838'));
    else [[17, 21], [18, 20], [19, 21], [20, 22], [21, 21]].forEach(([x, y]) => p(x, y, 1, 1, '#78d8f8'));
  });
}
const SPR = {};
const KAIRI_MAP = { p: '#8ad8f8', P: '#3a78d8', l: '#ffffff' };
function initSprites() {
  SPR.hero = charSet('hero', { p: '#78c8f0', P: '#2f6cc0', Y: '#2f6cc0' });
  SPR.legend = charSet('hero');
  SPR.momoka = charSet('girl');
  SPR.kairi = charSet('girl', KAIRI_MAP);
  const kg = SPR.kairi.down.map(c => guitarOn(cloneC(c)));
  SPR.kairiG = { down: kg, up: kg, left: kg, right: kg };
  SPR.oya = charSet('girl', { h: 'g', p: '#6a8ac8', P: '#3a5a98', l: 'w', m: 's', r: 'S' });
  SPR.girl = charSet('girl', { h: 'n', p: 'm', P: '#b85a88', l: 'w' });

// collected equipment: every piece ever obtained stays in P.ownW / P.ownA
function ensureOwned() {
  const w = new Set(P.ownW || []), a = new Set(P.ownA || []);
  w.add(0); w.add(P.w); a.add(0); a.add(P.a);
  for (const id in MAPS) for (const c of MAPS[id].chests || []) if (flags.chests && flags.chests[c.id]) { if (c.weapon !== undefined) w.add(c.weapon); if (c.armor !== undefined) a.add(c.armor); }
  P.ownW = [...w].filter(i => WEAPONS[i]).sort((x, y) => x - y); P.ownA = [...a].filter(i => ARMORS[i]).sort((x, y) => x - y);
}
// adds a piece to the collection and equips it only when it is stronger; returns true if equipped
function gainGear(t, id) {
  ensureOwned();
  const own = t === 'w' ? P.ownW : P.ownA; if (!own.includes(id)) { own.push(id); own.sort((x, y) => x - y); }
  if (t === 'w' ? WEAPONS[id].atk > WEAPONS[P.w].atk : ARMORS[id].def > ARMORS[P.a].def) { if (t === 'w') P.w = id; else P.a = id; return true; }
  return false;
}
async function equipMenu() {

  while (true) {
    const c = await chooseMenu(cat);
    if (c === -1 || c === 2) break;
    while (true) {
      const t = c === 0 ? 'w' : 'a', ids = t === 'w' ? P.ownW : P.ownA;
      const items = ids.map(id => { const g = t === 'w' ? WEAPONS[id] : ARMORS[id]; return { label: ((t === 'w' ? P.w : P.a) === id ? 'E ' : '  ') + g.name, right: '+' + (t === 'w' ? g.atk : g.def) }; });
      const r = await pick({ items, x: 84, y: 40, w: 164, info: i => gearInfo(t, ids[i]) });
      if (r < 0) break;
      const id = ids[r], g = t === 'w' ? WEAPONS[id] : ARMORS[id];
      if ((t === 'w' ? P.w : P.a) === id) continue;

// Saves go to up to two places: the player's private slot in the artifact's db (signed-in players

const STORE = { local: false, cloud: null, cloudState: 'pending', cloudData: null, cloudJson: '', cloudAt: 0, writing: false, onChange: null };

  try { const k = SAVE_KEY + '.probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; }

async function initCloud() {
  const done = state => { STORE.cloudState = state; if (STORE.onChange) STORE.onChange(); };
  try {
    if (!window.claude || !window.claude.use) return done('off');
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return done('off');
    if (user.can && (await user.can('data.write')) === false) return done('off');
    STORE.cloud = db.doc('data/users/' + uid + '/save');
    const snap = await STORE.cloud.get();
    STORE.cloudData = snap.exists ? snap.data() : null;
    if (STORE.cloudData) { const { savedAt, ...rest } = STORE.cloudData; STORE.cloudJson = JSON.stringify(rest); }
    done('on');
  } catch (e) { done('off'); }
}

function saveGame(force, state) {
  const json = JSON.stringify(state || saveState()), now = Date.now();
  let ok = false;
  if (STORE.local) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...JSON.parse(json), savedAt: now })); ok = true; } catch (e) { STORE.local = false; }
  }
  if (STORE.cloudState === 'on') {
    ok = true;
    // the cloud copy is written on a change, at most every 20 s while walking, right away when forced
    if (json !== STORE.cloudJson && !STORE.writing && (force || now - STORE.cloudAt > 20000)) {
      STORE.writing = true; STORE.cloudAt = now;
      let w;
      try { w = STORE.cloud.set({ ...JSON.parse(json), savedAt: now }); } catch (e) { w = Promise.reject(e); }
      w
        .then(() => { STORE.cloudJson = json; STORE.cloudData = { ...JSON.parse(json), savedAt: now }; },
          e => { if (e && ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(e.code)) STORE.cloudState = 'off'; })
        .finally(() => { STORE.writing = false; });
    }
  }
  return ok;
}

  const cloud = STORE.cloudState === 'on' ? STORE.cloudData : null;
  const pick = local && cloud ? ((cloud.savedAt || 0) > (local.savedAt || 0) ? cloud : local) : local || cloud;

const bitsOf = arr => arr.reduce((a, v, i) => a | (v ? 1 << i : 0), 0);
const codeSum = t => { let h = 7; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) % 1296; return h.toString(36).padStart(2, '0'); };
// --- ふっかつのじゅもん: the whole save packed into one copyable code
const CODE_MAPS = ['town', 'field', 'gakki', 'shimo', 'kara1', 'kara2', 'fes', 'castle1', 'castle2'];
const CODE_FLAGS = ['show', 'stolen', 'kairi', 'tut', 's1', 's2', 's3', 's4', 'shimoSeen', 'band', 'fesSeen', 'barrierOpen', 'castleSeen', 'voice', 'mute', 'cleared', 'karaSeen', 'gakkiSeen'];
const CODE_CHESTS = ['g1', 'g2', 'g3', 'm1', 'm2', 'm3', 'k1', 'k2', 'k3', 'f1', 'f2', 'f3', 'c1', 'c2', 'c3', 'c4'];
const CODE_ITEMS = ['drink', 'drink2', 'lemon', 'letter'];
function makeCode() {
  ensureOwned();
  const a = [2, P.name, P.lv, P.hp, P.mhp, P.mp, P.mmp, P.str, P.vit, P.agi, P.exp, P.gold, P.w, P.a,
    CODE_ITEMS.map(k => Math.min(9, P.items[k] || 0)).join(''), bitsOf(CODE_FLAGS.map(k => flags[k])),
    bitsOf(CODE_CHESTS.map(k => flags.chests[k])), CODE_MAPS.indexOf(game.mapId), player.x, player.y, flags.cycle || 0,
    bitsOf(WEAPONS.map((_, i) => P.ownW.includes(i))), bitsOf(ARMORS.map((_, i) => P.ownA.includes(i))), P.k.hp, P.k.mp];
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(a)))).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
  return b + codeSum(b);
}
// returns a save object, or null when the code is wrong
function parseCode(text) {
  try {
    const t = String(text).replace(/[\s「」]/g, '');
    const body = t.slice(0, -2);
    if (t.length < 10 || codeSum(body) !== t.slice(-2)) return null;
    const a = JSON.parse(decodeURIComponent(escape(atob(body.replace(/-/g, '+').replace(/_/g, '/')))));
    if (!Array.isArray(a) || a[0] !== 2 || a.length !== 25) return null;
    const n = a.slice(2, 14);
    if (typeof a[1] !== 'string' || !n.every(v => Number.isInteger(v) && v >= 0 && v < 1e6)) return null;
    const [lv, hp, mhp, mp, mmp, str, vit, agi, exp, gold, w, ar] = n;
    if (lv < 1 || lv > MAX_LV || !WEAPONS[w] || !ARMORS[ar] || !CODE_MAPS[a[17]]) return null;
    const items = {};
    String(a[14]).split('').forEach((d, i) => { if (+d > 0 && CODE_ITEMS[i]) items[CODE_ITEMS[i]] = +d; });
    const fl = { chests: {} };
    CODE_FLAGS.forEach((k, i) => { if (a[15] & (1 << i)) fl[k] = true; });
    CODE_CHESTS.forEach((k, i) => { if (a[16] & (1 << i)) fl.chests[k] = 1; });
    if (Number.isInteger(a[20]) && a[20] > 0 && a[20] < 100) fl.cycle = a[20];
    const own = (v, list) => Number.isInteger(v) ? list.map((_, i) => i).filter(i => v & (1 << i)) : [];
    const map = CODE_MAPS[a[17]], m = MAPS[map];
    const x = clamp(a[18] | 0, 0, m.w - 1), y = clamp(a[19] | 0, 0, m.h - 1);
    return { P: { name: Array.from(a[1]).slice(0, NAME_MAX).join('') || 'アオ太', lv, hp: Math.min(hp, mhp), mhp, mp: Math.min(mp, mmp), mmp, str, vit, agi, exp, gold, w, a: ar, items,
      ownW: own(a[21], WEAPONS), ownA: own(a[22], ARMORS), k: { hp: a[23] | 0, mp: a[24] | 0 } }, flags: fl, map, x, y, dir: 'down' };
  } catch (e) { return null; }
}

// mode 'show' displays a code to copy; 'input' takes one. Resolves with the entered text or null.
function openCodePanel(mode, text) {
  codePanel.hidden = false;

  codeLabel.textContent = mode === 'show' ? 'ふっかつのじゅもん：コピーして メモしておこう' : 'ふっかつのじゅもんを ここに はりつけてね';
  codeCopy.hidden = mode !== 'show'; codeOk.hidden = mode === 'show';
  codeCopy.textContent = 'コピー';
  return new Promise(res => {
    const done = v => {
      codePanel.hidden = true; modal = null;
      codeCopy.onclick = codeOk.onclick = codeClose.onclick = null;
      cv.focus(); res(v);
    };
    codeOk.onclick = () => done(codeText.value);
    codeClose.onclick = () => done(null);
    codeCopy.onclick = () => {
      const fallback = () => { codeText.focus(); codeText.select(); codeCopy.textContent = '選択したよ'; };
      try { navigator.clipboard.writeText(codeText.value).then(() => { codeCopy.textContent = 'コピーしました'; }, fallback); } catch (e) { fallback(); }
    };
    modal = k => { if (k === 'b' || (k === 'a' && mode === 'show')) done(null); };
  });
}

  let tx = player.x + dx, ty = player.y + dy;
  const m = game.map;
  if (tileAt(m, tx, ty) === 'C') { tx += dx; ty += dy; }
  const n = game.npcs.find(n => npcVisible(n) && n.x === tx && n.y === ty);
  if (n && n.talk) {
    if (!n.fixed) n.dir = OPP[player.dir];
    runScript(async () => { await n.talk(n); });
    return;
  }
  if (followerOn() && FOL.x === tx && FOL.y === ty && !FOL.mv) { runScript(kairiTalk); return; }
  const c = m.chests.find(c => c.x === player.x + dx && c.y === player.y + dy);
  if (c) { runScript(() => openChest(c)); return; }
}
async function openChest(c) {
  if (flags.chests[c.id]) { await say('からっぽだ。'); return; }
  flags.chests[c.id] = 1; sfx('door');
  if (c.gold) { P.gold += c.gold; await say(`たからばこを あけた！\n${c.gold}円を てにいれた！`); return; }
  for (const [t, key, list] of [['w', 'weapon', WEAPONS], ['a', 'armor', ARMORS]]) {
    if (c[key] === undefined) continue;
    await say(`たからばこを あけた！\n${list[c[key]].name}を てにいれた！`, { noWait: true }); await jingle('get'); playBgm(game.map.bgm);
    if (gainGear(t, c[key])) await say(`アオ太は ${list[c[key]].name}を そうびした！`);
    else await waitA();
    return;
  }
  addItem(c.item, c.n || 1);
  await say(`たからばこを あけた！\n${ITEMS[c.item].name}を てにいれた！`);
}

}
const partyWins = (x = 8, y = 8) => () => { memberWin(HERO, x, y, true); if (flags.kairi) memberWin(KAIRI, x, y + 76, false); };

// choose one party member; filter decides who can be picked. Skips the menu when there is only one.
async function pickMember(filter = () => true, o = {}) {
  const ms = party();
  if (ms.length === 1) return filter(ms[0]) ? ms[0] : null;
  const items = ms.map(m => ({ label: m.name, right: `${m.hp}/${m.mhp}`, disabled: !filter(m) }));
  const r = await pick({ items, x: o.x || 92, y: o.y || 40, w: 156, idx: Math.max(0, ms.findIndex(filter)) });
  return r < 0 ? null : ms[r];
}

function itemList() { return Object.keys(P.items).filter(id => P.items[id] > 0); }
// user: the member using it in battle (null on the field). Returns true if a turn was used.

  const items = ids.map(id => ({ label: ITEMS[id].name, right: '×' + P.items[id] }));
  const r = await pick({ items, x: inBattle ? 92 : 84, y: inBattle ? 8 : 40, w: 156, info: i => itemInfo(ids[i]) });
  if (r < 0) return false;
  const id = ids[r], it = ITEMS[id];
  const t = await pickMember(m => it.kind === 'revive' || m.hp > 0);
  if (!t) return false;
  useItemCount(id);
  const who = user ? user.name : 'アオ太', o = inBattle ? { append: true, auto: 45 } : {};
  if (it.kind === 'hp') {
    const v = Math.min(t.mhp - t.hp, it.v); t.hp += v; sfx('heal');
    await say(`${who}は ${it.name}を つかった！\n${t.name}の HPが ${v} かいふくした！`, o);
  } else if (it.kind === 'mp') {
    const v = Math.min(t.mmp - t.mp, it.v); t.mp += v; sfx('heal');
    await say(`${who}は ${it.name}を つかった！\n${t.name}の MPが ${v} かいふくした！`, o);
  } else if (it.kind === 'revive') {
    sfx('heal');
    if (t.hp <= 0) { t.hp = Math.ceil(t.mhp / 2); await say(`${who}は ${it.name}を わたした！\n${t.name}は 想いを うけとって\nふっかつした！`, o); }
    else { const v = Math.min(t.mhp - t.hp, it.v); t.hp += v; await say(`${who}は ${it.name}を わたした！\n${t.name}の HPが ${v} かいふくした！`, o); }
  }
  if (!inBattle) closeMsg();
  return true;
}
function learned(who) { return SKILLS.filter(s => s.who === who && (s.flag ? flags[s.flag] : (s.lv || 0) <= P.lv)); }
const healKind = s => s.kind === 'heal' || s.kind === 'healAll';
// battle: returns the chosen skill (or null)
async function skillPick(m, inBattle) {
  const list = learned(m.id);
  const items = list.map(s => ({ label: s.name, right: 'MP' + s.mp, disabled: !inBattle && !healKind(s) }));

// field: heal skills only
async function skillMenu() {
  const caster = flags.kairi ? await pickMember(() => true, { x: 84, y: 40 }) : HERO;

const battleS = { e: null, blink: 0, alpha: 1, bg: 'field', st: {} };
const ST = id => battleS.st[id] || (battleS.st[id] = {});
const A = { append: true };
const au = n => ({ append: true, auto: n });
function pickMove(e) {
  const tot = e.moves.reduce((a, m) => a + m[0], 0); let r = Math.random() * tot;
  for (const m of e.moves) { r -= m[0]; if (r < 0) return m; }
  return e.moves[0];
}
function dmgTo(atk, def) { const b = atk - def / 2; return Math.max(0, Math.floor(b * (0.85 + Math.random() * 0.3))); }
// 無断録音 lowers everyone's defence for the rest of the battle (30% per post, down to 40%)
const memDef = m => m.def * Math.max(0.4, 1 - 0.3 * (battleS.pdown || 0));
function pickTarget() { const a = alive(); if (a.length < 2) return a[0]; return chance(0.55) ? a[0] : a[1]; }
async function hurt(m, d) {
  if (ST(m.id).guard && d > 0) d = Math.max(1, Math.floor(d / 2));
  m.hp = Math.max(0, m.hp - d);
  if (d > 0) { sfx('hurt'); game.shake = 14; game.flash = 3; await say(`${m.name}は ${d}ポイントの\nダメージを うけた！`, au(34)); }
  else { sfx('miss'); await say(`ミス！ ${m.name}は ダメージを うけない！`, au(34)); }
  if (m.hp <= 0) await say(`${m.name}は たおれた！`, au(40));
}
async function enemyHurt(e, d) {
  if (e.guard && d > 0) { d = Math.max(1, Math.floor(d / 2)); e.guard = 0; }
  e.hp = Math.max(0, e.hp - d);
  // ミュート cannot fall before カイリ's voice comes back
  if (e.id === 'mute' && !flags.voice && e.hp <= 0) e.hp = 1;
  if (d > 0) { battleS.blink = 16; await say(`${e.short || e.name}に ${d}ポイントの\nダメージを あたえた！`, au(34)); }
  else { sfx('miss'); await say(`ミス！ ${e.short || e.name}に\nダメージを あたえられない！`, au(34)); }
}
async function memberAct(m, e, act) {
  const nm = e.short || e.name;
  if (act.type === 'attack') {
    await say(m === HERO ? `${m.name}の こうげき！` : 'カイリは ギターを かき鳴らした！', au(22));
    if (chance(1 / 20)) { sfx('crit'); await say('かいしんの いちげき！！', au(26)); await enemyHurt(e, Math.floor(m.atk * (1.8 + Math.random() * 0.4))); }
    else if (chance(1 / 18)) { sfx('miss'); await say(`ミス！ ${nm}は ひらりと かわした！`, au(34)); }
    else { sfx('hit'); await enemyHurt(e, Math.max(1, dmgTo(m.atk, e.def))); }
  } else if (act.type === 'guard') {
    await say(`${m.name}は 身を まもっている。`, au(30));
  } else if (act.type === 'stunned') {
    await say(`${m.name}は うごけない……`, au(36));
  } else if (act.type === 'skill') await useSkill(m, e, act.skill, act.target);
}
async function useSkill(m, e, s, target) {
  if (m.mp < s.mp) { await say(`${m.name}は ${s.name}を つかおうとした！\nしかし MPが たりない！`, au(40)); return; }
  if ((battleS.hush || (m === KAIRI && battleS.silence > 0)) && s.kind !== 'taunt') { await say(`${m.name}は ${s.name}を つかおうとした！\nしかし 音が 封じられている！`, au(40)); return; }
  m.mp -= s.mp; sfx('skill');
  if (s.kind === 'taunt') { await taunt(e, s); return; }
  if (s.kind === 'clap') {
    await say(`${m.name}は ハンドクラップで\nリズムを きざんだ！`, au(30));
    if (flags.kairi && KAIRI.hp > 0) { battleS.clap = 1.5; await say('カイリの つぎの 演奏が\nもりあがる！', au(30)); }
    else await say('……しかし 合わせる 音が ない。', au(30));
    return;
  }
  await say(`${m.name}は ${s.name}を ${m === HERO ? 'となえた' : '演奏した'}！`, au(22));
  await say(s.text, au(26));
  let boost = 1;
  if (m === KAIRI && battleS.clap) { boost = battleS.clap; battleS.clap = 0; await say('手拍子に のって 音が はずむ！', au(26)); }
  const heal = async (t, v) => { v = Math.min(t.mhp - t.hp, Math.round(v)); t.hp += v; sfx('heal'); await say(`${t.name}の HPが ${v} かいふくした！`, au(30)); };
  const hit = mult => enemyHurt(e, Math.max(1, Math.floor(dmgTo(m.atk, e.def * 0.5) * mult * boost)));
  if (s.kind === 'heal') await heal(target && target.hp > 0 ? target : m, (rnd(s.pow[0], s.pow[1]) + P.lv) * boost);
  else if (s.kind === 'healAll') {
    for (const t of alive()) await heal(t, (rnd(s.pow[0], s.pow[1]) + P.lv) * boost);
    if (s.cure && (battleS.silence || battleS.pdown || (battleS.atkMul || 1) < 1)) { battleS.silence = 0; battleS.pdown = 0; battleS.atkMul = 1; await say('音の ちからで\nふしぎな 呪いが とけた！', au(34)); }
  } else if (s.kind === 'multi') {
    for (let i = 0; i < s.hits && e.hp > 0; i++) { sfx('hit'); await hit(s.mult); }
  } else if (s.kind === 'melody') {
    sfx('crit'); burst(168, 70, 'note', 10); await hit(s.mult);
    for (const t of alive()) await heal(t, t.mhp / 2);
  } else { sfx('hit'); await hit(s.mult); }
}
async function taunt(e, s) {
  const nm = e.short || e.name;
  // the first taunt of a battle always hits the enemy's pride; after that mix in the common lines
  const own = [].concat(TAUNT_FOR[e.id] || []);
  const pool = own.length && (!battleS.taunted || chance(0.6)) ? own : TAUNTS;
  let fresh = pool.filter(l => l !== battleS.lastTaunt);
  if (!fresh.length) fresh = TAUNTS.filter(l => l !== battleS.lastTaunt);
  const line = fresh[rnd(0, fresh.length - 1)];
  battleS.taunted = true; battleS.lastTaunt = line;
  await say('アオ太は 煽った！', au(22));
  await say(`「${line}」`, au(50));
  await say(`${nm}の 心に ぐさっと 刺さった！`, au(26));
  sfx('hit');
  await enemyHurt(e, Math.max(1, Math.floor(dmgTo(atkOf(), e.def) * s.mult)));
  if (e.hp <= 0) return;
  if (chance(e.boss ? 0.25 : 0.5)) { e.stun = 1; await say(`${nm}は 心が折れて うごけない！`, au(40)); }
  else await say(`${nm}は 聞こえないふりを した！`, au(36));
}
async function enemyAct(e) {
  const nm = e.short || e.name;
  if (e.stun) { e.stun = 0; await say(`${nm}は ショックで うごけない！`, au(36)); return; }

    await say(`${nm}は ${text}`, au(30));

    await say(`${nm}の HPが ${v} かいふくした！`, au(30));
  } else if (type === 'idle') await say(`${nm}は ${text}`, au(34));
  else if (type === 'silence') {
    await say(`${nm}は ${text}`, au(34));
    battleS.silence = Math.max(battleS.silence || 0, mult + 1);

  } else if (type === 'hush') {
    await say(`${nm}は ${text}`, au(40));

    await say('つぎの ターン、 だれも\nスキルが つかえない！', au(40));
  } else if (type === 'stun' || type === 'lecture') {
    await say(`${nm}は ${text}`, au(36));
    if (chance(mult)) { ST(tg.id).stun = 1; await say(type === 'lecture' ? `${tg.name}は 話に 聞き入って\nつぎの ターン うごけない！` : `${tg.name}は つかまって\nつぎの ターン うごけない！`, au(40)); }
    else await say(type === 'lecture' ? `${tg.name}は 聞き流した！` : `${tg.name}は ふりほどいた！`, au(32));
  } else if (type === 'mic') {
    await say(`${nm}は ${text}`, au(36));
    ST('k').stun = 1;
    await say('カイリは 順番を 待っている……\nつぎの ターン うごけない！', au(40));
  } else if (type === 'judge') {
    await say(`${nm}は ${text}`, au(36));
    if ((battleS.atkMul || 1) > 0.75) { battleS.atkMul = Math.max(0.7, (battleS.atkMul || 1) * mult); await say('みんなの こうげき力が さがった！', au(34)); }
    else await say('しかし もう 減点する ところが ない！', au(34));
  } else if (type === 'expose') {
    await say(`${nm}は ${text}`, au(40));

    else await say('しかし もう これ以上は さがらない！', au(34));
  } else if (type === 'copy') {
    // 耳コピ / ハモり / 録音: replays whatever the party did last
    const la = battleS.lastAct, sk = la && la.skill;
    await say(`${nm}は さっきの 演奏を\nそっくり まねした！`, au(30));
    if (!sk || sk.kind === 'atk' || sk.kind === 'multi' || sk.kind === 'melody') await strike(tg, sk ? Math.min(sk.mult * (sk.hits || 1), 2.4) * 0.6 : 0.9);
    else if (healKind(sk)) { const v = Math.min(e.mhp - e.hp, 40); e.hp += v; sfx('heal'); await say(`${sk.name}を まねして\nHPが ${v} かいふくした！`, au(34)); }
    else if (sk.kind === 'taunt') {
      await say('「その 煽り、 録音して\n拡散しといたわ」', au(40));
      if (chance(0.4)) { ST('h').stun = 1; await say('アオ太の 心が 折れた！\nつぎの ターン うごけない！', au(40)); }
      else await say('アオ太は 聞き流した！', au(30));

async function chooseFor(m, e, backable) {
  const label = () => { drawWin(92, 144, 156, 76); txt(`${m.name}の ばん`, 104, 154, '#78d8f8'); txt(e.short || e.name, 104, 178); };
  extraWins.push(label);
  const sealed = battleS.hush || (m === KAIRI && battleS.silence > 0);
  const names = m === HERO ? ['たたかう', 'スキル', 'どうぐ', 'にげる'] : ['ギター', 'えんそう', 'どうぐ', 'ぼうぎょ'];
  const mm = openMenu({ items: names.map((l, i) => ({ label: l, disabled: i === 1 && sealed })), x: 8, y: 144, w: 80, h: 76, cancel: backable });
  const off = () => { closeMenu(mm); const i = extraWins.indexOf(label); if (i >= 0) extraWins.splice(i, 1); };
  let act = null;
  while (!act) {
    const r = await chooseMenu(mm);
    if (r === -1) act = { type: 'back' };
    else if (r === 0) act = { type: 'attack' };
    else if (r === 1) {
      const s = await skillPick(m, true);
      if (s && s.kind === 'heal') { const t = await pickMember(x => x.hp > 0); if (t) act = { type: 'skill', skill: s, target: t }; }
      else if (s) act = { type: 'skill', skill: s };

      off();
      if (await itemMenu(m)) return { type: 'item' };
      closeMsg(); menus.push(mm); extraWins.push(label);
    } else if (r === 3) act = m === HERO ? { type: 'run' } : { type: 'guard' };
  }
  off();
  return act;
}
async function levelUps() {
  while (P.lv < MAX_LV && P.exp >= EXP_TABLE[P.lv + 1]) {
    const k0 = kStat();
    P.lv++;
    const g = { mhp: rnd(6, 8), mmp: rnd(2, 4), str: rnd(2, 3), vit: rnd(1, 3), agi: rnd(1, 3) };
    P.mhp += g.mhp; P.mmp += g.mmp; P.str += g.str; P.vit += g.vit; P.agi += g.agi;
    P.hp = Math.min(P.mhp, P.hp + g.mhp); P.mp = Math.min(P.mmp, P.mp + g.mmp);
    const k1 = kStat(); P.k.hp = Math.min(k1.mhp, P.k.hp + (k1.mhp - k0.mhp)); P.k.mp = Math.min(k1.mmp, P.k.mp + (k1.mmp - k0.mmp));
    await say('レベルが あがった！', { noWait: true }); await jingle('lvup');
    await say(`ちからが ${g.str} あがった！\nみのまもりが ${g.vit} あがった！\nすばやさが ${g.agi} あがった！`);
    await say(`さいだいHPが ${g.mhp} あがった！\nさいだいMPが ${g.mmp} あがった！`);
    if (flags.kairi) await say(`カイリも つよくなった！\n（HP +${k1.mhp - k0.mhp}・MP +${k1.mmp - k0.mmp}・こうげき +${k1.atk - k0.atk}）`);

}
// returns 'win' | 'run' | 'lose' | 'fled'
async function battle(id, opt = {}) {
  const base = ENEMIES[id];
  // 強くてニューゲーム: each extra playthrough makes enemies 50% tougher (and more rewarding)
  const k = (1 + 0.5 * (flags.cycle || 0)) * (base.boss ? 1 : (game.map.encScale || 1)), up = v => Math.round(v * k);
  const e = { ...base, id, hp: up(base.hp), mhp: up(base.hp), atk: up(base.atk), def: up(base.def), exp: up(base.exp), gold: up(base.gold) };
  const prevMode = game.mode;
  sfx('enc');
  for (let i = 0; i < 6; i++) { game.flash = 4; await framesWait(6); }
  Object.assign(battleS, { e, st: {}, atkMul: 1, pdown: 0, silence: 0, hush: 0, clap: 0, lastAct: null, taunted: false, lastTaunt: null, blink: 0, alpha: 1, bg: opt.bg || game.map.bg || 'field' });
  game.mode = 'battle';
  playBgm(opt.bgm || (base.boss ? 'boss' : 'battle'));
  const sw = partyWins(); extraWins.push(sw);
  await say(opt.intro || `${e.name}が あらわれた！`, { auto: 50 });
  let turn = 0, result = null;
  // surprise attack: the enemy gets a free action before the first command
  if (!base.boss && chance(0.1)) {
    await say(`しかし ${e.short || e.name}は\nいきなり おそいかかってきた！`, au(40));
    await enemyAct(e);
    if (!alive().length) result = 'lose';
    else if (e.fled) result = 'fled';
  }
  while (!result) {
    turn++;
    closeMsg();
    const acts = {}, order = alive();
    for (let i = 0; i < order.length; i++) {
      const m = order[i];
      if (acts[m.id]) continue;
      if (ST(m.id).stun) { ST(m.id).stun = 0; acts[m.id] = { type: 'stunned' }; continue; }
      const a = await chooseFor(m, e, i > 0);
      if (a.type === 'back') {
        // step back to the previous member, unless their choice can't be undone
        const j = i - 1;
        if (j >= 0 && !['stunned', 'item'].includes(acts[order[j].id].type)) { delete acts[order[j].id]; i = j - 1; }
        else i--;
        continue;
      }
      acts[m.id] = a;
      if (a.type === 'run') break;
    }
    for (const m of party()) ST(m.id).guard = acts[m.id] && acts[m.id].type === 'guard' ? 1 : 0;
    msg.lines = []; msg.visible = true;
    if (acts.h && acts.h.type === 'run') {
      await say(`${P.name}は にげだした！`, au(24));
      if (base.boss) await say('しかし にげられない！', au(40));
      else if (chance(clamp(0.5 + (P.agi - e.agi) * 0.05, 0.25, 0.92))) { sfx('run'); await framesWait(20); result = 'run'; break; }
      else await say('しかし まわりこまれて しまった！', au(40));
      await enemyAct(e);
    } else {
      // the enemy moves first about a third of the time, more often when it is quicker
      const enemyFirst = !e.last && chance(clamp(0.35 + (e.agi - P.agi) * 0.02, 0.15, 0.6));
      if (enemyFirst) await enemyAct(e);
      for (const m of party()) {
        const a = acts[m.id];
        if (!a || a.type === 'item' || m.hp <= 0 || e.hp <= 0 || e.fled) continue;
        await memberAct(m, e, a);
        if (a.type === 'skill') battleS.lastAct = a;
      }
      if (!enemyFirst && e.hp > 0 && !e.fled && alive().length) await enemyAct(e);
    }
    if (battleS.hush) battleS.hush--;
    if (battleS.silence > 0 && --battleS.silence === 0 && flags.kairi && e.hp > 0) await say('カイリの 演奏が もどった！', au(30));
    if (e.hp <= 0) result = 'win';
    else if (!alive().length) result = 'lose';
    else if (e.fled) { for (let i = 20; i >= 0; i--) { battleS.alpha = i / 20; await framesWait(1); } await waitA(); result = 'fled'; }
    else if (opt.onTurn) await opt.onTurn(e, turn);
  }
  if (result === 'win') {
    for (let i = 20; i >= 0; i--) { battleS.alpha = i / 20; await framesWait(1); }
    await say(`${e.short || e.name}を たおした！`, { append: true, noWait: true });
    if (!opt.noJingle) await jingle('win');
    msg.lines = [];
    if (e.exp) { P.exp += e.exp; await say(`${e.exp}ポイントの けいけんちを かくとく！`, au(40)); }
    if (e.gold) { P.gold += e.gold; await say(`${e.gold}円を てにいれた！`, au(40)); }
    if (e.stolen) { P.gold += e.stolen; await say(`とられた ${e.stolen}円を とりかえした！`, au(40)); }
    if (e.drop && chance(e.drop[1]) && (P.items[e.drop[0]] || 0) < 9) { addItem(e.drop[0]); await say(`${e.short || e.name}は ${ITEMS[e.drop[0]].name}を おとしていった！`, au(50)); }
    await waitA();
    await levelUps();
  } else if (result === 'lose') {
    await say(flags.kairi ? 'アオ太たちは ちからつきた……' : 'アオ太は ちからつきた……', { append: true, noWait: true });
    await jingle('lose');
    await waitA();
  }
  closeMsg(); extraWins.splice(extraWins.indexOf(sw), 1);
  battleS.st = {};
  if (result === 'lose') { await gameOver(); return 'lose'; }
  for (const m of party()) if (m.hp <= 0) m.hp = 1;
  await fadeOut(8);
  game.mode = prevMode === 'battle' ? 'map' : prevMode;
  battleS.e = null;
  playBgm(game.map.bgm);
  await fadeIn(8);
  return result;
}

// 路上ライブ / 結界セッション: a one-button rhythm game. Notes come from the right; press A as they reach the ring.
const RHY = { on: false };
const rclock = () => (RHY.ctx ? RHY.ctx.currentTime - (RHY.ctx.outputLatency || RHY.ctx.baseLatency || 0) : performance.now() / 1000);
function chartOf(song) {
  const s = SONGS[song], step = 60 / s.bpm / 2; let t = 0; const out = [];
  for (const [f, l] of s.tr[0].notes) { if (f && l >= 2) out.push({ t, hit: null }); t += step * l; }
  return { notes: out, len: t, beat: step * 2 };
}
async function rhythm(song, title) {
  closeMsg(); stopBgm();
  Object.assign(RHY, chartOf(song), { on: true, title, combo: 0, maxC: 0, judge: null, jt: 0, ctx: SND.ctx, t0: Infinity, count: 0 });
  const prevMode = game.mode;
  game.mode = 'rhythm';
  for (let i = 3; i >= 1; i--) { RHY.count = i; sfx('cur'); await framesWait(36); }
  RHY.count = 0;
  RHY.t0 = rclock() + 0.06; playBgm(song, true);
  modal = k => {
    if (k !== 'a') return;
    const now = rclock() - RHY.t0;
    let best = null;
    for (const n of RHY.notes) if (!n.hit && (!best || Math.abs(n.t - now) < Math.abs(best.t - now))) best = n;
    if (!best || Math.abs(best.t - now) > 0.2) { sfx('tick'); return; }
    const d = Math.abs(best.t - now);
    best.hit = d <= 0.08 ? 'perfect' : 'good';
    RHY.combo++; RHY.maxC = Math.max(RHY.maxC, RHY.combo);
    RHY.judge = best.hit; RHY.jt = 30; sfx('clap');
    burst(40, 150, 'note', 2);
  };
  await until(() => rclock() - RHY.t0 > RHY.len + 0.8);
  modal = null;
  const c = { perfect: 0, good: 0, miss: 0 };
  for (const n of RHY.notes) c[n.hit || 'miss']++;
  const score = Math.round((c.perfect + c.good * 0.6) / RHY.notes.length * 100);
  const rank = score >= 95 ? 'S' : score >= 80 ? 'A' : score >= 60 ? 'B' : 'C';
  Object.assign(RHY, { result: { ...c, score, rank } });
  await say(`けっか： ${rank}ランク（スコア ${score}）\nPERFECT ${c.perfect}  GOOD ${c.good}  MISS ${c.miss}\nさいだいコンボ ${RHY.maxC}`);
  RHY.on = false;
  game.mode = prevMode === 'rhythm' ? 'map' : prevMode;
  playBgm(game.map.bgm, true);
  return RHY.result;
}

// ------------------------------------------------------------
//  Name entry (DQ-style kana grid + keyboard field)
// ------------------------------------------------------------
const NAME_MAX = 6;
const KANA_ROWS = ['あいうえおかきくけこ', 'さしすせそたちつてと', 'なにぬねのはひふへほ', 'まみむめもやゆよわを',
  'らりるれろんぁぃぅぇ', 'がぎぐげござじずぜぞ', 'だぢづでどばびぶべぼ', 'ぱぴぷぺぽぉゃゅょっ'];
const NAME_CMDS = [{ label: 'カナ', act: 'kana' }, { label: 'ー', act: 'ー' }, { label: 'けす', act: 'del' }, { label: 'おわる', act: 'ok' }];
const toKata = t => t.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const ne = { name: '', kata: false, r: 0, c: 0 };
const nameField = document.getElementById('name-field');
const nameInput = document.getElementById('hero-name');
const clipName = v => Array.from(v.replace(/\s+/g, ' ').trim()).slice(0, NAME_MAX).join('');
nameInput.addEventListener('input', () => { ne.name = Array.from(nameInput.value).slice(0, NAME_MAX).join(''); });
function nameEntry() {
  ne.name = ''; ne.kata = false; ne.r = 0; ne.c = 0;
  nameInput.value = ''; nameField.hidden = false;
  game.mode = 'name';
  return new Promise(res => {
    const finish = () => {
      sfx('ok'); nameField.hidden = true; modal = null;
      nameInput.blur(); cv.focus();
      res(clipName(ne.name) || 'アオ太');
    };
    const sync = () => { nameInput.value = ne.name; };
    const rowLen = r => r < KANA_ROWS.length ? 10 : NAME_CMDS.length;
    nameInput.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finish(); } };
    document.getElementById('name-ok').onclick = finish;
    modal = k => {
      const rows = KANA_ROWS.length + 1;
      if (k === 'up' || k === 'down') {
        const or = ne.r; ne.r = (ne.r + (k === 'up' ? -1 : 1) + rows) % rows;
        if (rowLen(or) !== rowLen(ne.r)) ne.c = Math.round(ne.c * (rowLen(ne.r) - 1) / (rowLen(or) - 1));
        sfx('cur');
      } else if (k === 'left' || k === 'right') {
        ne.c = (ne.c + (k === 'left' ? -1 : 1) + rowLen(ne.r)) % rowLen(ne.r); sfx('cur');
      } else if (k === 'b') {
        ne.name = Array.from(ne.name).slice(0, -1).join(''); sync(); sfx('cur');
      } else if (k === 'a') {
        let add = null;
        if (ne.r < KANA_ROWS.length) add = KANA_ROWS[ne.r][ne.c];
        else {
          const act = NAME_CMDS[ne.c].act;
          if (act === 'kana') { ne.kata = !ne.kata; sfx('ok'); return; }
          if (act === 'del') { ne.name = Array.from(ne.name).slice(0, -1).join(''); sync(); sfx('cur'); return; }
          if (act === 'ok') { finish(); return; }
          add = act;
        }
        if (Array.from(ne.name).length >= NAME_MAX) { sfx('ng'); return; }
        ne.name += ne.kata ? toKata(add) : add; sync(); sfx('cur');
      }
    };
  });
}
function drawName() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawWin(8, 6, 240, 48);
  txt('主人公の なまえを きめてください', 20, 13);

  for (let i = 0; i < NAME_MAX; i++) {
    const x = 74 + i * 18;
    ctx.fillStyle = '#7a7488'; ctx.fillRect(x, 47, 14, 1);
    if (chars[i]) txt(chars[i], x + 1, 32, '#fff', 12, 14);
    else if (i === chars.length && (game.frame >> 4) % 2 === 0) { ctx.fillStyle = '#78d8f8'; ctx.fillRect(x, 45, 14, 2); }
  }
  drawWin(8, 58, 240, 160);
  const blink = (game.frame >> 4) % 2 === 0;
  const arrow = (x, y) => { ctx.fillStyle = '#fff'; for (let k = 0; k < 4; k++) ctx.fillRect(x + k, y + k, 1, 8 - k * 2); };
  KANA_ROWS.forEach((row, r) => {
    Array.from(ne.kata ? toKata(row) : row).forEach((ch, c) => {
      const x = 26 + c * 21 + (c >= 5 ? 6 : 0), y = 66 + r * 16;
      txt(ch, x, y);

  noteAt(124, 86 + Math.round(Math.sin(game.frame / 15) * 2), '#78d8f8');
  // which save is in use, so a missing save is never a surprise
  ctx.textAlign = 'center';
  txt('セーブ：' + saveMode(), W / 2, 208, STORE.local || STORE.cloudState !== 'off' ? '#8fa3c4' : '#f8a030', 10);
  ctx.textAlign = 'left';
  drawFx(0, 0);
}
function drawEnd() {
  game.endT++;
  ctx.fillStyle = '#060a16'; ctx.fillRect(0, 0, W, H);
  for (const [x, y, t] of STARS) { if ((game.frame + t * 20) % 80 < 60) { ctx.fillStyle = t ? '#78d8f8' : '#fff'; ctx.fillRect(x, y + 20, 1, 1); } }
  ctx.textAlign = 'center';
  txt('THE END', W / 2, 36, '#fff', 30);
  txt('KAIRI QUEST 〜蒼のメロディ〜', W / 2, 72, '#cdeefc', 12);
  const f = (game.frame >> 4) % 2;
  ctx.drawImage(SPR.hero.right[f], 92, 100, 32, 32);
  ctx.drawImage(SPR.kairiG.down[f], 132, 100, 32, 32);
  noteAt(124, 94 + Math.round(Math.sin(game.frame / 15) * 2), '#78d8f8');
  txt(`${P.name} Lv${P.lv}` + (flags.cycle ? `（${flags.cycle + 1}周目）` : ''), W / 2, 146, '#fff', 12);
  txt('推し活 おつかれさまでした！', W / 2, 164, '#fff', 12);
  if (game.endT > 120 && (game.frame >> 5) % 2 === 0) txt('A / Z で タイトルへ', W / 2, 190, '#8fa3c4', 10);
  ctx.textAlign = 'left';
}
// the world loses its colour with its music, and gets it back string by string
function screenFilter() {
  if (game.flashback) return 'sepia(0.85) brightness(0.95)';
  if (game.mode !== 'map' && game.mode !== 'battle') return '';
  if (!flags || !flags.stolen || flags.voice) return '';
  return `saturate(${(0.2 + 0.18 * (strings() - 2)).toFixed(2)})`;
}
function draw() {
  resetT();
  const fl = screenFilter(); if (cv.style.filter !== fl) cv.style.filter = fl;
  let sx = 0, sy = 0;
  if (game.shake > 0) { game.shake--; sx = rnd(-2, 2); sy = rnd(-1, 1); }
  ctx.save(); ctx.translate(sx, sy);
  if (game.mode === 'title') drawTitle();
  else if (game.mode === 'battle') drawBattle();
  else if (game.mode === 'rhythm') drawRhythm();
  else if (game.mode === 'end') drawEnd();
  else if (game.mode === 'name') drawName();
  else if (game.map) drawMap();
  else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  if (game.toast && game.mode === 'map') {
    game.toast.t--; const tw = textW(game.toast.text) + 24;
    if (game.toast.t > 0) drawWin(Math.round((W - tw) / 2), 8, tw, 28), txt(game.toast.text, Math.round((W - tw) / 2) + 12, 16);
    else game.toast = null;
  }
  if (game.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${game.fade})`; ctx.fillRect(0, 0, W, H); }
  if (game.caption) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = game.caption.a; ctx.textAlign = 'center';
    const ls = game.caption.lines, y0 = H / 2 - ls.length * 11;
    ls.forEach((l, i) => txt(l, W / 2, y0 + i * 22, '#fff', 12));
    ctx.restore();
    if (game.caption.arrow && (game.frame >> 4) % 2 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(W / 2 - 3, H - 30, 7, 1); ctx.fillRect(W / 2 - 2, H - 29, 5, 1); ctx.fillRect(W / 2 - 1, H - 28, 3, 1); ctx.fillRect(W / 2, H - 27, 1, 1); }
  }
  if (game.flash > 0) { game.flash--; ctx.fillStyle = game.mode === 'battle' ? 'rgba(216,56,56,0.35)' : 'rgba(255,255,255,0.85)'; ctx.fillRect(0, 0, W, H); }
  drawUI();
}

// ------------------------------------------------------------
//  Main loop
// ------------------------------------------------------------
function update() {
  game.frame++;
  const keys = keyQ.splice(0);
  const free = [];
  for (const k of keys) { if (modal) modal(k); else free.push(k); }
  if (game.mode === 'map' && game.map) { updateMap(); freeInput(free); if (game.frame - lastAuto > 300) autosave(); }
  for (let i = waiters.length - 1; i >= 0; i--) {
    const w = waiters[i];
    if (w.fn()) { waiters.splice(i, 1); w.res(); }
  }
}
let last = 0, acc = 0;
function loop(t) {
  // schedule the next frame first, so one error can never stop the game
  requestAnimationFrame(loop);
  if (!last) last = t;
  acc += Math.min(100, t - last); last = t;
  let n = 0;
  try { while (acc >= 1000 / 60 && n < 4) { update(); acc -= 1000 / 60; n++; } } catch (e) { acc = 0; reportError(e); }
  try { if (n) draw(); } catch (e) { reportError(e); }
}
async function boot() {
  initSprites(); initTiles();
  STORE.local = probeLocal();
  initCloud();
  try { await Promise.race([document.fonts.load('12px "DotGothic16"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  newGame();
  requestAnimationFrame(loop);
  cv.focus();
  titleScreen();
}
window.__kq = { game, MAPS, get P() { return P; }, get flags() { return flags; }, setMap, battle, runScript, player, RHY, rhythm, ending, voiceCheck, menus, msg, battleS, ev: { unchikuEvent, ganariEvent, pitchEvent, rokuonEvent, muteEvent, barrierTalk, busk, fieldMenu } };
boot();
</script>
