<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="劇場カウンター">
<meta name="theme-color" content="#e8457f">
<title>劇場公演カウンター</title>
<style>
:root{
  --bg:#fff6f9; --card:#ffffff; --ink:#2a2230; --sub:#7d6f86; --line:#f0dfe7;
  --pink:#e8457f; --pink-soft:#ffd6e5; --ok:#2e9d6a; --danger:#c8364b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17121a; --card:#221b27; --ink:#f3eaf2; --sub:#a796ad; --line:#3a2f40;
         --pink:#ff6b9d; --pink-soft:#4a2536; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px;text-align:center;letter-spacing:.05em}
h2{font-size:15px;margin:0 0 10px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.hero{text-align:center}
.ring{position:relative;width:220px;height:220px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:56px;font-weight:800;line-height:1;color:var(--pink)}
.ring .of{font-size:14px;color:var(--sub);margin-top:4px}
.remain{margin-top:10px;font-size:16px}
.remain b{color:var(--pink);font-size:20px}
.next{font-size:13px;color:var(--sub);margin-top:4px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
.primary{background:var(--pink);color:#fff;font-weight:700;width:100%;font-size:16px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.small{padding:6px 10px;font-size:13px;border-radius:9px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink)}
.check input{width:auto}
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
.no{min-width:42px;text-align:center;font-weight:800;color:var(--pink);font-size:15px;padding-top:2px}
.no.off{color:var(--sub);font-weight:400;font-size:12px}
.meta{flex:1;min-width:0}
.meta .t{font-weight:700;font-size:15px}
.meta .d{font-size:12px;color:var(--sub);margin-top:2px}
.meta .m{font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--pink-soft);color:var(--ink);margin-right:4px}
.sugg li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.sugg li:first-child{border-top:0}
.sugg .t{font-size:14px;font-weight:600}
.sugg .d{font-size:12px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:22px;color:var(--pink)}
.stats span{font-size:11px;color:var(--sub)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.bar .name{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--pink)}
.bar .c{width:28px;text-align:right;color:var(--sub)}
.bar .sub{display:block;font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:12px}
.tab{flex:1;padding:8px;font-size:14px;background:transparent;color:var(--sub);border-radius:9px}
.tab.on{background:var(--card);color:var(--pink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.agg-note{font-size:12px;color:var(--sub);margin:8px 0 0}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:8px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.celebrate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:10;text-align:center;color:#fff}
.celebrate.show{display:flex}
.celebrate .box{background:var(--pink);padding:28px 24px;border-radius:20px;max-width:320px}
.celebrate .box b{font-size:40px;display:block}
</style>
</head>
<body>
<main>
  <h1>🎀 劇場公演カウンター</h1>

  <section class="card hero">
    <div class="ring">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="96" fill="none" stroke="var(--pink-soft)" stroke-width="16"/>
        <circle id="arc" cx="110" cy="110" r="96" fill="none" stroke="var(--pink)" stroke-width="16"
                stroke-linecap="round" stroke-dasharray="603.19" stroke-dashoffset="603.19" style="transition:stroke-dashoffset .6s"/>
      </svg>
      <div class="num"><div class="big" id="count">0</div><div class="of" id="of">/ 100 回</div></div>
    </div>
    <div class="remain" id="remain"></div>
    <div class="next" id="next"></div>
  </section>

  <section class="card">
    <button class="primary" id="addBtn">＋ 入場を記録する</button>
  </section>

  <section class="card" id="suggCard" hidden>
    <h2>最近の劇場公演から追加</h2>
    <ul class="sugg" id="sugg"></ul>
  </section>

  <section class="card">
    <h2>統計</h2>
    <div class="stats">
      <div><b id="sYear">0</b><span>今年</span></div>
      <div><b id="sMonth">0</b><span>今月</span></div>
      <div><b id="sDays">-</b><span>初入場から(日)</span></div>
    </div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="show" role="tab">公演別</button>
      <button class="tab" data-tab="member" role="tab">メンバー別</button>
      <button class="tab" data-tab="bingo" role="tab">入場順</button>
    </div>
    <div id="agg"></div>
    <button class="ghost small" id="moreBtn" hidden style="width:100%;margin-top:8px">すべて表示</button>
  </section>

  <section class="card">
    <h2 id="histTitle">入場履歴</h2>
    <div id="filterBar" hidden style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="tag" id="filterLabel" style="font-size:13px;padding:4px 10px"></span>
      <button class="ghost small" id="clearFilter">解除</button>
    </div>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <h2>設定・バックアップ</h2>
    <label for="goal">目標回数</label>
    <input id="goal" type="number" min="1" inputmode="numeric">
    <div class="tools" style="margin-top:12px">
      <button class="ghost small" id="exportBtn">バックアップを保存</button>
      <button class="ghost small" id="importBtn">バックアップから復元</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <p style="font-size:12px;color:var(--sub);margin:10px 0 0">
      記録はこの端末のブラウザ内に保存されます。機種変更やブラウザのデータ削除に備えて、時々バックアップを保存してください。
    </p>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">入場を記録</h2>
    <div class="row">
      <div><label for="fDate">日付</label><input id="fDate" type="date" required></div>
      <div><label for="fTime">開演</label><input id="fTime" type="time"></div>
    </div>
    <label for="fShow">公演名</label>
    <input id="fShow" list="showList" placeholder="例：「手をつなぎながら」公演" required>
    <datalist id="showList"></datalist>
    <label for="fType">観覧種別</label>
    <select id="fType">
      <option value="theater">劇場観覧</option>
      <option value="lobby">ロビー観覧</option>
      <option value="other">その他</option>
    </select>
    <label for="fBingo">ビンゴ抽選の入場順</label>
    <select id="fBingo"></select>
    <label for="fSeat">座席など</label>
    <input id="fSeat" placeholder="例：3列目 / 立ち見 / 抽選12番">
    <label for="fCast">出演メンバー（任意）</label>
    <input id="fCast" placeholder="カンマ区切り">
    <label for="fMemo">メモ</label>
    <textarea id="fMemo" placeholder="感想、生誕祭、お見送りの思い出など"></textarea>
    <label class="check"><input type="checkbox" id="fCount" checked> 100回カウントの対象にする</label>
    <div class="row" style="margin-top:16px">
      <button type="button" class="ghost" id="delBtn" hidden style="color:var(--danger)">削除</button>
      <button type="button" class="ghost" id="cancelBtn">キャンセル</button>
      <button type="submit" class="primary" style="width:auto">保存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>
<div class="celebrate" id="cele"><div class="box"><b id="celeNum"></b><div id="celeMsg"></div>
  <button class="ghost small" style="margin-top:14px;color:#fff;border-color:#fff" onclick="this.closest('.celebrate').classList.remove('show')">閉じる</button></div></div>

<script>
(() => {
  const KEY = 'akb48-theater-counter-v1';
  const MILESTONES = [1, 10, 25, 50, 75, 90, 99, 100, 150, 200, 300, 500, 1000];
  const $ = id => document.getElementById(id);

  // ---------- storage ----------
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.visits)) return { goal: d.goal || 100, visits: d.visits };
    } catch (e) {}
    return { goal: 100, visits: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('保存に失敗しました（プライベートモード？）'); }
  }
  let state = load();

  // ---------- helpers ----------
  const pad = n => String(n).padStart(2, '0');
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const wd = ['日','月','火','水','木','金','土'];
  const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return `${y}/${m}/${d}(${wd[new Date(y,m-1,d).getDay()]})`; };
  const typeLabel = { theater: '劇場', lobby: 'ロビー', other: 'その他' };
  // ビンゴ抽選の入場順: '1'〜'25' または 'up'（ロビ観繰り上がり）。'' は未記録
  const BINGO_MAX = 25, BINGO_UP = 'up';
  const bingoLabel = b => b === BINGO_UP ? 'ロビ観繰り上がり' : b ? `入場順 ${b}番` : '';
  $('fBingo').innerHTML = '<option value="">未記録</option>'
    + Array.from({ length: BINGO_MAX }, (_, i) => `<option value="${i + 1}">${i + 1}番</option>`).join('')
    + `<option value="${BINGO_UP}">ロビ観繰り上がり</option>`;
  $('fBingo').addEventListener('change', e => {
    // 繰り上がり入場は劇場観覧としてカウント
    if (e.target.value === BINGO_UP) { $('fType').value = 'theater'; $('fCount').checked = true; }
  });
  const sorted = () => [...state.visits].sort((a, b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||'')) || a.created - b.created);
  const counted = () => sorted().filter(v => v.count);

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ---------- render ----------
  function render() {
    const c = counted(), n = c.length, goal = state.goal;
    $('count').textContent = n;
    $('of').textContent = `/ ${goal} 回`;
    const C = 2 * Math.PI * 96;
    $('arc').style.strokeDashoffset = C * (1 - Math.min(n / goal, 1));
    $('remain').innerHTML = n >= goal
      ? `🎉 <b>達成！</b> 目標を ${n - goal} 回超えています`
      : `あと <b>${goal - n}</b> 回`;
    const nextM = MILESTONES.find(m => m > n && m <= goal) ;
    $('next').textContent = nextM && nextM !== goal ? `次の節目 ${nextM}回まで あと${nextM - n}回` : '';
    $('goal').value = goal;

    // number map
    const noMap = new Map(c.map((v, i) => [v.id, i + 1]));

    // list (newest first)
    const list = sorted().reverse().filter(matchFilter);
    $('filterBar').hidden = !filter;
    if (filter) $('filterLabel').textContent = filter.kind === 'bingo'
      ? `${bingoLabel(filter.key)}（${list.length}件）`
      : `${filter.kind === 'show' ? '公演' : 'メンバー'}：${filter.key}（${list.length}件）`;
    $('list').innerHTML = list.length ? list.map(v => `
      <li class="item" data-id="${v.id}">
        <div class="no ${v.count ? '' : 'off'}">${v.count ? '#' + noMap.get(v.id) : '対象外'}</div>
        <div class="meta">
          <div class="t">${esc(v.show)}</div>
          <div class="d">${fmtDate(v.date)}${v.time ? ' ' + esc(v.time) : ''}
            <span class="tag">${typeLabel[v.type] || '劇場'}</span>${v.bingo ? `<span class="tag">${bingoLabel(v.bingo)}</span>` : ''}${v.seat ? esc(v.seat) : ''}</div>
          ${(v.cast || []).length ? `<div class="d">👥 ${v.cast.map(esc).join('、')}</div>` : ''}
          ${v.memo ? `<div class="m">${esc(v.memo)}</div>` : ''}
        </div>
        <button class="ghost small" data-edit="${v.id}">編集</button>
      </li>`).join('') : '<li class="empty">まだ記録がありません。最初の入場を記録しましょう！</li>';

    // stats
    const y = String(new Date().getFullYear()), ym = today().slice(0, 7);
    $('sYear').textContent = c.filter(v => v.date.startsWith(y)).length;
    $('sMonth').textContent = c.filter(v => v.date.startsWith(ym)).length;
    $('sDays').textContent = c.length ? Math.floor((new Date(today()) - new Date(c[0].date)) / 864e5) : '-';
    renderAgg(c);

    // datalist of known shows
    const shows = new Set([...state.visits.map(v => v.show), ...known.map(e => e.show)]);
    $('showList').innerHTML = [...shows].map(s => `<option value="${esc(s)}">`).join('');

    renderSuggestions();
  }

  // ---------- 公演別 / メンバー別 集計 ----------
  let aggTab = 'show', aggAll = false, filter = null;
  function aggregate(c, kind) {
    const m = new Map();
    c.forEach(v => {
      const keys = kind === 'show' ? [v.show] : [...new Set(v.cast || [])];
      keys.forEach(k => {
        const r = m.get(k) || { key: k, n: 0, last: '' };
        r.n++; if (v.date > r.last) r.last = v.date;
        m.set(k, r);
      });
    });
    return [...m.values()].sort((a, b) => b.n - a.n || b.last.localeCompare(a.last));
  }
  function renderBingo() {
    const vs = state.visits.filter(v => v.bingo);
    const nums = vs.filter(v => v.bingo !== BINGO_UP).map(v => +v.bingo);
    const up = vs.length - nums.length;
    const cnt = {};
    vs.forEach(v => cnt[v.bingo] = (cnt[v.bingo] || 0) + 1);
    const keys = [...Array.from({ length: BINGO_MAX }, (_, i) => String(i + 1)), BINGO_UP].filter(k => cnt[k]);
    const max = Math.max(1, ...Object.values(cnt));
    const avg = nums.length ? (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1) : '-';
    const top5 = nums.filter(n => n <= 5).length;
    $('agg').innerHTML = vs.length ? `
      <div class="stats" style="margin-bottom:12px">
        <div><b>${avg}</b><span>平均入場順</span></div>
        <div><b>${nums.length ? Math.min(...nums) + '番' : '-'}</b><span>最高</span></div>
        <div><b>${top5}</b><span>1〜5番</span></div>
      </div>` + keys.map(k => `
      <div class="bar" data-filter="${k}" style="cursor:pointer">
        <span class="name">${k === BINGO_UP ? 'ロビ観繰り上がり' : k + '番'}</span>
        <span class="track"><span class="fill" style="display:block;width:${cnt[k] / max * 100}%"></span></span>
        <span class="c">${cnt[k]}</span></div>`).join('')
      + `<p class="agg-note">記録 ${vs.length}件（うち繰り上がり ${up}件）／入場順が未記録の公演は含みません</p>`
      : '<div class="empty">入場順が記録された公演がありません</div>';
    $('moreBtn').hidden = true;
  }
  function renderAgg(c) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === aggTab));
    if (aggTab === 'bingo') return renderBingo();
    const rows = aggregate(c, aggTab);
    const shown = aggAll ? rows : rows.slice(0, 10);
    const max = rows.length ? rows[0].n : 1;
    const noCast = aggTab === 'member' ? c.filter(v => !(v.cast || []).length).length : 0;
    $('agg').innerHTML = shown.length ? shown.map(r => `
      <div class="bar" data-filter="${esc(r.key)}" style="cursor:pointer">
        <span class="name">${esc(r.key)}<span class="sub">最終 ${fmtDate(r.last)}${aggTab === 'member' && c.length ? ` ・ ${Math.round(r.n / c.length * 100)}%` : ''}</span></span>
        <span class="track"><span class="fill" style="display:block;width:${r.n / max * 100}%"></span></span>
        <span class="c">${r.n}</span></div>`).join('')
      : `<div class="empty">${aggTab === 'member' ? '出演メンバーが入力された記録がありません' : 'まだ記録がありません'}</div>`;
    if (noCast) $('agg').innerHTML += `<p class="agg-note">※ 出演メンバー未入力の記録が${noCast}件あります（編集から追加できます）</p>`;
    $('moreBtn').hidden = rows.length <= 10;
    $('moreBtn').textContent = aggAll ? '上位10件のみ表示' : `すべて表示（${rows.length}件）`;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === aggTab));
  }
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { aggTab = t.dataset.tab; aggAll = false; render(); });
  $('moreBtn').onclick = () => { aggAll = !aggAll; render(); };
  $('clearFilter').onclick = () => { filter = null; render(); };
  const matchFilter = v => !filter
    || (filter.kind === 'show' ? v.show === filter.key
      : filter.kind === 'bingo' ? v.bingo === filter.key
      : (v.cast || []).includes(filter.key));

  // ---------- suggestions from ../events.json (same repo) ----------
  let known = [];
  async function loadKnown() {
    try {
      const r = await fetch('../events.json', { cache: 'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      known = (d.events || [])
        .filter(e => !e.kind && /公演/.test(e.title || ''))
        .map(e => ({
          date: `${e.year}-${pad(e.month)}-${pad(e.day)}`,
          time: e.hour != null ? `${pad(e.hour)}:${pad(e.minute || 0)}` : '',
          show: e.title, cast: e.cast || e.members || [], tag: e.tag || ''
        }));
      render();
    } catch (e) { /* standalone use: no suggestions */ }
  }
  function renderSuggestions() {
    const now = new Date(), from = new Date(now - 30 * 864e5);
    const has = new Set(state.visits.map(v => v.date + '|' + (v.time || '') + '|' + v.show));
    const items = known
      .filter(e => { const d = new Date(e.date + 'T' + (e.time || '00:00')); return d <= now && d >= from; })
      .filter(e => !has.has(e.date + '|' + e.time + '|' + e.show))
      .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))
      .slice(0, 6);
    $('suggCard').hidden = !items.length;
    $('sugg').innerHTML = items.map((e, i) => `
      <li><div><div class="t">${esc(e.show)}</div>
      <div class="d">${fmtDate(e.date)} ${esc(e.time)}${e.tag ? ' ・' + esc(e.tag) : ''}</div></div>
      <button class="ghost small" data-sugg="${i}">記録</button></li>`).join('');
    renderSuggestions.items = items;
  }

  // ---------- dialog ----------
  let editing = null;
  function openDialog(v, preset) {
    editing = v ? v.id : null;
    const s = v || preset || {};
    $('dlgTitle').textContent = v ? '記録を編集' : '入場を記録';
    $('fDate').value = s.date || today();
    $('fTime').value = s.time || '';
    $('fShow').value = s.show || '';
    $('fType').value = s.type || 'theater';
    $('fSeat').value = s.seat || '';
    $('fBingo').value = s.bingo || '';
    $('fCast').value = (s.cast || []).join(', ');
    $('fMemo').value = s.memo || (preset && preset.tag ? preset.tag : '');
    $('fCount').checked = s.count ?? true;
    $('delBtn').hidden = !v;
    $('dlg').showModal();
  }
  $('fType').addEventListener('change', e => { if (!editing) $('fCount').checked = e.target.value === 'theater'; });
  $('addBtn').onclick = () => openDialog();
  $('cancelBtn').onclick = () => $('dlg').close();
  $('delBtn').onclick = () => {
    if (!confirm('この記録を削除しますか？')) return;
    state.visits = state.visits.filter(v => v.id !== editing);
    save(); $('dlg').close(); render(); toast('削除しました');
  };
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const before = counted().length;
    const data = {
      date: $('fDate').value, time: $('fTime').value, show: $('fShow').value.trim(),
      type: $('fType').value, seat: $('fSeat').value.trim(), bingo: $('fBingo').value,
      cast: $('fCast').value.split(/[,、，]/).map(s => s.trim()).filter(Boolean),
      memo: $('fMemo').value.trim(), count: $('fCount').checked
    };
    if (!data.date || !data.show) return;
    if (editing) Object.assign(state.visits.find(v => v.id === editing), data);
    else state.visits.push({ id: uid(), created: Date.now(), ...data });
    save(); $('dlg').close(); render();
    const after = counted().length;
    if (!editing && after > before && (MILESTONES.includes(after) || after === state.goal)) celebrate(after);
    else toast(editing ? '更新しました' : `記録しました（${after}回目）`);
  });
  document.addEventListener('click', e => {
    const ed = e.target.closest('[data-edit]');
    if (ed) openDialog(state.visits.find(v => v.id === ed.dataset.edit));
    const fl = e.target.closest('[data-filter]');
    if (fl) {
      filter = { kind: aggTab, key: fl.dataset.filter };
      render(); $('histTitle').scrollIntoView({ behavior: 'smooth' });
    }
    const sg = e.target.closest('[data-sugg]');
    if (sg) openDialog(null, renderSuggestions.items[+sg.dataset.sugg]);
  });

  function celebrate(n) {
    $('celeNum').textContent = `${n}回目！`;
    $('celeMsg').textContent = n >= state.goal
      ? '目標達成おめでとうございます！特典の申請を忘れずに🎉'
      : n === 1 ? '劇場デビューおめでとうございます！' : `節目の${n}回目、おめでとうございます！`;
    $('cele').classList.add('show');
  }

  // ---------- settings / backup ----------
  $('goal').addEventListener('change', e => {
    const g = parseInt(e.target.value, 10);
    if (g > 0) { state.goal = g; save(); render(); }
  });
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `theater-counter-${today()}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.visits)) throw 0;
      if (!confirm(`${d.visits.length}件の記録で現在のデータを置き換えますか？`)) return;
      state = { goal: d.goal || 100, visits: d.visits };
      save(); render(); toast('復元しました');
    } catch (err) { toast('ファイルを読み込めませんでした'); }
    e.target.value = '';
  };

  render();
  loadKnown();
})();
</script>
</body>
</html>
