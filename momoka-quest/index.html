<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-->
<title>百花クエスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one console column — the NES-ratio screen on top, controls under it */
:root {
  --bg: #0c0812;
  --shell: #1c1428;
  --shell-edge: #33264a;
  --ink: #efe9fb;
  --dim: #9d92b8;
  --oshi: #f4a6c6;
  --btn: #2b2040;
  --btn-press: #4a3570;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "MS Gothic", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.console {
  --reserve: 96px;
  width: min(100%, 768px, calc((100dvh - var(--reserve)) * 256 / 224));
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.screen-wrap {
  background: var(--shell);
  border: 2px solid var(--shell-edge);
  border-radius: 10px;
  padding: 8px;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 256 / 224;
  max-width: 100%;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 2px;
  outline: none;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  font-size: 13px;
  color: var(--dim);
}
.bar kbd {
  font-family: var(--font);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--shell-edge);
  border-radius: 4px;
  padding: 0 6px;
}
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; }
button {
  font-family: var(--font);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--shell-edge);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--oshi); outline-offset: 2px; }
.name-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--dim); }
.name-field[hidden] { display: none; }
.code-panel textarea {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; line-height: 1.4;
  color: var(--ink); background: #000; border: 2px solid var(--shell-edge); border-radius: 6px;
  padding: 6px 10px; resize: none; word-break: break-all; min-width: 0;
  -webkit-user-select: text; user-select: text;
}
.code-panel .name-row { justify-content: flex-end; }
.code-panel button[hidden] { display: none; }
.name-row { display: flex; gap: 8px; }
.name-row input {
  flex: 1; min-width: 0;
  font-family: var(--font); font-size: 18px;
  color: var(--ink); background: #000;
  border: 2px solid var(--shell-edge); border-radius: 6px; padding: 6px 10px;
  -webkit-user-select: text; user-select: text;
}
.name-row input:focus-visible { outline: 2px solid var(--oshi); outline-offset: 1px; }
.pad {
  display: none;
  justify-content: space-between;
  align-items: center;
  padding: 4px 6px 0;
  touch-action: none;
}
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  grid-template-rows: repeat(3, 54px);
}
.dpad button, .ab button {
  padding: 0;
  font-size: 18px;
  touch-action: none;
}
.dpad button.on, .ab button.on { background: var(--btn-press); }
.dpad .u { grid-area: 1 / 2; border-radius: 8px 8px 0 0; }
.dpad .l { grid-area: 2 / 1; border-radius: 8px 0 0 8px; }
.dpad .r { grid-area: 2 / 3; border-radius: 0 8px 8px 0; }
.dpad .d { grid-area: 3 / 2; border-radius: 0 0 8px 8px; }
.dpad .c { grid-area: 2 / 2; background: var(--btn); border-radius: 0; pointer-events: none; }
.ab { display: flex; gap: 18px; align-items: center; transform: rotate(-12deg); }
.ab button {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--oshi); border-color: #ffd6e6; color: #3a1828; font-size: 20px;
}
.ab .b { background: #d77ea6; margin-top: 34px; }
.ab button.on { background: #ffe4ef; color: #3a1828; }
@media (pointer: coarse) {
  .console { --reserve: 270px; }
  .pad { display: flex; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
<!--/PAGE-->
</head>
<body>
<!--BODY-->
<div class="console">
  <div class="screen-wrap"><canvas id="screen" tabindex="0" aria-label="百花クエスト ゲーム画面"></canvas></div>
  <div class="name-field" id="name-field" hidden>
    <label for="hero-name">キーボードで入力（漢字もOK・6文字まで）</label>
    <div class="name-row">
      <input id="hero-name" type="text" maxlength="6" autocomplete="off" enterkeyhint="done" placeholder="ヲタ太">
      <button id="name-ok" type="button">けってい</button>
    </div>
  </div>
  <div class="name-field code-panel" id="code-panel" hidden>
    <label id="code-label" for="code-text">ふっかつのじゅもん</label>
    <textarea id="code-text" rows="3" spellcheck="false" autocomplete="off"></textarea>
    <div class="name-row">
      <button id="code-copy" type="button">コピー</button>
      <button id="code-ok" type="button">けってい</button>
      <button id="code-close" type="button">とじる</button>
    </div>
  </div>
  <div class="bar">
    <div class="keys">
      <span><kbd>↑↓←→</kbd> いどう</span>
      <span><kbd>Z</kbd> <kbd>Enter</kbd> けってい・はなす</span>
      <span><kbd>X</kbd> <kbd>Esc</kbd> キャンセル・メニュー</span>
    </div>
    <button id="sound" type="button" aria-pressed="true">サウンド ON</button>
  </div>
  <div class="pad" aria-hidden="true">
    <div class="dpad">
      <button class="u" data-k="up" type="button">▲</button>
      <button class="l" data-k="left" type="button">◀</button>
      <span class="c"></span>
      <button class="r" data-k="right" type="button">▶</button>
      <button class="d" data-k="down" type="button">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" type="button">B</button>
      <button class="a" data-k="a" type="button">A</button>
    </div>
  </div>
</div>
<script>
'use strict';
// ============================================================
//  百花クエスト 〜推し被りの塔〜
// ============================================================
const W = 256, H = 224, S = 3, TS = 16;
const cv = document.getElementById('screen');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
const FONT = '"DotGothic16", "Hiragino Kaku Gothic ProN", "MS Gothic", monospace';
function resetT() { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false; }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ------------------------------------------------------------
//  Palette & sprites
// ------------------------------------------------------------
const PAL = {
  k: '#120c18', w: '#f8f8f8', s: '#f8c8a0', S: '#d8986c', h: '#2a1c16',
  p: '#f7b0cc', P: '#d47aa0', l: '#fde2ee', b: '#3858c8', B: '#22307a',
  g: '#a0a0ae', G: '#4a4a5a', r: '#d83838', R: '#8a1c1c', y: '#f8d838',
  n: '#8a5a30', e: '#3a9a3a', o: '#f89838', c: '#78d8f8', m: '#f890b8',
  H: '#f8f8f8', Y: '#d83838',
};

const TPL = {
  hero_down: { rows: [
    '....kkkkkkkk....', '...khhhhhhhhk...', '..khHHYHHYHHhk..', '..khhhhhhhhhhk..',
    '..ksGGGssGGGsk..', '..ksGcGssGcGsk..', '..kssssSSssssk..', '...ksssrrsssk...',
    '....kkSSSSkk....', '..kpppwwwwpppk..', '.kspppwwwwpppsk.', '.kspppwyywpppsk.',
    '..kPPPPPPPPPPk..', '...kbbbbbbbbk...', '...kbbk..kbbk...', '...kkkk..kkkk...'],
    alt: { 14: '....kbbbbbbk....', 15: '....kkkkkkkk....' } },
  hero_up: { rows: [
    '....kkkkkkkk....', '...khhhhhhhhk...', '..khHHHHHHHHhk..', '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..', '...khhhhhhhhk...',
    '....kkSSSSkk....', '..kpppnnnnpppk..', '.kspnnnnnnnnpsk.', '.kspnnnnnnnnpsk.',
    '..kPPnnnnnnPPk..', '...kbbbbbbbbk...', '...kbbk..kbbk...', '...kkkk..kkkk...'],
    alt: { 14: '....kbbbbbbk....', 15: '....kkkkkkkk....' } },
  hero_right: { rows: [
    '.....kkkkkk.....', '....khhhhhhk....', '...khhHHYHHHk...', '...khhhhhhhhk...',
    '...khhhsGGGsk...', '...khhssGcGsk...', '...khssssssssk..', '....kssssrsk....',
    '.....kSSSSk.....', '...knpppppwk....', '..knnppppswk....', '..knnpppppsk....',
    '...knPPPPPPk....', '....kbbbbbbk....', '...kbbk..kbbk...', '...kkkk..kkkk...'],
    alt: { 14: '....kbbbbbbk....', 15: '....kkkkkkkk....' } },
  fat: { rows: [
    '....kkkkkkkk....', '...khhhhhhhhk...', '..khhhhhhhhhhk..', '..khHHYHHYHHhk..',
    '..ksGGGssGGGsk..', '..ksGcGssGcGsk..', '.kSsssrrrrsssSk.', '.kSSssssssssSSk.',
    '.kpppwwwwwwpppk.', 'kspppwwwwwwpppsk', 'kspppwwwwwwpppsk', 'kspppwwyywwpppsk',
    '.kPPPPPPPPPPPPk.', '..kbbbbbbbbbbk..', '..kbbbk..kbbbk..', '..kkkkk..kkkkk..'],
    alt: { 14: '...kbbbbbbbbk...', 15: '...kkkkkkkkkk...' } },
  girl_down: { rows: [
    '...kpkkkkkkpk...', '..kplhhhhhhlpk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..',
    '..khhsssssshhk..', '..khskwsswkshk..', '..khskksskkshk..', '..khsmssssmshk..',
    '..khhssrrsshhk..', '..khkppwwppkhk..', '.kshpppwwppphsk.', '.kskppppppppksk.',
    '..kwlwlwlwlwlk..', '.kppppppppppppk.', '...kssk..kssk...', '...kPPk..kPPk...'],
    alt: { 14: '....kssssssk....', 15: '....kPPPPPPk....' } },
  girl_up: { rows: [
    '...kpkkkkkkpk...', '..kplhhhhhhlpk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..', '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..', '..khhpppppphhk..', '.kshpppppppphsk.', '.kskppppppppksk.',
    '..kwlwlwlwlwlk..', '.kppppppppppppk.', '...kssk..kssk...', '...kPPk..kPPk...'],
    alt: { 14: '....kssssssk....', 15: '....kPPPPPPk....' } },
  maou: { rows: [
    '.r....kkkk....r.', '.rk..khhhhk..kr.', '..rkkhhhhhhkkr..', '...khhhhhhhhk...',
    '..ksGrGssGrGsk..', '..ksGGGssGGGsk..', '..kssssssssssk..', '..ksswkkkkwssk..',
    '.GGkSSSSSSSSkGG.', 'GrrkPPPwwPPPkrrG', 'GrrksPPwwPPskrrG', 'GrrksPPyyPPskrrG',
    'GrrrkPPPPPPkrrrG', 'GGrrkBBBBBBkrrGG', 'GGGrkBBkkBBkrGGG', 'GGGGkkk..kkkGGGG'],
    alt: { 15: 'GGGGkkkkkkkkGGGG' } },
  chest: { rows: [
    '................', '................', '................', '...kkkkkkkkkk...',
    '..knnnnnnnnnnk..', '..knyyyyyyyynk..', '..knnnnnnnnnnk..', '..kkkkkyykkkkk..',
    '..knnnnyynnnnk..', '..knnnnnnnnnnk..', '..knnnnnnnnnnk..', '..knyyyyyyyynk..',
    '..kkkkkkkkkkkk..', '................', '................', '................'] },
  chest_open: { rows: [
    '................', '...kkkkkkkkkk...', '..knnnnnnnnnnk..', '..kkkkkkkkkkkk..',
    '..kGGGGGGGGGGk..', '..kGkkkkkkkkGk..', '..kGkkkkkkkkGk..', '..kkkkkkkkkkkk..',
    '..knnnnnnnnnnk..', '..knnnnnnnnnnk..', '..knnnnnnnnnnk..', '..knyyyyyyyynk..',
    '..kkkkkkkkkkkk..', '................', '................', '................'] },
};

const sprCache = {};
function buildSprite(rows, map) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (!ch || ch === '.') continue;
      const m = map && map[ch] !== undefined ? map[ch] : ch;
      if (m === '.') continue;
      g.fillStyle = PAL[m] || m;
      g.fillRect(x, y, 1, 1);
    }
  });
  return c;
}
function mirror(c) {
  const m = document.createElement('canvas'); m.width = m.height = 16;
  const g = m.getContext('2d'); g.translate(16, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return m;
}
function frames(tpl, map) {
  const t = TPL[tpl];
  const f1 = buildSprite(t.rows, map);
  const rows2 = t.rows.slice();
  if (t.alt) for (const k in t.alt) rows2[k] = t.alt[k];
  return [f1, buildSprite(rows2, map)];
}
// a character set: {down, up, left, right} → [frame1, frame2]
function charSet(kind, map) {
  if (kind === 'hero') {
    const d = frames('hero_down', map), u = frames('hero_up', map), r = frames('hero_right', map);
    return { down: d, up: u, right: r, left: r.map(mirror) };
  }
  if (kind === 'girl') {
    const d = frames('girl_down', map), u = frames('girl_up', map);
    return { down: d, up: u, right: d, left: d };
  }
  const d = frames(kind, map);
  return { down: d, up: d, right: d, left: d };
}
const NOBAND = { H: 'h', Y: 'h' };
const SPR = {};
function initSprites() {
  SPR.hero = charSet('hero');
  SPR.momoka = charSet('girl');
  SPR.mom = charSet('girl', { h: 'n', p: '#6a8ac8', P: '#3a5a98', l: 'w', m: 's', r: 'S' });
  SPR.girl = charSet('girl', { h: 'n', p: 'm', P: '#b85a88', l: 'w' });
  SPR.clerk = charSet('hero', { ...NOBAND, p: 'e', P: '#1e5a28', c: 'w', G: 'h', h: 'n' });
  SPR.cafe = charSet('hero', { ...NOBAND, p: 'G', P: 'k', G: 's', c: 's' });
  SPR.staff = charSet('hero', { H: 'G', Y: 'y', p: 'G', P: 'k', w: 'y' });
  SPR.otaku1 = charSet('hero', { p: 'm', P: '#b84a7a', Y: 'm' });
  SPR.otaku2 = charSet('hero', { ...NOBAND, p: 'c', P: '#2a7aa8' });
  SPR.otaku3 = charSet('fat', { p: 'o', P: '#a85a18' });
  SPR.otaku4 = charSet('fat', { ...NOBAND, p: 'e', P: '#1e5a28', h: 'g' });
  SPR.boss = charSet('hero', { ...NOBAND, h: 'g', p: 'G', P: 'k', w: 'w', c: 'w' });
  SPR.gou = charSet('fat', { p: 'y', P: 'o', H: 'r', Y: 'y', w: 'r' });
  SPR.kyohiru = charSet('maou');
  SPR.chest = buildSprite(TPL.chest.rows);
  SPR.chestOpen = buildSprite(TPL.chest_open.rows);
  // battle portraits
  SPR.e = {
    gachikoi: frames('hero_down', { p: 'm', P: '#b84a7a', Y: 'm' })[0],
    ninchi: frames('hero_down', { ...NOBAND, p: 'c', P: '#2a7aa8' })[0],
    kosan: frames('fat', { ...NOBAND, p: 'n', P: '#5a3410', h: 'g' })[0],
    mix: frames('hero_down', { p: 'o', P: '#a85a18', H: 'y', Y: 'r' })[0],
    penra: frames('fat', { p: 'b', P: 'B', H: 'c', Y: 'b' })[0],
    yakkai: frames('fat', { p: 'r', P: 'R', H: 'k', Y: 'r' })[0],
    chizou: frames('fat', { s: 'g', S: 'G', p: 'G', P: 'k', w: 'g', b: 'G', h: 'G', H: 'g', Y: 'g', y: 'G', c: 'k', r: 'G' })[0],
    saizen: frames('hero_down', { p: 'G', P: 'k', H: 'y', Y: 'k' })[0],
    gou: frames('fat', { p: 'y', P: 'o', H: 'r', Y: 'y', w: 'r' })[0],
    kyohiru: frames('maou')[0],
  };
}

// ------------------------------------------------------------
//  Tiles
// ------------------------------------------------------------
function mkTile(fn) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  const p = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  fn(p, g); return c;
}
function grass(p) {
  p(0, 0, 16, 16, '#48b03c');
  [[2, 3], [9, 1], [12, 8], [5, 11], [14, 13], [1, 14], [7, 6], [11, 4]].forEach(([x, y]) => p(x, y, 2, 1, '#2f8a2c'));
}
function wood(p) {
  p(0, 0, 16, 16, '#c8904a');
  p(0, 3, 16, 1, '#a06a30'); p(0, 7, 16, 1, '#a06a30'); p(0, 11, 16, 1, '#a06a30'); p(0, 15, 16, 1, '#a06a30');
  p(5, 0, 1, 3, '#a06a30'); p(12, 4, 1, 3, '#a06a30'); p(3, 8, 1, 3, '#a06a30'); p(10, 12, 1, 3, '#a06a30');
}
function stone(p) {
  p(0, 0, 16, 16, '#5c5a70');
  p(0, 7, 16, 1, '#46445a'); p(0, 15, 16, 1, '#46445a'); p(7, 0, 1, 7, '#46445a'); p(15, 8, 1, 7, '#46445a');
  p(2, 2, 1, 1, '#6c6a82'); p(10, 11, 1, 1, '#6c6a82');
}
function carpet(p) {
  p(0, 0, 16, 16, '#6e34a8');
  for (let i = 0; i < 16; i += 4) { p(i, i, 2, 2, '#8a50c8'); p((i + 8) % 16, i, 2, 2, '#8a50c8'); }
}
function bricks(p, base, line, top) {
  p(0, 0, 16, 16, base);
  [3, 7, 11, 15].forEach(y => p(0, y, 16, 1, line));
  for (let r = 0; r < 4; r++) { const off = r % 2 ? 4 : 0; p((off + 0) % 16, r * 4, 1, 3, line); p((off + 8) % 16, r * 4, 1, 3, line); }
  if (top) p(0, 0, 16, 1, top);
}
const TILES = {
  '.': { d: grass },
  ',': { d: p => { grass(p); [[3, 4, '#f8f070'], [10, 9, '#f890b8'], [6, 12, '#ffffff'], [13, 3, '#f890b8']].forEach(([x, y, c]) => { p(x, y, 2, 2, c); p(x, y + 2, 1, 1, '#2f8a2c'); }); } },
  'T': { solid: 1, d: p => { grass(p); p(3, 1, 10, 10, '#0e3a16'); p(1, 3, 14, 6, '#0e3a16'); p(4, 2, 8, 8, '#2a7a30'); p(2, 4, 12, 4, '#2a7a30'); p(4, 3, 4, 3, '#4aa848'); p(6, 11, 4, 4, '#5a3418'); p(7, 11, 1, 4, '#8a5a30'); } },
  '~': { solid: 1, anim: 1, d: (p, g, f) => { p(0, 0, 16, 16, '#2848c8'); const o = f ? 4 : 0; p((2 + o) % 16, 3, 5, 1, '#6888f8'); p((10 + o) % 16, 8, 4, 1, '#6888f8'); p((4 + o) % 16, 12, 5, 1, '#6888f8'); } },
  '^': { solid: 1, d: p => { grass(p); for (let i = 0; i < 7; i++) { p(8 - i - 1, 2 + i * 2, (i + 1) * 2, 2, i < 2 ? '#f0f0f0' : '#9a6a3a'); p(8, 2 + i * 2, i + 1, 2, i < 2 ? '#c8c8d0' : '#6a4422'); } p(1, 15, 14, 1, '#6a4422'); } },
  '=': { d: p => { p(0, 0, 16, 16, '#8a8a96'); p(0, 0, 16, 1, '#9e9eaa'); p(7, 0, 1, 16, '#767682'); p(0, 7, 7, 1, '#767682'); p(8, 11, 8, 1, '#767682'); } },

// Saves go to up to two places: the player's private slot in the artifact's db (signed-in players

// offers a copyable "ふっかつのじゅもん" that restores progress anywhere.
const STORE = { local: false, cloud: null, cloudState: 'pending', cloudData: null, cloudJson: '', cloudAt: 0, writing: false, onChange: null };
function probeLocal() {

async function initCloud() {
  const done = state => { STORE.cloudState = state; if (STORE.onChange) STORE.onChange(); };
  try {
    if (!window.claude || !window.claude.use) return done('off');
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return done('off');
    if (user.can && (await user.can('data.write')) === false) return done('off');
    STORE.cloud = db.doc('data/users/' + uid + '/save');
    const snap = await STORE.cloud.get();
    STORE.cloudData = snap.exists ? snap.data() : null;
    if (STORE.cloudData) { const { savedAt, ...rest } = STORE.cloudData; STORE.cloudJson = JSON.stringify(rest); }
    done('on');
  } catch (e) { done('off'); }
}

// returns false only when the game could be kept nowhere
function saveGame(force) {
  const json = JSON.stringify(saveState()), now = Date.now();
  let ok = false;
  if (STORE.local) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...JSON.parse(json), savedAt: now })); ok = true; } catch (e) { STORE.local = false; }
  }
  if (STORE.cloudState === 'on') {
    ok = true;
    // the cloud copy is written on a change, at most every 20 s while walking, right away when forced
    if (json !== STORE.cloudJson && !STORE.writing && (force || now - STORE.cloudAt > 20000)) {
      STORE.writing = true; STORE.cloudAt = now;
      STORE.cloud.set({ ...JSON.parse(json), savedAt: now })
        .then(() => { STORE.cloudJson = json; STORE.cloudData = { ...JSON.parse(json), savedAt: now }; },
          e => { if (e && ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(e.code)) STORE.cloudState = 'off'; })
        .finally(() => { STORE.writing = false; });

}

// --- ふっかつのじゅもん: the whole save packed into one copyable code
const CODE_MAPS = ['town', 'field', 'venue', 'tower1', 'tower2', 'chapel'];
const CODE_FLAGS = ['show', 'kidnap', 'gou', 'bridge', 'kyohiru'];
const CODE_CHESTS = ['v1', 'v2', 'v3', 't1', 't2', 't3', 't4'];
const CODE_ITEMS = ['drink', 'drink2', 'photo', 'pass'];
const bitsOf = arr => arr.reduce((a, v, i) => a | (v ? 1 << i : 0), 0);
const codeSum = t => { let h = 7; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) % 1296; return h.toString(36).padStart(2, '0'); };
function makeCode() {
  const a = [1, P.name, P.lv, P.hp, P.mhp, P.mp, P.mmp, P.str, P.vit, P.agi, P.exp, P.gold, P.w, P.a,
    CODE_ITEMS.map(k => Math.min(9, P.items[k] || 0)).join(''), bitsOf(CODE_FLAGS.map(k => flags[k])),
    bitsOf(CODE_CHESTS.map(k => flags.chests[k])), CODE_MAPS.indexOf(game.mapId), player.x, player.y];
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(a)))).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
  return b + codeSum(b);
}
// returns a save object, or null when the code is wrong
function parseCode(text) {
  try {
    const t = String(text).replace(/[\s「」]/g, '');
    const body = t.slice(0, -2);
    if (t.length < 10 || codeSum(body) !== t.slice(-2)) return null;
    const a = JSON.parse(decodeURIComponent(escape(atob(body.replace(/-/g, '+').replace(/_/g, '/')))));
    if (!Array.isArray(a) || a[0] !== 1 || a.length !== 20) return null;
    const n = a.slice(2, 14);
    if (typeof a[1] !== 'string' || !n.every(v => Number.isInteger(v) && v >= 0 && v < 1e6)) return null;
    const [lv, hp, mhp, mp, mmp, str, vit, agi, exp, gold, w, ar] = n;
    if (lv < 1 || lv > MAX_LV || !WEAPONS[w] || !ARMORS[ar] || !CODE_MAPS[a[17]]) return null;
    const items = {};
    String(a[14]).split('').forEach((d, i) => { if (+d > 0 && CODE_ITEMS[i]) items[CODE_ITEMS[i]] = +d; });
    const fl = { chests: {} };
    CODE_FLAGS.forEach((k, i) => { if (a[15] & (1 << i)) fl[k] = true; });
    CODE_CHESTS.forEach((k, i) => { if (a[16] & (1 << i)) fl.chests[k] = 1; });
    const map = CODE_MAPS[a[17]], m = MAPS[map];
    const x = clamp(a[18] | 0, 0, m.w - 1), y = clamp(a[19] | 0, 0, m.h - 1);
    return { P: { name: Array.from(a[1]).slice(0, NAME_MAX).join('') || 'ヲタ太', lv, hp: Math.min(hp, mhp), mhp, mp: Math.min(mp, mmp), mmp, str, vit, agi, exp, gold, w, a: ar, items }, flags: fl, map, x, y, dir: 'down' };
  } catch (e) { return null; }
}

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
function setMap(id, x, y, dir) {
  game.mapId = id; game.map = MAPS[id];
  player.x = x; player.y = y; player.px = x * TS; player.py = y * TS; player.mv = null; if (dir) player.dir = dir;
  game.npcs = game.map.npcs.map(d => ({ ...d, x: d.x, y: d.y, px: d.x * TS, py: d.y * TS, hx: d.x, hy: d.y, dir: d.dir || 'down', mv: null, wt: rnd(60, 200) }));

const npcById = id => game.npcs.find(n => n.id === id);
const npcVisible = n => !n.hidden && (!n.show || n.show());
function blocked(x, y, self) {
  const m = game.map;
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return true;
  const t = TILES[tileAt(m, x, y)]; if (!t || t.solid) return true;
  for (const n of game.npcs) {
    if (n === self || !npcVisible(n)) continue;
    if ((n.x === x && n.y === y) || (n.mv && n.mv.tx === x && n.mv.ty === y)) return true;
  }
  for (const c of m.chests) if (c.x === x && c.y === y) return true;

}
function startMove(a, dir, force) {

  const [dx, dy] = DIRS[dir]; const tx = a.x + dx, ty = a.y + dy;
  if (!force && blocked(tx, ty, a)) return false;
  a.mv = { tx, ty, sx: a.x, sy: a.y, t: 0 };

}

  a.mv.t += a.speed || 2;
  const k = Math.min(1, a.mv.t / TS);
  a.px = (a.mv.sx + (a.mv.tx - a.mv.sx) * k) * TS;
  a.py = (a.mv.sy + (a.mv.ty - a.mv.sy) * k) * TS;

}

async function walk(a, path, speed) {

  closeMsg();
  for (const ch of path) {
    if (ch === '.') { await framesWait(10); continue; }

function updateMap() {
  // npc wander
  if (!game.busy) for (const n of game.npcs) {
    if (!n.wander || n.mv || !npcVisible(n)) continue;
    if (--n.wt > 0) continue;
    n.wt = rnd(60, 220);
    const ds = Object.keys(DIRS), d = ds[rnd(0, 3)], [dx, dy] = DIRS[d];
    if (Math.abs(n.x + dx - n.hx) > 2 || Math.abs(n.y + dy - n.hy) > 2) continue;

function freeInput(keys) {
  if (game.busy || game.mode !== 'map') return;
  for (const k of keys) {
    if (player.mv) break;
    if (k === 'a') { interact(); return; }
    if (k === 'b') { runScript(fieldMenu); return; }
  }
  if (!player.mv) {
    const d = held.up ? 'up' : held.down ? 'down' : held.left ? 'left' : held.right ? 'right' : null;
    if (d) {
      const [dx, dy] = DIRS[d], tx = player.x + dx, ty = player.y + dy, m = game.map;
      if ((tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) && m.onExit) { player.dir = d; runScript(m.onExit); return; }
      player.speed = 2;

}
function onStepDone() {
  const m = game.map, x = player.x, y = player.y, t = tileAt(m, x, y);
  if (m.onStep) { const s = m.onStep(x, y, t); if (s) { runScript(s); return; } }
  if (m.enc) {
    game.steps++;
    if (game.steps > 4 && chance(m.encRate || 1 / 16)) {
      const list = m.enc(x, y);

  }
}
function interact() {
  const [dx, dy] = DIRS[player.dir];
  let tx = player.x + dx, ty = player.y + dy;
  const m = game.map;
  if (tileAt(m, tx, ty) === 'C') { tx += dx; ty += dy; }
  const n = game.npcs.find(n => npcVisible(n) && n.x === tx && n.y === ty);
  if (n && n.talk) {
    if (!n.fixed) n.dir = OPP[player.dir];
    runScript(async () => { await n.talk(n); });
    return;
  }
  const c = m.chests.find(c => c.x === player.x + dx && c.y === player.y + dy);
  if (c) { runScript(() => openChest(c)); return; }
}

async function levelUps() {
  while (P.lv < MAX_LV && P.exp >= EXP_TABLE[P.lv + 1]) {
    P.lv++;
    const g = { mhp: rnd(6, 8), mmp: rnd(2, 4), str: rnd(2, 3), vit: rnd(1, 3), agi: rnd(1, 3) };
    P.mhp += g.mhp; P.mmp += g.mmp; P.str += g.str; P.vit += g.vit; P.agi += g.agi;
    P.hp = Math.min(P.mhp, P.hp + g.mhp); P.mp = Math.min(P.mmp, P.mp + g.mmp);
    await say('レベルが あがった！', { noWait: true }); await jingle('lvup');
    await say(`ちからが ${g.str} あがった！\nみのまもりが ${g.vit} あがった！\nすばやさが ${g.agi} あがった！`);
    await say(`さいだいHPが ${g.mhp} あがった！\nさいだいMPが ${g.mmp} あがった！`);
    const s = SKILLS.find(s => s.lv === P.lv);
    if (s) await say(`ヲタ太は 「${s.name}」を おぼえた！`);
  }
}
// returns 'win' | 'run' | 'lose'
async function battle(id, opt = {}) {
  const base = ENEMIES[id];
  const e = { ...base, id, mhp: base.hp, hp: base.hp };
  const prevMode = game.mode;
  sfx('enc');
  for (let i = 0; i < 6; i++) { game.flash = 4; await framesWait(6); }
  battleS.e = e; battleS.blink = 0; battleS.alpha = 1; battleS.bg = opt.bg || game.map.bg || 'field';
  game.mode = 'battle';
  playBgm(base.boss ? 'boss' : 'battle');
  const sw = statusWin(); extraWins.push(sw);
  await say(opt.intro || `${e.name}が あらわれた！`, { auto: 50 });
  let turn = 0, result = null;
  while (!result) {
    turn++;
    closeMsg();
    const act = await chooseCommand(e);
    msg.lines = []; msg.visible = true;
    if (act.type === 'run') {
      await say('ヲタ太は にげだした！', { append: true, auto: 24 });
      if (base.boss) { await say('しかし にげられない！', { append: true, auto: 40 }); }
      else if (chance(clamp(0.5 + (P.agi - e.agi) * 0.05, 0.25, 0.92))) { sfx('run'); await framesWait(20); result = 'run'; break; }
      else await say('しかし まわりこまれて しまった！', { append: true, auto: 40 });
      await enemyAct(e);
    } else {
      const pFirst = act.type === 'item' || P.agi * (0.6 + Math.random() * 0.6) >= e.agi * (0.6 + Math.random() * 0.6);
      if (pFirst) { await playerAct(e, act); if (e.hp > 0) await enemyAct(e); }
      else { await enemyAct(e); if (P.hp > 0) await playerAct(e, act); }
    }
    if (e.hp <= 0) result = 'win';
    else if (P.hp <= 0) result = 'lose';
    else if (opt.momoka && turn % 3 === 0) {
      await say('百花「ヲタ太くん！ がんばってーー！」', { append: true, auto: 40 });
      const v = Math.min(P.mhp - P.hp, rnd(26, 36)); P.hp += v; sfx('heal');
      await say(`百花の 声援で HPが ${v} かいふくした！`, { append: true, auto: 40 });
    }
  }
  if (result === 'win') {
    for (let i = 20; i >= 0; i--) { battleS.alpha = i / 20; await framesWait(1); }
    await say(`${e.short || e.name}を たおした！`, { append: true, noWait: true });
    await jingle('win');
    msg.lines = [];
    if (e.exp) { P.exp += e.exp; await say(`${e.exp}ポイントの けいけんちを かくとく！`, { append: true, auto: 40 }); }
    if (e.gold) { P.gold += e.gold; await say(`${e.gold}円を てにいれた！`, { append: true, auto: 40 }); }
    if (e.drop && chance(e.drop[1]) && (P.items[e.drop[0]] || 0) < 9) { addItem(e.drop[0]); await say(`${e.short || e.name}は ${ITEMS[e.drop[0]].name}を おとしていった！`, { append: true, auto: 50 }); }
    await waitA();
    await levelUps();
  } else if (result === 'lose') {
    await say('ヲタ太は ちからつきた……', { append: true, noWait: true });
    await jingle('lose');
    await waitA();
  }
  closeMsg(); extraWins.splice(extraWins.indexOf(sw), 1);
  if (result === 'lose') { await gameOver(); return 'lose'; }
  await fadeOut(8);
  game.mode = prevMode === 'battle' ? 'map' : prevMode;
  battleS.e = null;
  playBgm(game.map.bgm);
  await fadeIn(8);
  return result;
}
async function gameOver() {
  await fadeOut(30);
  battleS.e = null; game.mode = 'map';
  P.gold = Math.floor(P.gold / 2); P.hp = P.mhp; P.mp = P.mmp;
  setMap('town', 4, 4, 'down');
  await fadeIn(30);

}

const NAME_MAX = 6;
const KANA_ROWS = ['あいうえおかきくけこ', 'さしすせそたちつてと', 'なにぬねのはひふへほ', 'まみむめもやゆよわを',
  'らりるれろんぁぃぅぇ', 'がぎぐげござじずぜぞ', 'だぢづでどばびぶべぼ', 'ぱぴぷぺぽぉゃゅょっ'];
const NAME_CMDS = [{ label: 'カナ', act: 'kana' }, { label: 'ー', act: 'ー' }, { label: 'けす', act: 'del' }, { label: 'おわる', act: 'ok' }];
const toKata = t => t.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const ne = { name: '', kata: false, r: 0, c: 0 };
const nameField = document.getElementById('name-field');
const nameInput = document.getElementById('hero-name');
const clipName = v => Array.from(v.replace(/\s+/g, ' ').trim()).slice(0, NAME_MAX).join('');
nameInput.addEventListener('input', () => { ne.name = Array.from(nameInput.value).slice(0, NAME_MAX).join(''); });
function nameEntry() {
  ne.name = ''; ne.kata = false; ne.r = 0; ne.c = 0;
  nameInput.value = ''; nameField.hidden = false;
  game.mode = 'name';
  return new Promise(res => {
    const finish = () => {
      sfx('ok'); nameField.hidden = true; modal = null;
      nameInput.blur(); cv.focus();
      res(clipName(ne.name) || 'ヲタ太');
    };
    const sync = () => { nameInput.value = ne.name; };
    const rowLen = r => r < KANA_ROWS.length ? 10 : NAME_CMDS.length;
    nameInput.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finish(); } };
    document.getElementById('name-ok').onclick = finish;
    modal = k => {
      const rows = KANA_ROWS.length + 1;
      if (k === 'up' || k === 'down') {
        const or = ne.r; ne.r = (ne.r + (k === 'up' ? -1 : 1) + rows) % rows;
        if (rowLen(or) !== rowLen(ne.r)) ne.c = Math.round(ne.c * (rowLen(ne.r) - 1) / (rowLen(or) - 1));
        sfx('cur');
      } else if (k === 'left' || k === 'right') {
        ne.c = (ne.c + (k === 'left' ? -1 : 1) + rowLen(ne.r)) % rowLen(ne.r); sfx('cur');
      } else if (k === 'b') {
        ne.name = Array.from(ne.name).slice(0, -1).join(''); sync(); sfx('cur');
      } else if (k === 'a') {
        let add = null;
        if (ne.r < KANA_ROWS.length) add = KANA_ROWS[ne.r][ne.c];
        else {
          const act = NAME_CMDS[ne.c].act;
          if (act === 'kana') { ne.kata = !ne.kata; sfx('ok'); return; }
          if (act === 'del') { ne.name = Array.from(ne.name).slice(0, -1).join(''); sync(); sfx('cur'); return; }
          if (act === 'ok') { finish(); return; }
          add = act;
        }
        if (Array.from(ne.name).length >= NAME_MAX) { sfx('ng'); return; }
        ne.name += ne.kata ? toKata(add) : add; sync(); sfx('cur');
      }
    };
  });
}
function drawName() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawWin(8, 6, 240, 48);
  txt('主人公の なまえを きめてください', 20, 13);
  const chars = Array.from(ne.name);
  for (let i = 0; i < NAME_MAX; i++) {
    const x = 74 + i * 18;
    ctx.fillStyle = '#7a7488'; ctx.fillRect(x, 47, 14, 1);
    if (chars[i]) txt(chars[i], x + 1, 32, '#fff', 12, 14);
    else if (i === chars.length && (game.frame >> 4) % 2 === 0) { ctx.fillStyle = '#f7b0cc'; ctx.fillRect(x, 45, 14, 2); }
  }
  drawWin(8, 58, 240, 160);
  const blink = (game.frame >> 4) % 2 === 0;
  const arrow = (x, y) => { ctx.fillStyle = '#fff'; for (let k = 0; k < 4; k++) ctx.fillRect(x + k, y + k, 1, 8 - k * 2); };
  KANA_ROWS.forEach((row, r) => {
    Array.from(ne.kata ? toKata(row) : row).forEach((ch, c) => {
      const x = 26 + c * 21 + (c >= 5 ? 6 : 0), y = 66 + r * 16;
      txt(ch, x, y);
      if (r === ne.r && c === ne.c && blink) arrow(x - 8, y + 2);
    });
  });
  NAME_CMDS.forEach((cmd, c) => {
    const x = 26 + c * 56, y = 198;
    const label = cmd.act === 'kana' ? (ne.kata ? 'ひら' : 'カナ') : cmd.label;
    txt(label, x, y, cmd.act === 'ok' ? '#f7b0cc' : '#fff');
    if (ne.r === KANA_ROWS.length && ne.c === c && blink) arrow(x - 8, y + 2);
  });
}

function drawWin(x, y, w, h, border = '#fff') {
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = border;
  ctx.fillRect(x + 3, y + 1, w - 6, 2); ctx.fillRect(x + 3, y + h - 3, w - 6, 2);
  ctx.fillRect(x + 1, y + 3, 2, h - 6); ctx.fillRect(x + w - 3, y + 3, 2, h - 6);
  ctx.fillRect(x + 2, y + 2, 2, 2); ctx.fillRect(x + w - 4, y + 2, 2, 2); ctx.fillRect(x + 2, y + h - 4, 2, 2); ctx.fillRect(x + w - 4, y + h - 4, 2, 2);
}
function txt(s, x, y, col = '#fff', size = 12, maxW) {
  ctx.font = size + 'px ' + FONT; ctx.textBaseline = 'top'; ctx.fillStyle = col;
  if (maxW) ctx.fillText(s, x, y, maxW); else ctx.fillText(s, x, y);
}
function drawUI() {
  for (const w of extraWins) w();
  if (msg.visible) {
    drawWin(msg.x, msg.y, msg.w, msg.h);
    msg.lines.forEach((L, i) => txt(L.t.slice(0, Math.floor(L.n)), msg.x + 12, msg.y + 10 + i * 20));
    if (msg.arrow && (game.frame >> 4) % 2 === 0) { ctx.fillStyle = '#fff'; const ax = msg.x + msg.w / 2 - 3, ay = msg.y + msg.h - 11; ctx.fillRect(ax, ay, 7, 1); ctx.fillRect(ax + 1, ay + 1, 5, 1); ctx.fillRect(ax + 2, ay + 2, 3, 1); ctx.fillRect(ax + 3, ay + 3, 1, 1); }
  }
  for (const m of menus) {
    drawWin(m.x, m.y, m.w, m.h);
    m.items.forEach((it, i) => {
      const label = typeof it === 'string' ? it : it.label;
      const col = it.disabled ? '#7a7488' : '#fff';
      txt(label, m.x + 20, m.y + 8 + i * m.lh, col);
      if (it.right) txt(it.right, m.x + m.w - 10 - textW(it.right), m.y + 8 + i * m.lh, col);
      if (i === m.idx && (!m.active || (game.frame >> 4) % 2 === 0)) {
        const cx = m.x + 9, cy = m.y + 10 + i * m.lh; ctx.fillStyle = '#fff';
        for (let k = 0; k < 4; k++) ctx.fillRect(cx + k, cy + k, 1, 8 - k * 2);
      }
    });
    if (m.info && m.active) {
      drawWin(8, 144, 240, 76);
      String(m.info(m.idx)).split('\n').forEach((l, i) => txt(l, 20, 154 + i * 20, l.startsWith('【') ? '#f7b0cc' : '#fff', 12, 216));
    }
  }
}
function heartAt(x, y, col) {
  const pat = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
  ctx.fillStyle = col;
  pat.forEach((r, j) => { for (let i = 0; i < 7; i++) if (r[i] === '#') ctx.fillRect(x + i, y + j, 1, 1); });
}

function update() {
