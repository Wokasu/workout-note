<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-->
<title>百花クエストⅠ THE LAST WOTA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one console column — the NES-ratio screen on top, controls under it */
:root {
  --bg: #0c0812;
  --shell: #1c1428;
  --shell-edge: #33264a;
  --ink: #efe9fb;
  --dim: #9d92b8;
  --oshi: #f4a6c6;
  --btn: #2b2040;
  --btn-press: #4a3570;
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "MS Gothic", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.console {
  --reserve: 96px;
  width: min(100%, 768px, calc((100dvh - var(--reserve)) * 256 / 224));
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.screen-wrap {
  background: var(--shell);
  border: 2px solid var(--shell-edge);
  border-radius: 10px;
  padding: 8px;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 256 / 224;
  max-width: 100%;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 2px;
  outline: none;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  font-size: 13px;
  color: var(--dim);
}
.bar kbd {
  font-family: var(--font);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--shell-edge);
  border-radius: 4px;
  padding: 0 6px;
}
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; }
button {
  font-family: var(--font);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--shell-edge);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--oshi); outline-offset: 2px; }
.name-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--dim); }
.name-field[hidden] { display: none; }
.err { margin: 0; font-size: 12px; line-height: 1.5; color: #f8c070; overflow-wrap: anywhere; }
.code-panel textarea {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; line-height: 1.4;
  color: var(--ink); background: #000; border: 2px solid var(--shell-edge); border-radius: 6px;
  padding: 6px 10px; resize: none; word-break: break-all; min-width: 0;
  -webkit-user-select: text; user-select: text;
}
.code-panel .name-row { justify-content: flex-end; }
.code-panel button[hidden] { display: none; }
.name-row { display: flex; gap: 8px; }
.name-row input {
  flex: 1; min-width: 0;
  font-family: var(--font); font-size: 18px;
  color: var(--ink); background: #000;
  border: 2px solid var(--shell-edge); border-radius: 6px; padding: 6px 10px;
  -webkit-user-select: text; user-select: text;
}
.name-row input:focus-visible { outline: 2px solid var(--oshi); outline-offset: 1px; }
.pad {
  display: none;
  justify-content: space-between;
  align-items: center;
  padding: 4px 6px 0;
  touch-action: none;
}
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  grid-template-rows: repeat(3, 54px);
}
.dpad button, .ab button {
  padding: 0;
  font-size: 18px;
  touch-action: none;
}
.dpad button.on, .ab button.on { background: var(--btn-press); }
.dpad .u { grid-area: 1 / 2; border-radius: 8px 8px 0 0; }
.dpad .l { grid-area: 2 / 1; border-radius: 8px 0 0 8px; }
.dpad .r { grid-area: 2 / 3; border-radius: 0 8px 8px 0; }
.dpad .d { grid-area: 3 / 2; border-radius: 0 0 8px 8px; }
.dpad .c { grid-area: 2 / 2; background: var(--btn); border-radius: 0; pointer-events: none; }
.ab { display: flex; gap: 18px; align-items: center; transform: rotate(-12deg); }
.ab button {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--oshi); border-color: #ffd6e6; color: #3a1828; font-size: 20px;
}
.ab .b { background: #d77ea6; margin-top: 34px; }
.ab button.on { background: #ffe4ef; color: #3a1828; }
@media (pointer: coarse) {
  .console { --reserve: 270px; }
  .pad { display: flex; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
<!--/PAGE-->
</head>
<body>
<!--BODY-->
<div class="console">
  <div class="screen-wrap"><canvas id="screen" tabindex="0" aria-label="百花クエストⅠ THE LAST WOTA ゲーム画面"></canvas></div>
  <div class="name-field" id="name-field" hidden>
    <label for="hero-name">キーボードで入力（漢字もOK・6文字まで）</label>
    <div class="name-row">
      <input id="hero-name" type="text" maxlength="6" autocomplete="off" enterkeyhint="done" placeholder="ヲタ太">
      <button id="name-ok" type="button">けってい</button>
    </div>
  </div>
  <div class="name-field code-panel" id="code-panel" hidden>
    <label id="code-label" for="code-text">ふっかつのじゅもん</label>
    <textarea id="code-text" rows="3" spellcheck="false" autocomplete="off"></textarea>
    <div class="name-row">
      <button id="code-copy" type="button">コピー</button>
      <button id="code-ok" type="button">けってい</button>
      <button id="code-close" type="button">とじる</button>
    </div>
  </div>
  <p class="err" id="err" hidden></p>
  <div class="bar">
    <div class="keys">
      <span><kbd>↑↓←→</kbd> いどう</span>
      <span><kbd>Z</kbd> <kbd>Enter</kbd> けってい・はなす</span>
      <span><kbd>X</kbd> <kbd>Esc</kbd> キャンセル・メニュー</span>
    </div>
    <button id="sound" type="button" aria-pressed="true">サウンド ON</button>
  </div>
  <div class="pad" aria-hidden="true">
    <div class="dpad">
      <button class="u" data-k="up" type="button">▲</button>
      <button class="l" data-k="left" type="button">◀</button>
      <span class="c"></span>
      <button class="r" data-k="right" type="button">▶</button>
      <button class="d" data-k="down" type="button">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" type="button">B</button>
      <button class="a" data-k="a" type="button">A</button>
    </div>
  </div>
</div>
<script>
'use strict';
// ============================================================

const W = 256, H = 224, S = 3, TS = 16;

cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
const FONT = '"DotGothic16", "Hiragino Kaku Gothic ProN", "MS Gothic", monospace';
function resetT() { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false; }
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ------------------------------------------------------------

  g: '#a0a0ae', G: '#4a4a5a', r: '#d83838', R: '#8a1c1c', y: '#f8d838',
  n: '#8a5a30', e: '#3a9a3a', o: '#f89838', c: '#78d8f8', m: '#f890b8',
  H: '#f8f8f8', Y: '#d83838',

const TPL = {

const sprCache = {};
function buildSprite(rows, map) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (!ch || ch === '.') continue;
      const m = map && map[ch] !== undefined ? map[ch] : ch;
      if (m === '.') continue;
      g.fillStyle = PAL[m] || m;
      g.fillRect(x, y, 1, 1);
    }
  });
  return c;
}
function mirror(c) {
  const m = document.createElement('canvas'); m.width = m.height = 16;
  const g = m.getContext('2d'); g.translate(16, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return m;
}
function frames(tpl, map) {
  const t = TPL[tpl];
  const f1 = buildSprite(t.rows, map);
  const rows2 = t.rows.slice();
  if (t.alt) for (const k in t.alt) rows2[k] = t.alt[k];
  return [f1, buildSprite(rows2, map)];
}
// a character set: {down, up, left, right} → [frame1, frame2]
function charSet(kind, map) {
  if (kind === 'hero') {
    const d = frames('hero_down', map), u = frames('hero_up', map), r = frames('hero_right', map);
    return { down: d, up: u, right: r, left: r.map(mirror) };
  }
  if (kind === 'girl') {
    const d = frames('girl_down', map), u = frames('girl_up', map);
    return { down: d, up: u, right: d, left: d };
  }
  const d = frames(kind, map);
  return { down: d, up: d, right: d, left: d };
}
const NOBAND = { H: 'h', Y: 'h' };
const SPR = {};

// what an item / gear / skill does, shown under menus. A 【tag】 first line says what kind of thing it is.
function itemInfo(id) {
  const it = ITEMS[id];
  if (it.kind === 'key') return '【だいじなもの】つかっても なくならない\n' + it.desc;
  return `【どうぐ】1回 つかうと なくなる\n${it.kind === 'hp' ? 'HP' : 'MP'}を ${it.v} かいふくする。\nいどう中も せんとう中も つかえる。`;
}
// collected equipment: every piece ever obtained stays in P.ownW / P.ownA
function ensureOwned() {
  const w = new Set(P.ownW || []), a = new Set(P.ownA || []);
  w.add(0); w.add(P.w); a.add(0); a.add(P.a);
  for (const id in MAPS) for (const c of MAPS[id].chests || []) if (flags.chests && flags.chests[c.id]) { if (c.weapon !== undefined) w.add(c.weapon); if (c.armor !== undefined) a.add(c.armor); }
  if (flags.momEp) w.add(WEAPONS.findIndex(x => x.name === '母のペンライト'));
  P.ownW = [...w].filter(i => WEAPONS[i]).sort((x, y) => x - y); P.ownA = [...a].filter(i => ARMORS[i]).sort((x, y) => x - y);
}
// adds a piece to the collection and equips it only when it is stronger; returns true if equipped
function gainGear(t, id) {
  ensureOwned();
  const own = t === 'w' ? P.ownW : P.ownA; if (!own.includes(id)) { own.push(id); own.sort((x, y) => x - y); }
  if (t === 'w' ? WEAPONS[id].atk > WEAPONS[P.w].atk : ARMORS[id].def > ARMORS[P.a].def) { if (t === 'w') P.w = id; else P.a = id; return true; }
  return false;
}
async function equipMenu() {
  ensureOwned();
  const cat = openMenu({ items: ['ぶき', 'ぼうぐ', 'もどる'], x: 176, y: 40, w: 72 });
  while (true) {
    const c = await chooseMenu(cat);
    if (c === -1 || c === 2) break;
    while (true) {
      const t = c === 0 ? 'w' : 'a', ids = t === 'w' ? P.ownW : P.ownA;
      const items = ids.map(id => { const g = t === 'w' ? WEAPONS[id] : ARMORS[id]; return { label: ((t === 'w' ? P.w : P.a) === id ? 'E ' : '  ') + g.name, right: '+' + (t === 'w' ? g.atk : g.def) }; });
      const r = await pick({ items, x: 84, y: 40, w: 164, info: i => gearInfo(t, ids[i]) });
      if (r < 0) break;
      const id = ids[r], g = t === 'w' ? WEAPONS[id] : ARMORS[id];
      if ((t === 'w' ? P.w : P.a) === id) continue;
      if (t === 'w') P.w = id; else P.a = id; sfx('ok');
      await say(`ヲタ太は ${g.name}を そうびした！`); closeMsg();
    }
  }
  closeMenu(cat);
}
function gearInfo(t, id) {
  const w = t === 'w', g = w ? WEAPONS[id] : ARMORS[id], cur = w ? WEAPONS[P.w] : ARMORS[P.a];
  const stat = w ? 'こうげき力' : 'しゅび力', v = w ? g.atk : g.def, cv = w ? cur.atk : cur.def, now = w ? atkOf() : defOf();
  const last = (w ? P.w : P.a) === id ? 'いま そうびしている。'
    : v <= cv ? 'いまの そうびの ほうが つよい。'
    : `${stat} ${now} → ${now - cv + v} にアップ！`;
  return `【${w ? 'ぶき' : 'ぼうぐ'}】そうびすると ずっと こうか\n${stat} +${v}（いまの そうびは +${cv}）\n${last}`;
}

// ------------------------------------------------------------
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
function setMap(id, x, y, dir) {
  game.mapId = id; game.map = MAPS[id];
  player.x = x; player.y = y; player.px = x * TS; player.py = y * TS; player.mv = null; if (dir) player.dir = dir;
  game.npcs = game.map.npcs.map(d => ({ ...d, x: d.x, y: d.y, px: d.x * TS, py: d.y * TS, hx: d.x, hy: d.y, dir: d.dir || 'down', mv: null, wt: rnd(60, 200) }));
  game.steps = 0;
  if (game.map.bgm) playBgm(game.map.bgm);
}
const npcById = id => game.npcs.find(n => n.id === id);
const npcVisible = n => game.flashback ? !!n.fb : !n.hidden && (!n.show || n.show());
function blocked(x, y, self) {
  const m = game.map;
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return true;
  const t = TILES[tileAt(m, x, y)]; if (!t || t.solid) return true;
  for (const n of game.npcs) {
    if (n === self || !npcVisible(n)) continue;
    if ((n.x === x && n.y === y) || (n.mv && n.mv.tx === x && n.mv.ty === y)) return true;
  }
  for (const c of m.chests) if (c.x === x && c.y === y) return true;
  if (self !== player && ((player.x === x && player.y === y) || (player.mv && player.mv.tx === x && player.mv.ty === y))) return true;
  return false;
}
function startMove(a, dir, force) {
  a.dir = dir;
  const [dx, dy] = DIRS[dir]; const tx = a.x + dx, ty = a.y + dy;
  if (!force && blocked(tx, ty, a)) return false;
  a.mv = { tx, ty, sx: a.x, sy: a.y, t: 0 };
  return true;
}
function stepActor(a) {
  if (!a.mv) return false;
  a.mv.t += a.speed || 2;
  const k = Math.min(1, a.mv.t / TS);
  a.px = (a.mv.sx + (a.mv.tx - a.mv.sx) * k) * TS;
  a.py = (a.mv.sy + (a.mv.ty - a.mv.sy) * k) * TS;
  if (k >= 1) { a.x = a.mv.tx; a.y = a.mv.ty; a.mv = null; return true; }
  return false;
}
// scripted walk: path string like "UUL"
async function walk(a, path, speed) {
  const m = { U: 'up', D: 'down', L: 'left', R: 'right' };
  closeMsg();
  for (const ch of path) {
    if (ch === '.') { await framesWait(10); continue; }
    a.speed = speed || 1;
    startMove(a, m[ch], true);
    await until(() => !a.mv);
    a.speed = 0;
  }
}
function face(a, dir) { a.dir = dir; }

function updateMap() {
  // npc wander
  if (!game.busy) for (const n of game.npcs) {
    if (!n.wander || n.mv || !npcVisible(n)) continue;
    if (--n.wt > 0) continue;
    n.wt = rnd(60, 220);
    const ds = Object.keys(DIRS), d = ds[rnd(0, 3)], [dx, dy] = DIRS[d];
    if (Math.abs(n.x + dx - n.hx) > 2 || Math.abs(n.y + dy - n.hy) > 2) continue;
    n.speed = 1; startMove(n, d);
  }
  for (const n of game.npcs) stepActor(n);
  if (stepActor(player) && !game.busy) onStepDone();
}
function freeInput(keys) {
  if (game.busy || game.mode !== 'map') return;
  for (const k of keys) {
    if (player.mv) break;
    if (k === 'a') { interact(); return; }
    if (k === 'b') { runScript(fieldMenu); return; }
  }
  if (!player.mv) {
    const d = held.up ? 'up' : held.down ? 'down' : held.left ? 'left' : held.right ? 'right' : null;
    if (d) {
      const [dx, dy] = DIRS[d], tx = player.x + dx, ty = player.y + dy, m = game.map;
      if ((tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) && m.onExit) { player.dir = d; runScript(m.onExit); return; }
      player.speed = 2;
      if (!startMove(player, d)) { if (game.frame % 14 === 0) sfx('bump'); }
    }
  }
}
function onStepDone() {
  const m = game.map, x = player.x, y = player.y, t = tileAt(m, x, y);
  if (m.onStep) { const s = m.onStep(x, y, t); if (s) { runScript(s); return; } }
  if (m.enc) {
    game.steps++;
    if (game.steps > 4 && chance(m.encRate || 1 / 16)) {
      const list = m.enc(x, y);
      if (list && list.length) { game.steps = 0; runScript(() => battle(list[rnd(0, list.length - 1)])); }
    }
  }
}
function interact() {
  const [dx, dy] = DIRS[player.dir];
  let tx = player.x + dx, ty = player.y + dy;
  const m = game.map;
  if (tileAt(m, tx, ty) === 'C') { tx += dx; ty += dy; }
  const n = game.npcs.find(n => npcVisible(n) && n.x === tx && n.y === ty);
  if (n && n.talk) {
    if (!n.fixed) n.dir = OPP[player.dir];
    runScript(async () => { await n.talk(n); });
    return;
  }
  const c = m.chests.find(c => c.x === player.x + dx && c.y === player.y + dy);
  if (c) { runScript(() => openChest(c)); return; }
}
async function openChest(c) {
  if (flags.chests[c.id]) { await say('からっぽだ。'); return; }
  flags.chests[c.id] = 1; sfx('door');
  if (c.gold) { P.gold += c.gold; await say(`たからばこを あけた！\n${c.gold}円を てにいれた！`); return; }
  if (c.weapon !== undefined) {
    await say(`たからばこを あけた！\n${WEAPONS[c.weapon].name}を てにいれた！`, { noWait: true }); await jingle('get'); playBgm(game.map.bgm);
    if (gainGear('w', c.weapon)) { await say(`ヲタ太は ${WEAPONS[c.weapon].name}を そうびした！`); }
    else await waitA();
    return;
  }
  if (c.armor !== undefined) {
    await say(`たからばこを あけた！\n${ARMORS[c.armor].name}を てにいれた！`, { noWait: true }); await jingle('get'); playBgm(game.map.bgm);
    if (gainGear('a', c.armor)) { await say(`ヲタ太は ${ARMORS[c.armor].name}を そうびした！`); }
    else await waitA();
    return;
  }
  addItem(c.item, c.n || 1);
  await say(`たからばこを あけた！\n${ITEMS[c.item].name}を てにいれた！`);
}

const NAME_MAX = 6;
const KANA_ROWS = ['あいうえおかきくけこ', 'さしすせそたちつてと', 'なにぬねのはひふへほ', 'まみむめもやゆよわを',
  'らりるれろんぁぃぅぇ', 'がぎぐげござじずぜぞ', 'だぢづでどばびぶべぼ', 'ぱぴぷぺぽぉゃゅょっ'];
const NAME_CMDS = [{ label: 'カナ', act: 'kana' }, { label: 'ー', act: 'ー' }, { label: 'けす', act: 'del' }, { label: 'おわる', act: 'ok' }];
const toKata = t => t.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const ne = { name: '', kata: false, r: 0, c: 0 };
const nameField = document.getElementById('name-field');
const nameInput = document.getElementById('hero-name');
const clipName = v => Array.from(v.replace(/\s+/g, ' ').trim()).slice(0, NAME_MAX).join('');
nameInput.addEventListener('input', () => { ne.name = Array.from(nameInput.value).slice(0, NAME_MAX).join(''); });
function nameEntry() {
  ne.name = ''; ne.kata = false; ne.r = 0; ne.c = 0;
  nameInput.value = ''; nameField.hidden = false;
  game.mode = 'name';
  return new Promise(res => {
    const finish = () => {
      sfx('ok'); nameField.hidden = true; modal = null;
      nameInput.blur(); cv.focus();
      res(clipName(ne.name) || 'ヲタ太');
    };
    const sync = () => { nameInput.value = ne.name; };
    const rowLen = r => r < KANA_ROWS.length ? 10 : NAME_CMDS.length;
    nameInput.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finish(); } };
    document.getElementById('name-ok').onclick = finish;
    modal = k => {
      const rows = KANA_ROWS.length + 1;
      if (k === 'up' || k === 'down') {
        const or = ne.r; ne.r = (ne.r + (k === 'up' ? -1 : 1) + rows) % rows;
        if (rowLen(or) !== rowLen(ne.r)) ne.c = Math.round(ne.c * (rowLen(ne.r) - 1) / (rowLen(or) - 1));
        sfx('cur');
      } else if (k === 'left' || k === 'right') {
        ne.c = (ne.c + (k === 'left' ? -1 : 1) + rowLen(ne.r)) % rowLen(ne.r); sfx('cur');
      } else if (k === 'b') {
        ne.name = Array.from(ne.name).slice(0, -1).join(''); sync(); sfx('cur');
      } else if (k === 'a') {
        let add = null;
        if (ne.r < KANA_ROWS.length) add = KANA_ROWS[ne.r][ne.c];
        else {
          const act = NAME_CMDS[ne.c].act;
          if (act === 'kana') { ne.kata = !ne.kata; sfx('ok'); return; }
          if (act === 'del') { ne.name = Array.from(ne.name).slice(0, -1).join(''); sync(); sfx('cur'); return; }
          if (act === 'ok') { finish(); return; }
          add = act;
        }
        if (Array.from(ne.name).length >= NAME_MAX) { sfx('ng'); return; }
        ne.name += ne.kata ? toKata(add) : add; sync(); sfx('cur');
      }
    };
  });
}
function drawName() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawWin(8, 6, 240, 48);
  txt('主人公の なまえを きめてください', 20, 13);

  }
  drawWin(8, 58, 240, 160);
  const blink = (game.frame >> 4) % 2 === 0;
  const arrow = (x, y) => { ctx.fillStyle = '#fff'; for (let k = 0; k < 4; k++) ctx.fillRect(x + k, y + k, 1, 8 - k * 2); };
  KANA_ROWS.forEach((row, r) => {
    Array.from(ne.kata ? toKata(row) : row).forEach((ch, c) => {
      const x = 26 + c * 21 + (c >= 5 ? 6 : 0), y = 66 + r * 16;

}

// never leave the player on a black screen: if loading the save fails, restart at home with the same stats
async function resume(save) {
  try { await resumeRaw(save); }
  catch (e) {
    reportError(e);
    try {
      if (save && save.P) { newGame(); Object.assign(P, save.P); Object.assign(flags, save.flags || {}); flags.chests = flags.chests || {}; }
      flags.scene = null; game.flashback = false; game.heroSpr = null; cv.style.filter = '';
      game.mode = 'map'; setMap('town', 4, 4, 'down');
    } catch (e2) { reportError(e2); newGame(); game.mode = 'map'; setMap('town', 4, 4, 'down'); }
    game.fade = 0; game.busy = false;
  }
}
async function resumeRaw(save) {
  if (save.flags && save.flags.cleared) return newGamePlus(save);
  if (game.fade < 1) await fadeOut(20);
  newGame(); Object.assign(P, save.P); Object.assign(flags, save.flags); flags.chests = flags.chests || {};
  if (!MAPS[save.map]) { save.map = 'town'; save.x = 4; save.y = 4; }
  game.flashback = false; game.heroSpr = null; cv.style.filter = '';
  if (flags.kidnap) flags.skMatome = true;
  repairProofs(); ensureOwned();
  game.mode = 'map';
  setMap(save.map, save.x, save.y, save.dir);
  toast(game.map.name);
  await fadeIn(20);
  game.busy = false;
  saveGame(true);
  await warnNoSave();
}

}

      // decorate roughly one tile in seven; wall decorations only where the wall faces a walkable tile
      const hsh = ((tx * 73856093) ^ (ty * 19349663)) >>> 0;
