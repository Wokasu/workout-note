<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>筋トレノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  /* レイアウト：スマホのアプリと同じ「上にヘッダーと部位チップ、中央がスクロール、下にタブバー」の一画面構成 */
  :root {
    --bg: #f4f2ef;
    --surface: #ffffff;
    --surface-2: #eeebe7;
    --ink: #1d1b19;
    --ink-2: #5d5853;
    --ink-3: #8c8680;
    --line: #e2ddd7;
    --grid: #ece8e3;
    --accent: #d4480f;
    --accent-ink: #ffffff;
    --accent-soft: #fbe3d6;
    --warn-bg: #fcefd2;
    --warn-ink: #7f4500;
    --good-bg: #e2f2e8;
    --good: #12744a;
    --bad: #c22b2b;
    --paper: #fffdf6;
    --paper-ink: #1e3a8a;
    /* 部位（色だけに頼らず必ず部位名と一緒に表示） */
    --p-chest: #2a78d6;
    --p-back: #eb6834;
    --p-legs: #1baf7a;
    --p-shoulders: #eda100;
    --p-arms: #e87ba4;
    --p-other: #a8a29e;
    --font-num: "Barlow Condensed", "Arial Narrow", "Hiragino Sans", sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    --gl: max(16px, env(safe-area-inset-left, 0px));
    --gr: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151311; --surface: #201d1a; --surface-2: #2a2622; --ink: #f1eeea; --ink-2: #bab3ab; --ink-3: #857e77;
      --line: #36312c; --grid: #2c2824; --accent: #f06a2c; --accent-ink: #1a0d06; --accent-soft: #3b2216;
      --warn-bg: #3a2a10; --warn-ink: #f4c77c; --good: #4cc38a; --good-bg: #16301f; --bad: #f07a7a; --paper: #1f2433; --paper-ink: #c7d4ff;
      --p-chest: #3987e5; --p-back: #d95926; --p-legs: #199e70; --p-shoulders: #c98500; --p-arms: #d55181; --p-other: #78716c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151311; --surface: #201d1a; --surface-2: #2a2622; --ink: #f1eeea; --ink-2: #bab3ab; --ink-3: #857e77;
    --line: #36312c; --grid: #2c2824; --accent: #f06a2c; --accent-ink: #1a0d06; --accent-soft: #3b2216;
    --warn-bg: #3a2a10; --warn-ink: #f4c77c; --good: #4cc38a; --good-bg: #16301f; --bad: #f07a7a; --paper: #1f2433; --paper-ink: #c7d4ff;
    --p-chest: #3987e5; --p-back: #d95926; --p-legs: #199e70; --p-shoulders: #c98500; --p-arms: #d55181; --p-other: #78716c;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  * { box-sizing: border-box; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

  /* ヘッダー */
  .top { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px var(--gr) 10px var(--gl); display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .top h1 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 20px; color: var(--ink); flex: none; }
  .icon-btn:hover { background: var(--surface-2); }

  /* 部位チップ */
  .chips { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 10px var(--gr) 6px var(--gl); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }

  main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view { padding: 8px var(--gr) 28px var(--gl); display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin: 0 auto; width: 100%; }

  /* タブバー */
  .tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px var(--gr) 8px var(--gl); }
  .tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--ink-3); padding: 4px 0; }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .tab.fab { color: var(--ink); }
  .tab.fab .disc { width: 50px; height: 50px; margin-top: -24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(212,72,15,.35); }
  .tab.fab .disc svg { width: 24px; height: 24px; stroke-width: 2.4; }

  /* 共通パーツ */
  .card { background: var(--surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 0; }
  .muted { color: var(--ink-3); font-size: 11px; }
  .sub { color: var(--ink-2); font-size: 13px; line-height: 1.6; }
  .btn { border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost { background: transparent; color: var(--ink-2); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { padding: 8px 10px; font-size: 13px; border-radius: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.6; }
  .warn b { display: block; margin-bottom: 2px; }
  .notice { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }

  .month { display: flex; align-items: center; justify-content: space-between; }
  .month b { font-size: 16px; }

  /* ダッシュボード */
  .hero-label { font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .hero { font-family: var(--font-num); font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .hero small { font-size: 20px; font-weight: 600; margin-left: 4px; color: var(--ink-2); }
  .delta { font-size: 12px; font-weight: 700; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.none { color: var(--ink-3); font-weight: 400; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--surface); border-radius: 14px; padding: 10px 12px; }
  .kpi .v { font-family: var(--font-num); font-size: 28px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 13px; color: var(--ink-2); margin-left: 2px; font-weight: 600; }
  .kpi .l { font-size: 11px; color: var(--ink-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  svg.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  svg.chart text { font-size: 10px; fill: var(--ink-3); font-family: var(--font-body); }
  svg.chart .grid { stroke: var(--grid); } svg.chart .axis { stroke: var(--line); }
  svg.chart .label-strong { fill: var(--ink); font-weight: 700; }
  .readout { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  .readout .k { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--c); }
  .hbar { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
  .track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--c); border-radius: 0 4px 4px 0; }
  .hbar .v { font-family: var(--font-num); font-size: 15px; font-weight: 600; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--grid); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
  .list-item:first-of-type { border-top: 0; }

  /* カレンダー */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .wd { text-align: center; font-size: 11px; color: var(--ink-3); padding: 2px 0; }
  .sun { color: var(--bad) !important; } .sat { color: var(--p-chest) !important; }
  .day { min-height: 54px; border-radius: 9px; background: var(--surface); border: 2px solid transparent; padding: 3px 1px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .day.out { background: transparent; border: 0; }
  .day[aria-pressed="true"] { border-color: var(--ink); }
  .day:disabled { opacity: .35; cursor: default; }
  .day.dim { opacity: .35; }
  .day .n { font-family: var(--font-num); font-size: 15px; font-weight: 600; line-height: 20px; width: 22px; text-align: center; }
  .day.today .n { background: var(--accent); color: var(--accent-ink) !important; border-radius: 50%; }
  .day .p { font-size: 9px; font-weight: 800; line-height: 1; padding: 2px 3px; border-radius: 4px; background: var(--c); color: #fff; max-width: 100%; overflow: hidden; }
  .day .p.dark-text { color: #1d1b19; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stats3 b { display: block; font-family: var(--font-num); font-size: 24px; font-variant-numeric: tabular-nums; }
  .stats3 span { font-size: 11px; color: var(--ink-2); }

  /* グラフ */
  .scroller { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .ex-chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; }
  .ex-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 7px 4px; font-size: 12px; border-radius: 8px; }
  .seg button[aria-pressed="true"] { background: var(--surface); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .stat2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat2 > div { background: var(--surface); border-radius: 14px; padding: 10px 12px; }
  .stat2 .v { font-family: var(--font-num); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 追加・読み取り */
  .drop { border: 2px dashed var(--line); border-radius: 16px; padding: 22px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--surface); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .photo { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: #000; }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  textarea.paste { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px; line-height: 1.6; background: var(--paper); color: var(--paper-ink); resize: vertical; }
  .source { background: var(--paper); color: var(--paper-ink); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; font-size: 13px; line-height: 1.7; max-height: 220px; overflow: auto; }

  /* 編集フォーム */
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .in { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 9px 8px; font-size: 16px; background: var(--bg); }
  .in.name { font-weight: 700; }
  .parts { display: flex; flex-wrap: wrap; gap: 4px; }
  .part-pick { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .part-pick[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .set-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 40px minmax(0, 1fr) 28px; gap: 6px; align-items: center; }
  .set-row .idx { color: var(--ink-3); font-size: 12px; text-align: center; }
  .unit { border: 0; background: var(--surface-2); border-radius: 8px; padding: 9px 0; font-weight: 700; font-size: 13px; }
  .x { border: 0; background: none; color: var(--ink-3); font-size: 16px; padding: 4px; }
  .x.del { color: var(--bad); }

  /* 詳細 */
  .ex-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ex-name { font-size: 16px; font-weight: 800; }
  .set-line { display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums; }
  .set-line span:last-child { color: var(--ink-3); font-size: 12px; }

  /* 計算タブ */
  .from { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .from button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; text-align: left; line-height: 1.35; }
  .from button b { display: block; font-size: 12px; }
  .from button span { font-family: var(--font-num); font-size: 15px; color: var(--ink-2); }
  .from button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 8px; }
  .stepper button { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; font-weight: 700; }
  .stepper label { display: flex; align-items: baseline; justify-content: center; gap: 4px; }
  .stepper input { width: 100%; min-width: 0; max-width: 150px; text-align: center; border: 0; border-bottom: 2px solid var(--line); background: transparent; font-family: var(--font-num); font-size: 40px; font-weight: 700; padding: 0; font-variant-numeric: tabular-nums; }
  .stepper input:focus { outline: none; border-bottom-color: var(--accent); }
  .stepper small { font-size: 16px; color: var(--ink-2); }
  .reps { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
  .reps button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 0; font-family: var(--font-num); font-size: 17px; font-weight: 600; }
  .reps button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .reps.target button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .flabel { font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .result { background: var(--ink); color: var(--bg); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .result .k { font-size: 12px; opacity: .8; }
  .result .big { font-family: var(--font-num); font-size: 60px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .result .big small { font-size: 20px; margin-left: 4px; opacity: .8; }
  .result .range { font-size: 12px; opacity: .85; }
  .result .rm1 { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--ink-2); padding-top: 8px; margin-top: 4px; font-size: 12px; }
  .result .rm1 b { font-family: var(--font-num); font-size: 19px; }
  .rm-wrap { overflow-x: auto; }
  table.rm { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.rm th { font-size: 11px; color: var(--ink-3); font-weight: 600; text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.rm th:first-child, table.rm td:first-child { text-align: left; }
  table.rm td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--grid); font-size: 13px; }
  table.rm td.w { font-family: var(--font-num); font-size: 18px; font-weight: 700; }
  table.rm td.r { color: var(--ink-3); font-size: 11px; }
  table.rm tr { cursor: pointer; }
  table.rm tr.target td { background: var(--accent-soft); }
  table.rm tr.target td.w { color: var(--accent); }
  table.rm .done-mark { font-size: 10px; color: var(--ink-3); margin-left: 4px; }
  select.step { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 6px; font-size: 12px; }
  .hint { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border: 0; border-radius: 12px; padding: 10px 12px; font-size: 13px; text-align: left; width: 100%; }
  .hint b { font-family: var(--font-num); font-size: 20px; color: var(--accent); }
  .hint .go { color: var(--accent); font-weight: 700; font-size: 12px; white-space: nowrap; }
  svg.chart .ref { stroke: var(--ink-3); stroke-dasharray: 4 3; }
  /* シェア画像 */
  .share-preview { display: flex; justify-content: center; background: var(--surface-2); border-radius: 14px; padding: 12px; }
  .share-preview img { width: 100%; max-width: 260px; height: auto; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.25); display: block; }
  .nav-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 12px; padding: 2px 4px; }
  .nav-row b { font-size: 14px; }
  /* AI 分析 */
  .chips-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips-wrap .chip { font-size: 12px; padding: 5px 11px; }
  .ai-sec h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .pill { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; letter-spacing: .03em; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .pill.next { background: var(--accent-soft); color: var(--accent); }
  .pill.sum { background: var(--surface-2); color: var(--ink-2); }
  .point { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--grid); }
  .point:first-of-type { border-top: 0; padding-top: 0; }
  .point p { margin: 0; font-size: 13px; line-height: 1.65; }
  .evidence { display: flex; flex-wrap: wrap; gap: 4px; }
  .evidence span { font-size: 11px; background: var(--surface-2); color: var(--ink-2); padding: 2px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .repbar { display: grid; grid-template-columns: 62px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; }
  .repbar .track { height: 16px; }

function stackedBars(weeks, series, refs = [], unit = "kg") {
  const W = 320, H = 170, L = 38, T = 8, B = H - 22, R = W - 4;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `週ごとの${unit === "kg" ? "総ボリューム" : "セット数"}の積み上げ棒グラフ` });
  const totals = weeks.map((w) => series.reduce((a, p) => a + w.byPart[p], 0));
  const top = Math.max(...totals, ...refs, 1);
  const step = niceStep(top);
  const max = Math.ceil(top / step) * step;
  for (let v = 0; v <= max + 1e-9; v += step) {
    const y = B - (v / max) * (B - T);
    s("line", { x1: L, x2: R, y1: y, y2: y, class: v ? "grid" : "axis" }, svg);
    s("text", { x: L - 4, y: y + 3, "text-anchor": "end" }, svg).textContent = axisLabel(v);
  }
  for (const v of refs) s("line", { x1: L, x2: R, y1: B - (v / max) * (B - T), y2: B - (v / max) * (B - T), class: "ref" }, svg);
  const bw = (R - L) / weeks.length, barW = bw - 10;
  weeks.forEach((wk, i) => {
    const x = L + i * bw + 5;
    const g = s("g", { opacity: S.selWeek != null && S.selWeek !== i ? 0.35 : wk.partial ? 0.55 : 1 }, svg);
    let y = B;
    const segs = series.filter((p) => wk.byPart[p] > 0);
    segs.forEach((p, si) => {
      const hgt = (wk.byPart[p] / max) * (B - T), gap = si ? 2 : 0, hh = Math.max(1, hgt - gap), top = y - hgt, r = si === segs.length - 1 ? Math.min(4, hh) : 0;
      s("path", { d: `M${x},${top + hh} V${top + r} Q${x},${top} ${x + r},${top} H${x + barW - r} Q${x + barW},${top} ${x + barW},${top + r} V${top + hh} Z`, style: `fill:${partColor(p === "other" ? null : p)}` }, g);
      y -= hgt;
    });
    s("text", { x: x + barW / 2, y: B + 14, "text-anchor": "middle" }, svg).textContent = WN.shortDate(wk.start);
    const hit = s("rect", { x: L + i * bw, y: T, width: bw, height: B - T + 16, fill: "transparent", tabindex: "0", role: "button", "aria-label": `${WN.shortDate(wk.start)}の週 ${WN.formatKg(totals[i])}${unit}` }, svg);
    const pick = () => { S.selWeek = S.selWeek === i ? null : i; render(); };
    hit.addEventListener("click", pick);
    hit.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  return svg;
}

// ===== 調子の分析 =====
// 調子 = その日の推定1RM ÷ 直前8週間のその種目のベスト（%）。100% なら直近のベスト並み
const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const scoredOf = (list) => list.filter((x) => x.form != null);
let formCache = null;

// 2セット目以降の落ち込み（%）：トップの重量の9割以上で行ったセットの推定1RM で、最初の2セットのよい方から、その後のいちばん低いセットまでの下がり幅
function dropOf(ex) {
  const ss = ex.sets.filter((x) => x.weight != null && x.reps > 0 && x.note !== "W").map((x) => ({ w: x.unit === "lb" ? x.weight * 0.4536 : x.weight, r: x.reps }));
  if (ss.length < 2) return null;
  const top = Math.max(...ss.map((x) => x.w));
  const work = ss.filter((x) => x.w >= top * 0.9).map((x) => WN.estimate1RM(x.w, x.r));
  if (work.length < 2) return null;
  const head = Math.max(work[0], work[1]), tail = work.length > 2 ? Math.min(...work.slice(2)) : work[1];

function todayAdvice() {

    const ratio = chronic ? acute7 / chronic : null;

    // ほかの★種目・部位の日が、この部位の★種目に悪く影響していないか（影響の分析の結果）

    else Object.assign(r, { kind: "ok", label: "判断材料なし", text: `最後は${since === 1 ? "昨日" : `${since}日前`}・直近7日で${acute7}セット。★種目の記録がまだ少なく、今日の調子の見込みはわかりません` });

function partChart(weeks, series, lift) {
  const W = 320, H = 210, L = 36, T = 12, B = H - 22, R = lift ? W - 34 : W - 6;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "部位ごとの週の量の推移" });
  const tot = weeks.map((w) => series.reduce((a, p) => a + w.byPart[p], 0));
  const refs = S.pMeasure !== "kg" && S.part !== "all" ? [10, 20] : [];
  const top = Math.max(...tot, ...refs, 1), step = niceStep(top), max = Math.ceil(top / step) * step;
  const Y = (v) => B - (v / max) * (B - T);
  for (let v = 0; v <= max + 1e-9; v += step) {
    s("line", { x1: L, x2: R, y1: Y(v), y2: Y(v), class: v ? "grid" : "axis" }, svg);
    s("text", { x: L - 4, y: Y(v) + 3, "text-anchor": "end" }, svg).textContent = axisLabel(v);
  }
  for (const v of refs) s("line", { x1: L, x2: R, y1: Y(v), y2: Y(v), class: "ref" }, svg);
  const bw = (R - L) / weeks.length, barW = Math.max(2, bw * 0.72), cx = (i) => L + i * bw + bw / 2;
  weeks.forEach((wk, i) => {
    const x = cx(i) - barW / 2, g = s("g", { opacity: S.pSel != null && S.pSel !== i ? 0.35 : wk.partial ? 0.5 : 1 }, svg);
    let y = B;
    for (const p of series) {
      const v = wk.byPart[p]; if (!v) continue;
      const hh = (v / max) * (B - T);
      s("rect", { x, y: y - hh, width: barW, height: Math.max(0.5, hh - (y < B ? 1 : 0)), rx: Math.min(2, barW / 3), style: `fill:${partColor(p === "other" ? null : p)}` }, g);
      y -= hh;
    }
  });
  // 4週の移動平均（今週の途中は入れない）
  const ma = tot.map((_, i) => (i < 3 || weeks[i].partial ? null : (tot[i] + tot[i - 1] + tot[i - 2] + tot[i - 3]) / 4));
  const maPath = ma.map((v, i) => (v == null ? "" : `${ma[i - 1] != null ? "L" : "M"}${cx(i).toFixed(1)},${Y(v).toFixed(1)}`)).join(" ");
  if (maPath.trim()) s("path", { d: maPath, style: "fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-dasharray:5 3" }, svg);
  // 重ねる種目の推定1RM（右の目盛り）
  if (lift) {
    const pts = weeks.map((w, i) => [i, w.lift]).filter(([, v]) => v != null);
    if (pts.length) {
      let lo = Math.min(...pts.map((p) => p[1])), hi = Math.max(...pts.map((p) => p[1]));
      const pad = (hi - lo) * 0.15 || 2.5; lo -= pad; hi += pad;
      const st = niceStep(hi - lo, 3); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
      const Y2 = (v) => B - ((v - lo) / (hi - lo)) * (B - T);
      for (let v = lo; v <= hi + 1e-9; v += st) s("text", { x: R + 4, y: Y2(v) + 3, "text-anchor": "start", style: "fill:var(--ink)" }, svg).textContent = axisLabel(v);
      s("path", { d: pts.map(([i, v], j) => `${j ? "L" : "M"}${cx(i).toFixed(1)},${Y2(v).toFixed(1)}`).join(" "), style: "fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round" }, svg);
      for (const [i, v] of pts) s("circle", { cx: cx(i), cy: Y2(v), r: i === S.pSel ? 4.5 : 2.6, style: "fill:var(--ink);stroke:var(--surface);stroke-width:1.5" }, svg);
    }
  }
  const every = Math.ceil(weeks.length / 5);
  weeks.forEach((w, i) => { if ((weeks.length - 1 - i) % every === 0) s("text", { x: cx(i), y: B + 14, "text-anchor": "middle" }, svg).textContent = WN.shortDate(w.start); });
  const hit = s("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }, svg);
  const pick = (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(weeks.length - 1, Math.floor((px - L) / bw)));
    if (i !== S.pSel) { S.pSel = i; render(); }
  };
  hit.addEventListener("pointerdown", pick);
  hit.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "mouse") pick(e); });
  return svg;
}

// 4週ずつ区切って、種目が伸びた時期と伸びなかった時期の練習量を比べる
function liftBlocksCard(weeks, lift, where, isKg) {
  const full = weeks.filter((w) => !w.partial), blocks = [];
  for (let end = full.length; end - 4 >= 0; end -= 4) blocks.unshift(full.slice(end - 4, end));
  const bestOf = (b) => { const v = b.map((w) => w.lift).filter((x) => x != null); return v.length ? Math.max(...v) : null; };
  const rows = blocks.map((b, i) => {
    const best = bestOf(b), prev = i ? bestOf(blocks[i - 1]) : null;
    const change = best != null && prev != null ? best - prev : null;
    return { start: b[0].start, amount: b.reduce((a, w) => a + (isKg ? w.kg : w.sets), 0) / 4, days: b.reduce((a, w) => a + w.days.size, 0) / 4, best, change,
      cls: change == null ? "" : change >= 1 ? "up" : change <= -1 ? "down" : "flat" };
  });
  while (rows.length && !rows[0].amount && rows[0].best == null) rows.shift(); // 記録が始まる前の期間は出さない
  const unit = isKg ? "kg" : "セット";
  const fmtA = (v) => (isKg ? WN.formatKg(v) : (Math.round(v * 10) / 10).toFixed(1));

  const rated = rows.filter((r) => r.cls), up = rated.filter((r) => r.cls === "up"), other = rated.filter((r) => r.cls !== "up");

  if (up.length && other.length) {
    card.append(h("div", { class: "compare" },
      h("div", { class: "up" }, h("div", { class: "muted" }, `伸びた4週（${up.length}回）`), h("div", { class: "v" }, fmtA(avg(up, "amount")), h("small", { style: "font-size:12px;margin-left:2px" }, `${unit}/週`)), h("div", { class: "muted" }, `週 ${avg(up, "days").toFixed(1)} 日`)),
      h("div", {}, h("div", { class: "muted" }, `伸びなかった4週（${other.length}回）`), h("div", { class: "v" }, fmtA(avg(other, "amount")), h("small", { style: "font-size:12px;margin-left:2px" }, `${unit}/週`)), h("div", { class: "muted" }, `週 ${avg(other, "days").toFixed(1)} 日`))));
  } else {
    card.append(h("div", { class: "muted" }, rated.length ? "伸びた時期と伸びなかった時期の両方がそろうと、ここで量を比べられます。期間を長くしてみてください。" : `${lift}の記録が4週ごとにそろうと、ここで比べられます。期間を長くしてみてください。`));
  }
  if (rows.length) {
    card.append(h("div", { class: "rm-wrap" }, h("table", { class: "rm blk" },
      h("thead", {}, h("tr", {}, h("th", {}, "4週"), h("th", {}, `${unit}/週`), h("th", {}, "日/週"), h("th", {}, "1RM"), h("th", {}, "前の4週比"))),
      h("tbody", {}, rows.slice().reverse().map((r) => h("tr", { class: r.cls === "up" ? "up" : "" },
        h("td", {}, `${WN.shortDate(r.start)}〜`),
        h("td", { class: "num", style: "font-size:15px" }, fmtA(r.amount)),
        h("td", {}, r.days.toFixed(1)),
        h("td", {}, r.best != null ? WN.round1(r.best) : "—"),
        h("td", { class: r.cls }, r.change == null ? "—" : Math.abs(r.change) < 0.05 ? "±0kg" : `${r.change > 0 ? "+" : ""}${WN.round1(r.change)}kg`)))))));
  }
  card.append(h("div", { class: "muted" }, `各4週の${lift}のベスト推定1RMを、ひとつ前の4週と比べています（+1kg 以上を「伸びた」）。記録が少ないと偶然の差も出るので、目安として見てください。`));
  return card;
}

function lineChart(ses, val) {
  const W = 320, H = 200, L = 40, T = 18, B = H - 22, R = W - 10;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${S.graphEx}の推移` });
  const part = ses.at(-1).exercise.part, color = partColor(part);
  const ys = ses.map(val);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo) * 0.15 || Math.max(hi * 0.1, 1);
  lo = Math.max(0, lo - pad); hi += pad;
  const step = niceStep(hi - lo); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const first = ses[0].date, span = Math.max(1, WN.daysBetween(first, ses.at(-1).date));
  const X = (d) => L + (WN.daysBetween(first, d) / span) * (R - L);
  const Y = (v) => B - ((v - lo) / (hi - lo)) * (B - T);
  for (let v = lo; v <= hi + 1e-9; v += step) {
    s("line", { x1: L, x2: R, y1: Y(v), y2: Y(v), class: v === lo ? "axis" : "grid" }, svg);
    s("text", { x: L - 4, y: Y(v) + 3, "text-anchor": "end" }, svg).textContent = axisLabel(v);
  }
  const ticks = span < 3 ? [0] : [0, Math.round(span / 3), Math.round((span * 2) / 3), span];
  ticks.forEach((t, i) => {
    s("text", { x: L + (t / span) * (R - L), y: B + 15, "text-anchor": ticks.length > 1 && i === ticks.length - 1 ? "end" : i === 0 && ticks.length > 1 ? "start" : "middle" }, svg).textContent = WN.shortDate(WN.addDays(first, t));
  });
  const sel = S.selPoint;
  if (sel != null) s("line", { x1: X(ses[sel].date), x2: X(ses[sel].date), y1: T, y2: B, class: "axis", "stroke-dasharray": "3 3" }, svg);
  s("path", { d: ses.map((x, i) => `${i ? "L" : "M"}${X(x.date).toFixed(1)},${Y(val(x)).toFixed(1)}`).join(" "), style: `fill:none;stroke:${color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round` }, svg);
  const bestI = ys.indexOf(Math.max(...ys));
  ses.forEach((x, i) => s("circle", { cx: X(x.date), cy: Y(val(x)), r: i === sel ? 6 : i === bestI ? 4.5 : 3, style: `fill:${color};stroke:var(--surface);stroke-width:2` }, svg));
  if (sel == null) {
    s("text", { x: Math.min(Math.max(X(ses[bestI].date), L + 30), R - 30), y: Y(ys[bestI]) - 9, "text-anchor": "middle", class: "label-strong" }, svg).textContent = `ベスト ${WN.round1(ys[bestI])}`;
  }
  const hit = s("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }, svg);
  const pick = (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    let best = 0;
    ses.forEach((x, i) => { if (Math.abs(X(x.date) - px) < Math.abs(X(ses[best].date) - px)) best = i; });
    if (best !== S.selPoint) { S.selPoint = best; render(); }
  };
  hit.addEventListener("pointerdown", pick);
  hit.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "mouse") pick(e); });
  return svg;
}

// ===== 計算タブ =====
const CALC_REPS = [1, 3, 5, 6, 8, 10, 12, 15];
const TABLE_REPS = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15];
const fmtW = (v) => String(Math.round(v * 100) / 100);
function calcStep() {
  try { const v = Number(localStorage.getItem("calcStep")); if ([2.5, 2, 1.25, 1].includes(v)) return v; } catch {}
  return 2.5;
}
// 種目ごとに、直近の回で推定1RM が一番高いセット（新しい順）
function calcSources() {
  const out = [];
  for (const name of WN.exerciseNames(S.workouts, "all").slice(0, 15)) {
    const last = WN.exerciseSessions(S.workouts, name).at(-1);
    const b = last && WN.bestSet(last.exercise);
    if (b) out.push({ name, date: last.date, weight: b.weight, reps: b.reps });
  }
  return out.sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
}
function ensureCalc() {
  if (S.calc) return;
  const src = calcSources()[0];
  S.calc = { w: src?.weight ?? 60, r: src?.reps ?? 10, n: 10, from: src?.name ?? null };
  if (S.calc.n === S.calc.r) S.calc.n = 5;
}
function openCalcWith(name, weight, reps, target) {
  S.calc = { w: weight, r: reps, n: target ?? S.calc?.n ?? 10, from: name };
  go("calc");
}
const withExtra = (list, ...extra) => [...new Set([...list, ...extra])].sort((a, b) => a - b);

function renderCalc(view) {
  ensureCalc();
  const C = S.calc;
  const sources = calcSources();
  if (sources.length) {
    view.append(h("div", { class: "card" },
      h("div", { class: "card-head" }, h("h2", { class: "card-title" }, "記録から入れる"), h("span", { class: "muted" }, "前回のベストセット")),
      h("div", { class: "from" }, sources.map((x) => h("button", { type: "button", "aria-pressed": String(C.from === x.name && C.w === x.weight && C.r === x.reps),
        onclick: () => { Object.assign(C, { w: x.weight, r: x.reps, from: x.name }); if (C.n === C.r) C.n = C.r === 10 ? 5 : 10; render(); } },
        h("b", {}, x.name), h("span", {}, `${fmtW(x.weight)}kg×${x.reps}`))))));
  }

  const input = h("input", { id: "calc-weight", type: "text", inputmode: "decimal", "aria-label": "できた重量（kg）", autocomplete: "off" });
  input.value = fmtW(C.w);
  input.addEventListener("input", () => {
    const v = Number(input.value.replace(",", "."));
    if (input.value.trim() && isFinite(v) && v > 0 && v < 1000) { C.w = v; C.from = null; updateCalc(); }
  });
  input.addEventListener("focus", () => input.select());
  const stepBy = (d) => { C.w = Math.max(0, WN.roundToStep(C.w + d * calcStep(), calcStep())); C.from = null; input.value = fmtW(C.w); updateCalc(); };
  const repButtons = (key, list, cls) => h("div", { class: "reps" + (cls ? " " + cls : ""), role: "group" }, list.map((n) =>
    h("button", { type: "button", "aria-pressed": String(C[key] === n), onclick: () => { C[key] = n; if (key === "r") C.from = null; render(); } }, n)));
  view.append(h("div", { class: "card" },
    h("div", { class: "flabel" }, "できた重量"),
    h("div", { class: "stepper" },
      h("button", { type: "button", "aria-label": "重量を減らす", onclick: () => stepBy(-1) }, "−"),
      h("label", { for: "calc-weight" }, input, h("small", {}, "kg")),
      h("button", { type: "button", "aria-label": "重量を増やす", onclick: () => stepBy(1) }, "＋")),
    h("div", { class: "flabel" }, "回数"), repButtons("r", withExtra(CALC_REPS, C.r))));
  view.append(h("div", { class: "card" }, h("div", { class: "flabel" }, "狙う回数"), repButtons("n", withExtra(CALC_REPS, C.n), "target")));

  view.append(h("div", { class: "result", id: "calc-result", "aria-live": "polite" }));
  view.append(h("div", { class: "warn", id: "calc-warn", hidden: true }, "12回を超える回数は、推定のずれが大きくなります。軽めから試してください。"));

  const stepSel = h("select", { class: "step", id: "calc-step", "aria-label": "重量の刻み" }, [2.5, 2, 1.25, 1].map((v) => h("option", { value: String(v) }, `${v}kg`)));
  stepSel.value = String(calcStep());
  stepSel.addEventListener("change", () => { try { localStorage.setItem("calcStep", stepSel.value); } catch {} updateCalc(); });
  view.append(h("div", { class: "card" },
    h("div", { class: "card-head" }, h("h2", { class: "card-title" }, "RM 換算表"), h("label", { class: "muted" }, "刻み ", stepSel)),
    h("div", { class: "rm-wrap" }, h("table", { class: "rm" },
      h("thead", {}, h("tr", {}, h("th", {}, "回数"), h("th", {}, "重量"), h("th", {}, "幅"), h("th", {}, "1RM比"))),
      h("tbody", { id: "calc-table" }))),
    h("div", { class: "muted" }, "行をタップすると「狙う回数」になります。どの式も目安です。同じ日の続きのセットでは疲れが残るので、少し軽めから始めてください。")));
  updateCalc();
}

// 入力欄のフォーカスを保つため、結果と表だけを書き換える
function updateCalc() {
  const C = S.calc, step = calcStep();
  const est = WN.estimateForReps(C.w, C.r, C.n, step);
  const res = document.getElementById("calc-result");
  if (!res) return;
  res.replaceChildren(
    h("div", { class: "k" }, `${fmtW(C.w)}kg × ${C.r}回 ができたなら、${C.n}回を狙うのは`),
    h("div", { class: "big" }, fmtW(est.weight), h("small", {}, "kg")),
    h("div", { class: "range" }, est.low === est.high ? `2つの式とも ${fmtW(est.low)}kg` : `計算上は ${fmtW(est.low)}〜${fmtW(est.high)}kg（Epley 式と Brzycki 式の幅）`),
    h("div", { class: "rm1" }, h("span", {}, "推定1RM"), h("b", {}, `${WN.round1(est.oneRM)}kg`)));
  document.getElementById("calc-warn").hidden = !WN.isLowAccuracy(C.r, C.n);
  document.getElementById("calc-table").replaceChildren(...withExtra(TABLE_REPS, C.r, C.n).map((n) => {
    const e = WN.estimateForReps(C.w, C.r, n, step);
    const tr = h("tr", { class: n === C.n ? "target" : "", tabindex: "0", "aria-label": `${n}回 ${fmtW(e.weight)}kg` },
      h("td", {}, `${n}回`, n === C.r ? h("span", { class: "done-mark" }, "できた") : null),

      h("td", { class: "r" }, `${Math.round(e.percent)}%`));
    const choose = () => { C.n = n; render(); };
    tr.addEventListener("click", choose);
    tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); choose(); } });
    return tr;
  }));
}

    [["post", "投稿 4:5"], ["story", "ストーリーズ 9:16"]].map(([k, l]) => h("button", { type: "button", "aria-pressed": String(X.size === k), onclick: () => { X.size = k; render(); } }, l))));

  // 対象の日・週・月を前後に動かす
  const dates = [...new Set(S.workouts.map((w) => w.date))].filter((d) => d <= today()).sort();
  let label, prev, next;
  if (X.kind === "day") {
    label = WN.formatDateJa(X.date);
    prev = dates.filter((d) => d < X.date).at(-1); next = dates.find((d) => d > X.date);
  } else if (X.kind === "week") {
    const st = WN.weekStart(X.date);
    label = `${WN.shortDate(st)}〜${WN.shortDate(WN.addDays(st, 6))} の週`;
    prev = WN.addDays(st, -7); next = WN.addDays(st, 7) <= today() ? WN.addDays(st, 7) : null;
  } else {
    const [y, m] = X.month.split("-").map(Number);
    label = `${y}年${m}月`;
    prev = WN.shiftMonth(X.month, -1); next = X.month < today().slice(0, 7) ? WN.shiftMonth(X.month, 1) : null;
  }
  const move = (v) => { if (!v) return; if (X.kind === "month") X.month = v; else X.date = v; render(); };
  view.append(h("div", { class: "nav-row" },
    h("button", { class: "icon-btn", type: "button", "aria-label": "前へ", disabled: !prev, style: prev ? "" : "opacity:.3", onclick: () => move(prev) }, "‹"),
    h("b", {}, label),
    h("button", { class: "icon-btn", type: "button", "aria-label": "次へ", disabled: !next, style: next ? "" : "opacity:.3", onclick: () => move(next) }, "›")));

  const hasData = X.kind === "day" ? S.workouts.some((w) => w.date === X.date)
    : X.kind === "week" ? S.workouts.some((w) => w.date >= WN.weekStart(X.date) && w.date < WN.addDays(WN.weekStart(X.date), 7))
    : S.workouts.some((w) => WN.monthKey(w.date) === X.month);
  if (!hasData) { view.append(h("div", { class: "card empty" }, h("p", { class: "sub", style: "margin:0" }, "この期間の記録がありません。"))); return; }

  const box = h("div", { class: "share-preview" }, h("div", { class: "spinner", role: "img", "aria-label": "画像を作っています" }));
  view.append(box);

  view.append(saveBtn);
  view.append(h("div", { class: "muted", style: "line-height:1.7" },
    S.downloads ? "保存した画像は「ファイル」アプリで開き、共有 → Instagram（または「画像を保存」で写真アプリへ）で投稿できます。" : "",
    "上の画像を長押しして保存できる場合もあります。"));

  const canvas = document.createElement("canvas");
  drawShareImage(canvas, X).then(() => {
    if (S.view !== "share" || S.share !== X) return;
    const img = h("img", { src: canvas.toDataURL("image/png"), alt: `${label}のシェア画像` });
    box.replaceChildren(img);
    saveBtn.disabled = !S.downloads;
    saveBtn.onclick = () => canvas.toBlob(async (blob) => {
      const key = X.kind === "month" ? X.month : X.kind === "week" ? WN.weekStart(X.date) : X.date;
      try { await S.downloads.save({ filename: `workout-${X.kind}-${key}-${X.size}.png`, data: blob }); toast("保存しました"); }
      catch (e) { if (e?.code !== "declined" && e?.code !== "cancelled") toast("保存できませんでした"); }
    }, "image/png");
  });
}

function rrect(ctx, x, y, w, hh, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, hh, r); return; }
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ctext(ctx, str, x, y, font, color, align = "left", maxW) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align;
  let t = String(str);
  if (maxW && ctx.measureText(t).width > maxW) { while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1); t += "…"; }
  ctx.fillText(t, x, y);
}
function shareHeader(ctx, kicker, title, size, top) {
  ctext(ctx, kicker, 72, top + 40, `700 40px ${SNUM}`, SC.accent);
  ctext(ctx, title, 72, top + 50 + size * 0.82, `800 ${size}px ${SNUM}`, SC.ink);
  return top + 50 + size + 10;
}
function shareHero(ctx, y, value, unit, sub, subColor, size) {
  ctext(ctx, "TOTAL VOLUME", 72, y + 32, `700 32px ${SNUM}`, SC.ink3);
  const base = y + 40 + size * 0.78;
  const v = WN.formatKg(value);
  ctext(ctx, v, 64, base, `800 ${size}px ${SNUM}`, SC.ink);
  ctext(ctx, unit, 72 + ctx.measureText(v).width + 12, base, `700 ${Math.round(size / 3)}px ${SNUM}`, SC.ink2);
  ctext(ctx, sub, 72, base + 62, `700 34px ${SJP}`, subColor, "left", 936);
  return base + 100;
}
function sharePartTag(ctx, p, x, y) {
  const label = partLabel(p);
  ctx.font = `700 30px ${SJP}`;
  const w = ctx.measureText(label).width + 60;
  rrect(ctx, x, y, w, 52, 26); ctx.fillStyle = SC.bg2; ctx.fill();
  ctx.beginPath(); ctx.arc(x + 26, y + 26, 9, 0, Math.PI * 2); ctx.fillStyle = SHARE_PART[p]; ctx.fill();
  ctext(ctx, label, x + 44, y + 37, `700 30px ${SJP}`, SC.ink);
  return w;
}
const deltaText = (pct, prefix) => (pct == null ? "" : `${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct)}%  ${prefix}　`);

async function drawShareImage(canvas, X) {
  try { await Promise.all([document.fonts.load(`800 100px ${SNUM}`), document.fonts.load(`700 40px ${SNUM}`)]); } catch {}
  const W = 1080, H = X.size === "post" ? 1350 : 1920;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = SC.bg; ctx.fillRect(0, 0, W, H);
  // ストーリーズは上下に Instagram の表示がかぶるので、中央の安全な範囲に置く
  const top = X.size === "post" ? 90 : 300, bottom = X.size === "post" ? H - 70 : H - 280;
  ctx.fillStyle = SC.accent; ctx.beginPath(); ctx.moveTo(W - 300, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 300); ctx.closePath(); ctx.fill();

  if (X.kind === "day") {
    const d = WN.dayShare(S.workouts, X.date), dt = WN.parseDate(X.date);

    let x = 72; for (const p of d.parts) x += sharePartTag(ctx, p, x, y) + 14;
    y = shareHero(ctx, y + (d.parts.length ? 100 : 30), d.volume, "kg", `${d.exercises.length} 種目　${d.sets} セット　${d.reps} 回`, SC.ink2, 200);
    const maxRows = Math.max(1, Math.floor((bottom - 70 - y) / 84));
    const rows = d.exercises.length > maxRows ? [...d.exercises.slice(0, maxRows - 1), { more: d.exercises.length - maxRows + 1 }] : d.exercises;
    const rh = Math.min(110, (bottom - 70 - y) / Math.max(rows.length, 1));
    rows.forEach((e, i) => {
      const ry = y + i * rh;
      ctx.fillStyle = SC.line; ctx.fillRect(72, ry, W - 144, 2);

      ctx.fillStyle = e.part ? SHARE_PART[e.part] : SC.ink3; ctx.fillRect(72, ry + rh * .28, 8, rh * .44);
      ctext(ctx, e.name, 100, ry + rh * .62, `700 38px ${SJP}`, SC.ink, "left", W - 100 - 380);
      const best = e.best ? `${fmtW(e.best.weight)}×${e.best.reps}` : "—";
      ctext(ctx, best, W - 200, ry + rh * .66, `700 52px ${SNUM}`, SC.ink, "right");
      ctext(ctx, `${e.sets} sets`, W - 72, ry + rh * .64, `600 32px ${SNUM}`, SC.ink3, "right");
    });
  } else if (X.kind === "week") {
    const wk = WN.weekShare(S.workouts, X.date);
    let y = shareHeader(ctx, "WEEKLY SUMMARY", `${WN.shortDate(wk.start).replace("/", ".")} – ${WN.shortDate(wk.end).replace("/", ".")}`, 110, top) + 10;
    const cw = (W - 144 - 6 * 12) / 7;
    wk.days.forEach((d, i) => {
      const x = 72 + i * (cw + 12), on = d.parts.length > 0;
      rrect(ctx, x, y, cw, 120, 18); ctx.fillStyle = on ? SC.bg2 : SC.bg; ctx.fill(); ctx.strokeStyle = SC.line; ctx.lineWidth = 2; ctx.stroke();
      ctext(ctx, EN_DAY[(i + 1) % 7], x + cw / 2, y + 42, `700 30px ${SNUM}`, on ? SC.ink : SC.ink3, "center");
      d.parts.forEach((p, j) => { ctx.beginPath(); ctx.arc(x + cw / 2 + (j - (d.parts.length - 1) / 2) * 26, y + 84, 11, 0, Math.PI * 2); ctx.fillStyle = SHARE_PART[p]; ctx.fill(); });
    });
    y = shareHero(ctx, y + 160, wk.volume, "kg", `${deltaText(wk.deltaPct, "前週比")}${wk.daysTrained}日・${wk.sets}セット`, wk.deltaPct == null ? SC.ink2 : SC.accent, 170);
    const pr = wk.prs[0];
    const prH = pr ? 110 : 0;
    const parts = WN.BODY_PARTS.filter((p) => wk.byPart[p] > 0).sort((a, b) => wk.byPart[b] - wk.byPart[a]);
    const maxV = Math.max(...parts.map((p) => wk.byPart[p]), 1);
    const bh = Math.min(72, (bottom - 70 - prH - 30 - y) / Math.max(parts.length, 1));
    parts.forEach((p, i) => {
      const by = y + i * bh;
      ctext(ctx, partLabel(p), 72, by + bh * .64, `700 32px ${SJP}`, SC.ink2);
      rrect(ctx, 200, by + bh * .22, Math.max(8, (W - 200 - 260) * wk.byPart[p] / maxV), bh * .52, 8); ctx.fillStyle = SHARE_PART[p]; ctx.fill();
      ctext(ctx, WN.formatKg(wk.byPart[p]), W - 72, by + bh * .68, `700 40px ${SNUM}`, SC.ink, "right");
    });
    if (pr) {
      const yP = bottom - 70 - prH;
      rrect(ctx, 72, yP, W - 144, prH - 14, 20); ctx.fillStyle = SC.bg2; ctx.fill();
      ctext(ctx, "NEW PR", 104, yP + 60, `800 36px ${SNUM}`, SC.accent);
      ctext(ctx, `${pr.name} 推定1RM ${WN.round1(pr.e1rm)}kg`, 250, yP + 60, `700 36px ${SJP}`, SC.ink, "left", W - 250 - 100);
    }
  } else {
    const mo = WN.monthShare(S.workouts, X.month, today());

    let y = shareHeader(ctx, "MONTHLY SUMMARY", `${EN_MONTH[mm - 1]} ${yy}`, 110, top) + 10;
    const cw = (W - 144) / 7, ch = 64;
    ["M", "T", "W", "T", "F", "S", "S"].forEach((d, i) => ctext(ctx, d, 72 + cw * i + cw / 2, y + 28, `700 28px ${SNUM}`, SC.ink3, "center"));
    const first = (new Date(yy, mm - 1, 1).getDay() + 6) % 7; // 月曜始まり
    const nDays = WN.daysInMonth(X.month), rows = Math.ceil((first + nDays) / 7);
    for (let d = 1; d <= nDays; d++) {
      const i = first + d - 1, x = 72 + cw * (i % 7), cy = y + 44 + ch * Math.floor(i / 7);
      const ps = mo.days[`${X.month}-${String(d).padStart(2, "0")}`];
      if (ps) { rrect(ctx, x + 6, cy, cw - 12, ch - 8, 14); ctx.fillStyle = SC.bg2; ctx.fill(); }
      ctext(ctx, String(d), x + cw / 2, cy + 30, `700 28px ${SNUM}`, ps ? SC.ink : SC.ink3, "center");
      (ps || []).forEach((p, j) => { ctx.beginPath(); ctx.arc(x + cw / 2 + (j - (ps.length - 1) / 2) * 18, cy + 45, 6.5, 0, Math.PI * 2); ctx.fillStyle = SHARE_PART[p]; ctx.fill(); });
    }
    y = shareHero(ctx, y + 44 + ch * rows + 24, mo.volume, "kg", `${deltaText(mo.deltaPct, "前月比")}${mo.daysTrained}日・${mo.sets}セット`, mo.deltaPct == null ? SC.ink2 : SC.accent, 150);
    if (mo.lifts.length) {
      ctext(ctx, "推定1RM の伸び", 72, y + 10, `700 30px ${SJP}`, SC.ink3);
      const lTop = y + 30, lh = Math.min(90, (bottom - 70 - lTop) / mo.lifts.length);
      mo.lifts.forEach((l, i) => {
        const ly = lTop + i * lh, diff = WN.round1(l.to - l.from);
        ctx.fillStyle = SC.line; ctx.fillRect(72, ly, W - 144, 2);
        ctext(ctx, l.name, 72, ly + lh * .66, `700 36px ${SJP}`, SC.ink, "left", 420);
        ctext(ctx, `${WN.round1(l.from)} → ${WN.round1(l.to)}`, W - 240, ly + lh * .68, `700 44px ${SNUM}`, SC.ink2, "right");
        ctext(ctx, `${diff >= 0 ? "+" : ""}${diff}kg`, W - 72, ly + lh * .68, `800 44px ${SNUM}`, diff >= 0 ? SC.accent : SC.ink3, "right");
      });
    }
  }
  ctext(ctx, "筋トレノート", 72, bottom, `700 30px ${SJP}`, SC.ink3);
  ctext(ctx, "WORKOUT NOTE", W - 72, bottom, `700 30px ${SNUM}`, SC.ink3, "right");
}

// ===== AI 分析 =====
const AI_PROMPT = (lens, data) => `あなたは経験豊富なストレングスコーチです。以下は、ある人の筋トレ記録をアプリで正確に集計したデータ（JSON）です。
${lens === "short"
  ? "視点：短期（週単位）。直近の数週間で、何がうまくハマっていて何が足りないかを見てください。週ごとのセット数・頻度・間隔・回数の組み方と、推定1RM の伸びの関係に注目してください。"
  : "視点：長期（月・年単位）。伸び方の傾向、伸びた時期と停滞した時期のパターン（季節や、ボリュームを増やした・減らした時期との関係）、前の年の同じ時期との比較、部位バランスの長期的な偏りに注目してください。months の beforePeriod: true は比較用の過去の月です。"}

データの見方:
- e1RM / E1RM は推定1RM（kg、Epley 式と Brzycki 式の平均）。
- repStrength.ratio は「その回数帯のベストセットの推定1RM ÷ 期間内の推定1RM の最高値 × 100」。低い回数帯の値が低ければ、その回数帯が弱いことを示す。sets はその回数帯のセット数。
- averageIntervalDaysByPart は、その部位を行った日の平均間隔（日）。
- firstHalfChangeKg / secondHalfChangeKg は、期間の前半・後半それぞれの推定1RM の変化。
- condition は練習日の体重（kg）・睡眠時間・コンディションスコア（1〜5）の期間ごとの平均。memos はノートのメモ（体調の気づき・事前記録・次回の予定など）。調子の波や停滞の振り返りに使ってよい。

ルール:
- データにある数字だけを根拠にし、数字を作らない。
- 各項目に evidence として根拠の数字を短く1〜2個付ける（例：「直近4週 +0.5kg」「4〜6回：91%」）。
- 痛み・けが・体調の判断はしない。
- 記録が少なく判断できないときは、そう書く。
- 日本語で、短く具体的に。text は各1〜2文。
- 次の形の JSON だけを返す：
{"summary": "全体のまとめを2〜3文", "good": [{"text": "...", "evidence": ["..."]}], "issues": [{"text": "...", "evidence": ["..."]}], "next": [{"text": "...", "evidence": ["..."]}]}
good・issues・next はそれぞれ1〜3件。

データ:
${JSON.stringify(data)}`;

function hashKey(str) { let x = 5381; for (const c of str) x = ((x << 5) + x + c.codePointAt(0)) >>> 0; return x.toString(36); }
const aiKey = (A) => `${A.lens}-${A.scope === "all" ? "all" : "ex-" + hashKey(A.scope)}-${A.period}`;
const aiDoc = (A) => S.db.doc(`data/users/${S.uid}/meta`).collection("analyses").doc(aiKey(A));

function openAI(opts = {}) {
  const lens = opts.lens || S.ai?.lens || "short";
  S.ai = { lens, scope: opts.scope || "all", period: WN.DEFAULT_PERIOD[lens], cache: S.ai?.cache || {}, loading: false, error: null, ctl: null };
  go("ai");
  loadSavedAI();
}
async function loadSavedAI() {
  const A = S.ai, key = aiKey(A);
  if (!S.db || key in A.cache) return;
  try {
    const snap = await aiDoc(A).get();
    A.cache[key] = snap.exists ? snap.data() : null;
    if (S.view === "ai" && S.ai === A && aiKey(A) === key) render();
  } catch { A.cache[key] = null; }
}
function sanitizeAI(raw) {
  const str = (v) => (typeof v === "string" && v.trim() ? v.trim().slice(0, 600) : null);
  const list = (v) => (Array.isArray(v) ? v : []).slice(0, 4).map((x) => ({ text: str(x?.text), evidence: (Array.isArray(x?.evidence) ? x.evidence : []).map(str).filter(Boolean).slice(0, 3) })).filter((x) => x.text);
  const o = raw && typeof raw === "object" ? raw : {};
  return { summary: str(o.summary) || "", good: list(o.good), issues: list(o.issues), next: list(o.next) };
}
async function runAI() {
  const A = S.ai;
  if (!S.sampleText) { A.error = "この画面では Claude を使えません。"; render(); return; }
  A.loading = true; A.error = null; A.ctl = new AbortController(); render();
  const key = aiKey(A);
  try {
    const data = { ...WN.buildAnalysisInput(S.workouts, A.lens, A.scope === "all" ? "all" : { exercise: A.scope }, A.period, today()), ...condForAI(A.lens, A.period) };
    const raw = await S.sampleText.json(AI_PROMPT(A.lens, data), { signal: A.ctl.signal });
    const result = sanitizeAI(raw);
    if (!result.summary && !result.good.length && !result.issues.length) throw { code: "invalid_json" };
    const doc = { lens: A.lens, scope: A.scope, period: A.period, createdAt: new Date().toISOString(), trainingDays: data.trainingDays, warnings: data.warnings, result };
    A.cache[key] = doc;
    try { await aiDoc(A).set(doc); } catch {}
  } catch (e) {
    if (e?.code !== "cancelled") A.error = SAMPLE_ERRORS[e?.code] || "分析できませんでした。少し待ってからもう一度お試しください。";
  } finally { A.loading = false; A.ctl = null; if (S.view === "ai" && S.ai === A) render(); }
}

function renderAI(view) {
  const A = S.ai;
  view.append(h("div", { class: "seg", role: "group", "aria-label": "視点" },
    [["short", "短期（週単位）"], ["long", "長期（月・年単位）"]].map(([k, l]) => h("button", { type: "button", "aria-pressed": String(A.lens === k), onclick: () => { if (A.loading) return; A.lens = k; A.period = WN.DEFAULT_PERIOD[k]; render(); loadSavedAI(); } }, l))));
  const names = WN.exerciseNames(S.workouts, "all").slice(0, 8);
  if (A.scope !== "all" && !names.includes(A.scope)) names.unshift(A.scope);
  const chip = (on, label, fn) => h("button", { class: "chip", type: "button", "aria-pressed": String(on), onclick: () => { if (A.loading) return; fn(); render(); loadSavedAI(); } }, label);
  view.append(h("div", { class: "card", style: "gap:6px" },
    h("div", { class: "flabel" }, "対象"),
    h("div", { class: "chips-wrap" }, chip(A.scope === "all", "全体", () => (A.scope = "all")), names.map((n) => chip(A.scope === n, n, () => (A.scope = n)))),
    h("div", { class: "flabel" }, "期間"),
    h("div", { class: "chips-wrap" }, WN.PERIODS[A.lens].map((p) => chip(A.period === p.id, p.label, () => (A.period = p.id))))));

  if (S.workouts.length === 0) { view.append(h("div", { class: "card empty" }, h("p", { class: "sub", style: "margin:0" }, "記録がたまると分析できます。"))); return; }

  // アプリで計算した図（Claude を使わない）
  const from = WN.periodStart(A.period, today(), S.workouts), to = WN.addDays(today(), 1);
  if (A.lens === "short") {
    const rs = WN.repStrength(S.workouts, from, to, A.scope === "all" ? undefined : [A.scope]);
    const card = h("div", { class: "card" }, h("h2", { class: "card-title" }, "回数ごとの強さ"),
      h("div", { class: "muted" }, "各回数帯のベストセットの推定1RM を、期間内の最高値を100%として比べたもの（棒の左端は80%）"));
    for (const r of rs) {
      if (r.ratio == null) { card.append(h("div", { class: "repbar" }, h("span", {}, r.label), h("span", { class: "muted" }, "この期間はなし"), h("span", {}))); continue; }
      const color = r.ratio >= 95 ? "var(--good)" : r.ratio >= 90 ? "var(--p-shoulders)" : "var(--bad)";
      card.append(h("div", { class: "repbar" }, h("span", {}, r.label),
        h("div", { class: "track" }, h("div", { class: "fill", c: color, style: `width:${Math.max(2, Math.min(100, (r.ratio - 80) / 20 * 100))}%` })),
        h("span", { class: "v" }, `${r.ratio}%`)));
    }
    card.append(h("div", { class: "muted" }, rs.map((r) => `${r.label} ${r.sets}セット`).join("・")));
    view.append(card);
  } else {
    const target = A.scope !== "all" ? A.scope : mainExercise(from);

// 期間内で回数が多く、同じなら推定1RM が高い種目（長期グラフの既定）
function mainExercise(from) {
  const stats = new Map();
  for (const w of S.workouts) {
    if (w.date < from) continue;
    for (const ex of w.exercises) {
      const b = WN.bestSet(ex); if (!b) continue;
      const cur = stats.get(ex.name) || { n: 0, rm: 0 };
      stats.set(ex.name, { n: cur.n + 1, rm: Math.max(cur.rm, WN.estimate1RM(b.weight, b.reps)) });
    }
  }
  return [...stats.entries()].sort((a, b) => b[1].n - a[1].n || b[1].rm - a[1].rm)[0]?.[0];
}

function monthlyRMCard(name, from) {
  // 月ごとの推定1RM（期間内）と、その12か月前の同じ月
  const ses = WN.exerciseSessions(S.workouts, name);
  const byMonth = new Map();
  for (const x of ses) byMonth.set(WN.monthKey(x.date), Math.max(byMonth.get(WN.monthKey(x.date)) || 0, x.rm));
  const months = [];
  for (let m = from.slice(0, 7); m <= today().slice(0, 7); m = WN.shiftMonth(m, 1)) months.push(m);
  const card = h("div", { class: "card" }, h("h2", { class: "card-title" }, `${name}の推定1RM（月ごと）`));
  const cur = months.map((m) => byMonth.get(m) ?? null), prev = months.map((m) => byMonth.get(WN.shiftMonth(m, -12)) ?? null);
  const vals = [...cur, ...prev].filter((v) => v != null);
  if (vals.length < 2) { card.append(h("div", { class: "muted" }, "月ごとの比較には、2か月以上の記録が必要です。")); return card; }
  const hasPrev = prev.some((v) => v != null);
  card.append(h("div", { class: "legend-line" }, h("span", {}, h("i", { c: "var(--accent)" }), "この期間"), hasPrev ? h("span", {}, h("i", { c: "var(--ink-3)" }), "1年前の同じ月") : null));
  const W = 320, H = 170, L = 38, T = 10, B = H - 22, R = W - 8;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${name}の月ごとの推定1RM` });
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.15 || 5; lo -= pad; hi += pad;
  const step = niceStep(hi - lo); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = (i) => L + (months.length === 1 ? 0 : (i / (months.length - 1)) * (R - L)), Y = (v) => B - ((v - lo) / (hi - lo)) * (B - T);
  for (let v = lo; v <= hi + 1e-9; v += step) { s("line", { x1: L, x2: R, y1: Y(v), y2: Y(v), class: v === lo ? "axis" : "grid" }, svg); s("text", { x: L - 4, y: Y(v) + 3, "text-anchor": "end" }, svg).textContent = axisLabel(v); }
  const tickEvery = Math.ceil(months.length / 5);
  months.forEach((m, i) => { if (i % tickEvery === 0 || i === months.length - 1) s("text", { x: X(i), y: B + 15, "text-anchor": i === 0 ? "start" : i === months.length - 1 ? "end" : "middle" }, svg).textContent = `${Number(m.slice(5))}月`; });
  const path = (arr) => arr.map((v, i) => (v == null ? "" : `${i && arr[i - 1] != null ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`)).join(" ");
  if (hasPrev) s("path", { d: path(prev), style: "fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:4 3" }, svg);
  s("path", { d: path(cur), style: "fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round" }, svg);
  cur.forEach((v, i) => v != null && s("circle", { cx: X(i), cy: Y(v), r: 3, style: "fill:var(--accent);stroke:var(--surface);stroke-width:2" }, svg));

// 体重・睡眠・コンディション・★種目を、同じ日付の軸で縦に並べる
function reviewChart(days, from, to, liftPts) {
  const W = 320, L = 34, R = W - 8, span = Math.max(1, WN.daysBetween(from, to));
  const X = (d) => L + (WN.daysBetween(from, d) / span) * (R - L);
  const get = (k) => days.filter((w) => w.cond && w.cond[k] != null).map((w) => [w.date, w.cond[k]]);
  const panels = [
    { label: "体重（kg）", pts: get("bodyweight"), type: "line", color: "var(--ink)" },
    { label: "睡眠（時間）", pts: get("sleep"), type: "bar", color: "var(--p-chest)" },
    { label: "コンディション（1〜5）", pts: get("condition"), type: "dot", color: "var(--p-legs)", lo: 1, hi: 5 },
  ];
  if (S.rLift) panels.push({ label: `${S.rLift}の推定1RM（kg）`, pts: liftPts, type: "line", color: "var(--accent)" });
  const PH = 52, GAP = 22, H = panels.length * (PH + GAP) + 12;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "体重・睡眠・コンディションの推移" });
  if (S.rSel) s("line", { x1: X(S.rSel), x2: X(S.rSel), y1: 6, y2: H - 14, class: "axis", "stroke-dasharray": "3 3" }, svg);
  panels.forEach((p, i) => {
    const top = i * (PH + GAP) + 18, bot = top + PH;
    s("text", { x: L, y: top - 6, class: "label-strong" }, svg).textContent = p.label;
    s("line", { x1: L, x2: R, y1: bot, y2: bot, class: "axis" }, svg);
    if (!p.pts.length) { s("text", { x: (L + R) / 2, y: top + PH / 2, "text-anchor": "middle" }, svg).textContent = "記録なし"; return; }
    const vs = p.pts.map(([, v]) => v);
    let lo = p.lo ?? (p.type === "bar" ? 0 : Math.min(...vs)), hi = p.hi ?? Math.max(...vs);
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; } else if (p.lo == null && p.type !== "bar") { const pad = (hi - lo) * 0.1; lo -= pad; hi += pad; }
    const Y = (v) => bot - ((v - lo) / (hi - lo)) * (PH - 4);
    s("text", { x: L - 4, y: top + 7, "text-anchor": "end" }, svg).textContent = axisLabel(Math.round(hi * 10) / 10);
    s("text", { x: L - 4, y: bot, "text-anchor": "end" }, svg).textContent = axisLabel(Math.round(lo * 10) / 10);
    if (p.type === "line") s("path", { d: p.pts.map(([d, v], j) => `${j ? "L" : "M"}${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(" "), style: `fill:none;stroke:${p.color};stroke-width:1.8;stroke-linejoin:round` }, svg);
    for (const [d, v] of p.pts) {
      const on = d === S.rSel;
      if (p.type === "bar") s("rect", { x: X(d) - 2, y: Y(v), width: 4, height: Math.max(1, bot - Y(v)), rx: 1, style: `fill:${p.color};opacity:${on || !S.rSel ? 1 : 0.5}` }, svg);
      else s("circle", { cx: X(d), cy: Y(v), r: on ? 4.5 : p.type === "dot" ? 3 : 2.2, style: `fill:${p.color};stroke:var(--surface);stroke-width:1.2` }, svg);
    }
  });
  for (let k = 0; k <= 3; k++) { const d = WN.addDays(from, Math.round((span * k) / 3)); s("text", { x: X(d), y: H - 2, "text-anchor": k === 0 ? "start" : k === 3 ? "end" : "middle" }, svg).textContent = WN.shortDate(d); }
  const dates = [...new Set([...days.map((w) => w.date), ...liftPts.map(([d]) => d)])].sort();
  const hit = s("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }, svg);
  const pick = (e) => {
    if (!dates.length) return;
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    let best = dates[0];
    for (const d of dates) if (Math.abs(X(d) - px) < Math.abs(X(best) - px)) best = d;
    if (best !== S.rSel) { S.rSel = best; render(); }
  };
  hit.addEventListener("pointerdown", pick);
  hit.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "mouse") pick(e); });
  return svg;
}

// AI 分析に渡す：期間ごとの体重・睡眠・コンディションの平均と、最近のメモ
function condForAI(lens, period) {
  const t = today(), from = WN.periodStart(period, t, S.workouts);
  const ws = S.workouts.filter((w) => w.date >= from && w.date <= t);
  const key = (w) => (lens === "short" ? WN.weekStart(w.date) : WN.monthKey(w.date));
  const g = new Map();
  for (const w of ws) if (w.cond) {
    const o = g.get(key(w)) || { label: key(w), bw: [], sleep: [], cond: [] };
    if (w.cond.bodyweight != null) o.bw.push(w.cond.bodyweight);
    if (w.cond.sleep != null) o.sleep.push(w.cond.sleep);
    if (w.cond.condition != null) o.cond.push(w.cond.condition);
    g.set(o.label, o);
  }
  const avg = (a) => (a.length ? Math.round(mean(a) * 10) / 10 : null);
  return {
    condition: [...g.values()].sort((a, b) => a.label.localeCompare(b.label)).map((o) => ({ label: o.label, bodyweightKg: avg(o.bw), sleepHours: avg(o.sleep), conditionScore: avg(o.cond) })),
    memos: ws.slice().sort((a, b) => b.date.localeCompare(a.date)).map((w) => ({ date: w.date, text: memoTexts(w).join(" / ").slice(0, 140) })).filter((m) => m.text).slice(0, 30),
  };
}

// Claude の答えを、アプリのデータ形式にそろえる（型や値がずれていても壊れないように）
function sanitizeParsed(raw) {
  const num = (v) => { const n = typeof v === "string" ? Number(v.replace(",", ".")) : v; return typeof n === "number" && isFinite(n) && n >= 0 ? n : null; };
  const str = (v) => (typeof v === "string" && v.trim() ? v.trim().slice(0, 500) : null);
  const o = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  const date = typeof o.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(o.date) ? o.date : null;
  const exercises = (Array.isArray(o.exercises) ? o.exercises : []).slice(0, 40).map((e) => {
    const name = str(e?.name) || "（種目名不明）";
    const part = WN.BODY_PARTS.includes(e?.part) ? e.part : WN.guessPart(name);
    const sets = (Array.isArray(e?.sets) ? e.sets : []).slice(0, 50).map((x) => ({ weight: num(x?.weight), unit: x?.unit === "lb" ? "lb" : "kg", reps: num(x?.reps), note: str(x?.note) }));
    return { name, part, sets, note: str(e?.note), raw: str(e?.raw) };
  });
  const uncertain = (Array.isArray(o.uncertain) ? o.uncertain : []).map(str).filter(Boolean).slice(0, 20);
  return { date, title: str(o.title), exercises, notes: str(o.notes), uncertain, cond: sanitizeCond(o) };
}

// 手書きノートの書き方（印刷された記録用紙）
const NOTEBOOK_GUIDE = `

補足（手書きノートの場合の読み方）:

- 1つのセルに続けて書いてあったり、セルをまたいで書いてあることもある。
- 種目の行のすぐ下の MEMO 行は、その種目の note。

- 重量の並び（ウォームアップから上げていく、同じ重量を続ける、など）や前回の記録から見て不自然な数字は、形の似た数字（5と7、1と7、4と9、6と0、3と8 など）の読み違いを疑い、自然な方を採用する。そのときは uncertain に「◯◯セット目は△△と読めたが、前後が□□と□□のあいだなので××と判断」のように、何が不自然でどう判断したかを書く。
- 各種目に raw として、その行に書かれている文字を読めたとおりに入れる（例："SQ 170×5 157.5×6 160×5"）。`;

// 手書きの数字で取り違えやすい組み合わせ
const DIGIT_LOOKALIKE = { 0: "689", 1: "74", 2: "7", 3: "85", 4: "91", 5: "763", 6: "058", 7: "125", 8: "3605", 9: "47" };
function lookalikes(w) {
  const str = String(w), out = new Set();
  for (let i = 0; i < str.length; i++) for (const r of DIGIT_LOOKALIKE[str[i]] || "") {
    const v = Number(str.slice(0, i) + r + str.slice(i + 1));
    if (isFinite(v) && v > 0) out.add(v);
  }
  return [...out];
}
// 読み取ったあとの点検：重量の並びから不自然な数字を見つけ、形の似た数字で自然になるならそちらにする。直したこと・気になったことは必ず書き残す
function sanityCheckSets(exercises) {
  const notes = [];
  for (const ex of exercises) {
    const ss = ex.sets;
    // 前後の重量のあいだから外れている度合い（自然なら null）
    const odd = (i) => {
      const w = ss[i].weight;
      if (w == null) return null;
      const prev = ss.slice(0, i).reverse().find((x) => x.weight != null)?.weight, next = ss.slice(i + 1).find((x) => x.weight != null)?.weight;
      if (prev == null || next == null) return null;
      const lo = Math.min(prev, next), hi = Math.max(prev, next);
      if (w >= lo * 0.85 && w <= hi * 1.15) return null;
      return { i, w, prev, next, lo, hi, dev: w < lo ? lo / w : w / hi };
    };
    const fixedAt = new Set();
    // いちばん外れている数字から直し、直したあとの並びでもう一度見る
    for (let round = 0; round < ss.length; round++) {
      const worst = ss.map((_, i) => (fixedAt.has(i) ? null : odd(i))).filter(Boolean).sort((a, b) => b.dev - a.dev)[0];
      if (!worst) break;
      const mid = (worst.lo + worst.hi) / 2;
      const c = lookalikes(worst.w).filter((v) => v >= worst.lo * 0.95 && v <= worst.hi * 1.05).sort((a, b) => Math.abs(a - mid) - Math.abs(b - mid))[0];
      if (c == null) break;
      ss[worst.i] = { ...ss[worst.i], weight: c };
      fixedAt.add(worst.i);
      notes.push(`${ex.name} ${worst.i + 1}セット目は ${fmtW(worst.w)}kg と読めましたが、前後が ${fmtW(worst.prev)}kg と ${fmtW(worst.next)}kg なので不自然です。形の似た数字の読み違いとみて ${fmtW(c)}kg にしました`);
    }
    for (let i = 0; i < ss.length; i++) {
      const o = fixedAt.has(i) ? null : odd(i);
      if (o) notes.push(`${ex.name} ${i + 1}セット目の ${fmtW(o.w)}kg は、前後（${fmtW(o.prev)}kg・${fmtW(o.next)}kg）と比べて不自然です。読み違いかもしれません`);
    }
    const last = WN.exerciseSessions(S.workouts, ex.name).at(-1), b = last && WN.bestSet(last.exercise);
    const top = Math.max(0, ...ss.map((x) => x.weight ?? 0));
    if (b && top && (top > b.weight * 1.5 || top < b.weight * 0.4)) notes.push(`${ex.name}の最大 ${fmtW(top)}kg は、前回（${last.date} の ${fmtW(b.weight)}kg）とかなり違います。読み違いでないか見てください`);
  }
  return notes;
}

// この人がよく記録する種目と前回の重量（略記を名前に合わせる手がかり・数字の読み間違いの確認用）
function readingHints() {
  const names = WN.exerciseNames(S.workouts, "all").slice(0, 40), lines = [];
  for (const n of names) {
    const last = WN.exerciseSessions(S.workouts, n).at(-1), b = last && WN.bestSet(last.exercise), part = last?.exercise.part;
    lines.push(`- ${n}${part ? `（${partLabel(part)}）` : ""}${b ? `：前回 ${last.date} ${fmtW(b.weight)}kg×${b.reps}` : ""}`);
  }
  for (const n of S.exRules.custom || []) if (!names.includes(n)) lines.push(`- ${n}${S.exRules.parts[n] ? `（${partLabel(S.exRules.parts[n])}）` : ""}：登録済み・記録なし`);
  const aliases = Object.entries(S.exRules.aliases || {}).slice(0, 40).map(([k, v]) => `${k} → ${v}`);
  if (!lines.length && !aliases.length) return "";
  return `\n\nこの人の最近の記録（種目名はできるだけこの一覧の名前に合わせる。重量の読み間違いの確認にも使う）:\n${lines.join("\n")}${aliases.length ? `\n略記の対応: ${aliases.join("、")}` : ""}`;
}

// 送る画像：ページ全体に加えて、上半分・下半分の拡大も送る（手書きの数字を大きく見せるため）
async function photoImages(file) {
  try {
    const bmp = await createImageBitmap(file), W = bmp.width, H = bmp.height;
    const cut = async (sx, sy, sw, sh) => {
      const k = Math.min(1, 2000 / Math.max(sw, sh)), c = document.createElement("canvas");
      c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      c.getContext("2d").drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
      return new Promise((r) => c.toBlob(r, "image/jpeg", 0.9));
    };
    const out = [await cut(0, 0, W, H)];
    if (Math.max(W, H) >= 1200) {
      if (H >= W) { const a = Math.round(H * 0.55), b = Math.round(H * 0.45); out.push(await cut(0, 0, W, a), await cut(0, b, W, H - b)); }
      else { const a = Math.round(W * 0.55), b = Math.round(W * 0.45); out.push(await cut(0, 0, a, H), await cut(b, 0, W - b, H)); }
    }
    return out.every(Boolean) ? out : [file];
  } catch { return [file]; }
}
// 拡大画像つきで Claude に読んでもらう（複数枚が送れないときは全体の1枚だけで読み直す）
async function askWithPhoto(promptText, file, signal) {
  const imgs = await photoImages(file), base = promptText + NOTEBOOK_GUIDE + readingHints();
  const multi = imgs.length > 1 ? "\n\n画像について：1枚目はページ全体、2枚目と3枚目は同じページの前半・後半を拡大したもの。数字や細かい文字は拡大画像で読み、同じ記録を重複して数えないこと。" : "";
  try { return await S.sample.json(base + multi, { images: imgs, signal }); }
  catch (e) {
    if (e?.code === "cancelled" || imgs.length === 1) throw e;
    return await S.sample.json(base, { images: [imgs[0]], signal });
  }
}

async function shrinkImage(file) {
  // 送る前に長辺 2000px の JPEG に縮める（失敗したら元のファイルをそのまま使う）
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    return blob || file;
  } catch { return file; }
}

async function readPhoto() {
  const a = S.add;
  if (!S.sample) { a.error = SAMPLE_ERRORS.images_unavailable; render(); return; }
  a.mode = "reading"; a.error = null; a.ctl = new AbortController(); render();
  try {
    const raw = await askWithPhoto(PROMPT(today()), a.file, a.ctl.signal);
    const parsed = sanitizeParsed(raw);
    if (!parsed.exercises.length) { a.mode = "photo"; a.error = parsed.uncertain[0] || "記録が見つかりませんでした。ノート全体が写るように撮り直してください。"; render(); return; }
    startEdit(parsed, { photoUrl: a.photoUrl, date: a.date });
  } catch (e) {
    a.mode = "photo";
    a.error = e?.code === "cancelled" ? null : SAMPLE_ERRORS[e?.code] || "読み取れませんでした。もう一度お試しください。";
    render();
  } finally { a.ctl = null; }
}

function startEdit(parsed, { photoUrl = null, sourceText = null, date = null }) {
  // 貼り付けたテキストの「体重 72.5」「コンディション 4」などの行は種目ではないので外す
  parsed = { ...parsed, exercises: parsed.exercises.filter((e) => !/^(体重|睡眠|コンディション|調子|栄養)/.test(e.name)).map(applyRule) };
  parsed = { ...parsed, uncertain: [...parsed.uncertain, ...sanityCheckSets(parsed.exercises)] };
  const form = WN.formFromParsed(parsed, date || today());
  form.exercises.forEach((x, i) => { x.raw = parsed.exercises[i]?.raw || null; }); // ノートに書かれていたとおりの文字（見比べ用）
  // 体重・睡眠・コンディション：写真から読んだ値、なければメモの文字から拾う
  form.cond = { ...toFormCond(null), ...condFromText([parsed.notes, sourceText].filter(Boolean).join("\n")), ...Object.fromEntries(Object.entries(toFormCond(parsed.cond)).filter(([, v]) => v !== "")) };
  const uncertain = [...parsed.uncertain];
  if (date) {
    if (parsed.date && parsed.date !== date) uncertain.push(`ノートの日付（${parsed.date}）ではなく、カレンダーで選んだ日付にしています`);
    form.date = date;
    const i = uncertain.findIndex((u) => u.startsWith("日付が見つからなかった")); if (i >= 0) uncertain.splice(i, 1);
  } else if (!parsed.date && photoUrl) uncertain.push("日付が読み取れなかったため、今日の日付にしています");
  if (!form.exercises.length) form.exercises.push(WN.emptyExercise());
  S.edit = { form, uncertain, checkedU: new Set(), photoUrl, sourceText, existing: null, showSource: false };
  go("edit", { replace: true });
}

const nameKey = (n) => String(n).normalize("NFKC").replace(/\s+/g, "").toLowerCase();
const rulesDoc = () => S.db.doc(`data/users/${S.uid}/meta`).collection("settings").doc("exercises");
async function loadRules() {

    if (d) S.exRules = { parts: d.parts || {}, aliases: d.aliases || {}, custom: Array.isArray(d.custom) ? d.custom : [], ...(d.focus ? { focus: d.focus } : {}) };
  } catch {}
}
const canonName = (n) => S.exRules.aliases[nameKey(n)] || n;
const partFor = (n) => { const c = canonName(n); return S.exRules.parts[c] ?? WN.guessPart(c); };
// 読み取った種目に、まとめた名前と決めた部位をあてる
function applyRule(e) {
  const name = canonName(e.name);
  return { ...e, name, part: S.exRules.parts[name] ?? e.part ?? WN.guessPart(name) };
}
// 記録に出てくる種目と登録した種目の一覧（回数・いちばん多い部位・最後の日）
function exerciseCatalog() {
  const m = new Map();
  for (const w of S.workouts) for (const ex of w.exercises) {
    const c = m.get(ex.name) || { name: ex.name, count: 0, parts: {}, last: "" };
    c.count++;
    const p = ex.part || "none";
    c.parts[p] = (c.parts[p] || 0) + 1;
    if (w.date > c.last) c.last = w.date;
    m.set(ex.name, c);
  }
  const list = [...m.values()].map((c) => {
    const ps = Object.entries(c.parts).sort((a, b) => b[1] - a[1]);
    return { ...c, part: ps[0][0] === "none" ? null : ps[0][0], mixed: ps.length > 1 };
  });
  // 登録だけして、まだ記録のない種目
  const seen = new Set(list.map((c) => nameKey(c.name)));
  for (const n of S.exRules.custom || []) if (!seen.has(nameKey(n))) { seen.add(nameKey(n)); list.push({ name: n, count: 0, parts: {}, last: "", part: S.exRules.parts[n] ?? WN.guessPart(n), mixed: false }); }
  return list.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}

// fromNames の種目を、すべての記録で toName・part に書き換える（同じ日に重なったらセットを1つにまとめる）
async function applyExerciseChange(fromNames, toName, part) {
  const from = new Set(fromNames);
  const touched = S.workouts.filter((w) => w.exercises.some((e) => from.has(e.name) || (e.name === toName && e.part !== part)));
  const E = S.exm;
  E.busy = { done: 0, total: touched.length }; render();
  const now = new Date().toISOString();
  try {
    for (const w of touched) {
      const out = [];
      for (const e of w.exercises) {
        if (!from.has(e.name) && e.name !== toName) { out.push(e); continue; }
        const same = out.find((x) => x.name === toName);
        if (same) { same.sets = [...same.sets, ...e.sets]; same.note = [same.note, e.note].filter(Boolean).join(" / ") || null; }
        else out.push({ ...e, name: toName, part });
      }
      await putWorkout({ ...w, exercises: out, updatedAt: now });
      E.busy.done++;
      if (S.view === "exercises" && S.exm === E) render();
    }
    // これから読み取る記録にも使う決まり
    const R = { parts: { ...S.exRules.parts }, aliases: { ...S.exRules.aliases }, custom: [...new Set((S.exRules.custom || []).map((n) => (from.has(n) ? toName : n)))], focus: S.exRules.focus ? Object.fromEntries(Object.entries(S.exRules.focus).map(([p, l]) => [p, [...new Set(l.map((n) => (from.has(n) ? toName : n)))]])) : null };
    if (!R.focus) delete R.focus;
    for (const n of from) if (n !== toName) { R.aliases[nameKey(n)] = toName; delete R.parts[n]; }
    for (const k in R.aliases) if (from.has(R.aliases[k])) R.aliases[k] = toName;
    delete R.aliases[nameKey(toName)];
    if (part) R.parts[toName] = part; else delete R.parts[toName];
    S.exRules = R;
    try { await rulesDoc().set(R); } catch {}
    toast(from.size > 1 ? `「${toName}」に1つにまとめました（${touched.length}件の記録）` : `「${toName}」を更新しました（${touched.length}件の記録）`);
    S.exm = { sel: new Set(), mode: "list" };
  } catch (e) {
    toast(E.busy.done ? `${E.busy.done}件まで書き換えました。${storeErrorText(e)}` : storeErrorText(e));
  } finally {
    E.busy = null;
    if (S.view === "exercises") render();
  }
}
