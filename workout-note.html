// ===== 詳細 =====
// トップセット：いちばん重いセット（同じ重量なら回数が多い方）。ウォームアップ（W）は除く
function topSet(ex) {
  let top = null;
  for (const st of ex.sets) {
    if (st.weight == null || !(st.reps > 0) || st.note === "W") continue;
    const w = st.unit === "lb" ? Math.round(st.weight * 0.4536 * 10) / 10 : st.weight;
    if (!top || w > top.weight || (w === top.weight && st.reps > top.reps)) top = { weight: w, reps: st.reps };
  }
  return top;
}
// 前回との比較：ボリューム・セット数・トップセット
function compareWithPrev(ex, vol, prev) {
  const sign = (v) => (v > 0 ? "up" : v < 0 ? "down" : "same");
  const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "±");
  const dv = vol - prev.volume, ds = ex.sets.length - prev.exercise.sets.length;
  const t = topSet(ex), pt = topSet(prev.exercise);
  let topCell = null;
  if (t && pt) {
    const dw = Math.round((t.weight - pt.weight) * 100) / 100, dr = t.reps - pt.reps;
    const rmd = WN.estimate1RM(t.weight, t.reps) - WN.estimate1RM(pt.weight, pt.reps);
    // 重量が上がった・同じ重量で回数が増えた＝伸びた。重量が下がっても推定1RM が上なら伸びた扱い
    // 重量が上がっても回数が減り、推定1RM が下がったときは「重量は上・回数は下」（どちらとも言えない）
    const mixed = dw > 0 && dr < 0 && rmd < -0.05;
    const grew = !mixed && (dw > 0 || (dw === 0 && dr > 0) || (dw < 0 && rmd > 0.05));
    const fell = !grew && !mixed && (dw < 0 || (dw === 0 && dr < 0));
    const how = [dw !== 0 ? `重量 ${dw > 0 ? "+" : "−"}${fmtW(Math.abs(dw))}kg` : null, dr !== 0 ? `${dw === 0 ? "同じ重量で" : "回数 "}${dr > 0 ? "+" : "−"}${Math.abs(dr)}回` : null].filter(Boolean).join("・") || "前回と同じ";
    topCell = h("div", { class: "cmp " + (grew ? "up" : fell ? "down" : "same") },
      h("span", { class: "k" }, "トップセット"),
      h("b", {}, `${fmtW(t.weight)}kg×${t.reps}`, h("small", {}, `（前回 ${fmtW(pt.weight)}×${pt.reps}）`)),
      h("span", { class: "d" }, `${grew ? "▲ 伸びた" : fell ? "▼ 下がった" : mixed ? "± 重量は上・回数は下" : "± 同じ"}・${how}${Math.abs(rmd) >= 0.05 ? `・推定1RM ${rmd > 0 ? "+" : "−"}${WN.round1(Math.abs(rmd))}kg` : ""}`));
  }
  return h("div", { class: "cmp-wrap" },
    h("div", { class: "muted" }, `前回（${WN.shortDate(prev.date)}）と比べて`),
    topCell,
    h("div", { class: "cmp-row" },
      h("div", { class: "cmp " + sign(ds) }, h("span", { class: "k" }, "セット数"), h("b", {}, `${ex.sets.length}`, h("small", {}, `（前回 ${prev.exercise.sets.length}）`)), h("span", { class: "d" }, `${arrow(ds)} ${Math.abs(ds)}セット`)),
      h("div", { class: "cmp " + sign(Math.round(dv)) }, h("span", { class: "k" }, "ボリューム"), h("b", {}, WN.formatKg(vol), h("small", {}, "kg")), h("span", { class: "d" }, `${arrow(Math.round(dv))} ${WN.formatKg(Math.abs(dv))}kg`))));
}
// 同じ日の記録（保存した順）
const sameDayWorkouts = (date) => S.workouts.filter((x) => x.date === date).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
const savedTime = (w) => { if (String(w.createdAt).length <= 10) return ""; const d = new Date(w.createdAt); return isNaN(d) ? "" : `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}に保存`; };
const exerciseSummary = (w) => (w.exercises.length ? `${w.exercises[0].name}${w.exercises.length > 1 ? ` ほか${w.exercises.length - 1}種目` : ""}` : "種目なし");
function openDetail(id) { S.detailId = id; go("detail"); }
function detailTitle() { const w = S.workouts.find((x) => x.id === S.detailId); return w ? WN.formatDateJa(w.date) : "記録"; }
function renderDetail(view) {
  const w = S.workouts.find((x) => x.id === S.detailId);
  if (!w) { view.append(h("div", { class: "card empty" }, h("p", { class: "sub" }, "この記録は見つかりません。"))); return; }
  const sets = w.exercises.reduce((n, e) => n + e.sets.length, 0), reps = w.exercises.reduce((n, e) => n + e.sets.reduce((a, x) => a + (x.reps || 0), 0), 0);
  view.append(h("div", { class: "row", style: "flex-wrap:wrap;gap:6px" }, WN.workoutParts(w).map(tag), w.title ? h("b", { style: "color:var(--accent)" }, w.title) : null, w.sample ? h("span", { class: "muted" }, "サンプル") : null));
  // 同じ日に記録が複数あるとき（家で手入力＋ジムで写真、など）は切り替えて見られるようにする
  const sameDay = sameDayWorkouts(w.date);
  if (sameDay.length > 1) {
    view.append(h("div", { class: "card", style: "gap:6px" },
      h("div", { class: "card-head" }, h("h2", { class: "card-title" }, `この日は記録が${sameDay.length}件あります`), h("span", { class: "muted" }, `合計 ${WN.formatKg(sameDay.reduce((a, x) => a + WN.totalVolume(x), 0))}kg`)),
      h("div", { class: "from" }, sameDay.map((x, i) => h("button", { type: "button", "aria-pressed": String(x.id === w.id), onclick: () => { S.detailId = x.id; render(); document.getElementById("main").scrollTop = 0; } },
        h("b", {}, `${i + 1}件目${savedTime(x) ? `（${savedTime(x)}）` : ""}`), h("span", { style: "font-family:var(--font-body);font-size:12px" }, exerciseSummary(x)))))));
  }
  const cs = condSummaryCard(w.cond);
  if (cs) view.append(cs);
  view.append(h("div", { class: "card" }, h("div", { class: "hero-label" }, sameDay.length > 1 ? "この記録の総ボリューム" : "この日の総ボリューム"), h("div", { class: "hero" }, WN.formatKg(WN.totalVolume(w)), h("small", {}, "kg")),
    h("div", { class: "muted", style: "font-size:12px" }, `${w.exercises.length}種目　${sets}セット　${reps}回`)));
  for (const ex of w.exercises) {
    const vol = WN.exerciseVolume(ex), prev = WN.previousSession(S.workouts, ex.name, w.date);
    const card = h("div", { class: "card", style: "gap:4px" }, h("div", { class: "ex-head" }, h("span", { class: "ex-name" }, ex.name), h("span", { class: "num", style: "font-size:16px;color:var(--ink-2)" }, `${WN.formatKg(vol)}kg`)), tag(ex.part));
    ex.sets.forEach((st, i) => card.append(h("div", { class: "set-line" }, h("span", {}, `${i + 1}. ${st.weight != null ? `${st.weight}${st.unit || "kg"}` : "自重"}${st.reps != null ? ` × ${st.reps}回` : ""}${st.note ? `（${st.note}）` : ""}`), h("span", {}, WN.setVolumeKg(st) > 0 ? `${WN.formatKg(WN.setVolumeKg(st))}kg` : ""))));
    if (ex.note) card.append(h("div", { class: "sub" }, ex.note));
    if (prev) card.append(compareWithPrev(ex, vol, prev));
    view.append(card);
  }
  if (w.notes) view.append(h("div", { class: "card" }, h("div", { class: "sub", style: "white-space:pre-wrap" }, w.notes)));
  if (S.confirmDelete) {
    view.append(h("div", { class: "card" }, h("b", {}, "この記録を削除しますか？"), h("div", { class: "row" },
      h("button", { class: "btn secondary grow", type: "button", onclick: () => { S.confirmDelete = false; render(); } }, "やめる"),
      h("button", { class: "btn danger grow", type: "button", onclick: async () => {
        try { await removeWorkout(w.id); toast("削除しました"); back(); } catch (e) { toast(storeErrorText(e)); }
      } }, "削除する"))));
  } else {
    view.append(h("div", { class: "row" },
      h("button", { class: "btn secondary grow", type: "button", onclick: () => openShare("day", w.date) }, "シェア画像"),
      h("button", { class: "btn secondary grow", type: "button", disabled: !S.db, onclick: () => { S.edit = { form: { ...WN.formFromWorkout(w), cond: toFormCond(w.cond) }, uncertain: [], photoUrl: null, sourceText: null, existing: w }; go("edit"); } }, "編集"),
      h("button", { class: "btn secondary grow", type: "button", disabled: !S.db, style: "color:var(--bad)", onclick: () => { S.confirmDelete = true; render(); } }, "削除")));
  }
}

// ===== 設定・バックアップ =====
function renderSettings(view) {
  const dates = S.workouts.map((w) => w.date).sort();
  const samples = S.workouts.filter((w) => w.sample).length;
  view.append(h("div", { class: "card" }, h("h2", { class: "card-title", style: "color:var(--ink);font-size:15px" }, "記録"),
    h("div", { class: "sub" }, `${S.workouts.length}件${dates.length ? `（${WN.formatDateJa(dates[0])} 〜 ${WN.formatDateJa(dates.at(-1))}）` : ""}`),
    samples ? h("button", { class: "btn secondary small", type: "button", onclick: removeSamples }, `サンプルデータ（${samples}件）を削除`) : null));

  const fileIn = h("input", { type: "file", accept: "application/json,.json", hidden: true, id: "restore-input" });
  fileIn.addEventListener("change", async () => {
    const f = fileIn.files?.[0]; if (!f) return;
    try {
      const list = WN.parseBackup(await f.text());
      let added = 0, updated = 0;
      const byId = new Map(S.workouts.map((w) => [w.id, w]));
      for (const w of list) {
        const cur = byId.get(w.id);
        if (!cur) added++; else if (w.updatedAt > cur.updatedAt) updated++; else continue;
        await putWorkout(w);
      }
      toast(`取り込みました（追加 ${added}件・更新 ${updated}件）`);
    } catch (e) { toast(e?.message && !e.code ? e.message : storeErrorText(e)); }
    fileIn.value = "";
  });
  view.append(h("div", { class: "card" }, h("h2", { class: "card-title", style: "color:var(--ink);font-size:15px" }, "種目の管理"),
    h("div", { class: "sub" }, "部位の付け直しや、同じ種目なのに名前が違うものを1つにまとめられます（例：デッドリフトを脚にする、「デッド」と「デッドリフト」をまとめる）。"),
    h("button", { class: "btn secondary", type: "button", disabled: !S.db || (!S.workouts.length && !(S.exRules.custom || []).length), onclick: openExercises }, "種目の一覧を開く")));
  view.append(h("div", { class: "card" }, h("h2", { class: "card-title", style: "color:var(--ink);font-size:15px" }, "バックアップ"),
    h("div", { class: "sub" }, "記録は claude.ai のこのページに、あなた専用で保存されています（ほかの人からは見えません）。ファイルに書き出しておくと、Web アプリ版（GitHub Pages 版）にも取り込めます。"),
    h("button", { class: "btn primary", type: "button", disabled: !S.downloads || !S.workouts.length, onclick: exportBackup }, "💾 バックアップを保存"),
    !S.downloads ? h("div", { class: "muted" }, "この画面ではファイルを保存できません。") : null,
    h("button", { class: "btn secondary", type: "button", disabled: !S.db, onclick: () => fileIn.click() }, "バックアップから取り込む"), fileIn,
    h("div", { class: "muted" }, "取り込んでも今ある記録は消えません。同じ記録は新しい方が残ります。")));
  view.append(h("div", { class: "muted" }, "過去の記録をまとめて取り込むときは、下の「＋ 追加」→「まとめて取り込む」から行えます。"));
  view.append(h("div", { class: "card" }, h("h2", { class: "card-title", style: "color:var(--ink);font-size:15px" }, "このページについて"),
    h("div", { class: "sub" }, "・写真の読み取りと記録の保存は、今お使いの claude.ai アカウントで行います。アカウントが使えなくなると、このページも開けなくなります。ときどきバックアップを保存してください。", h("br"),
      "・iPhone では Claude アプリか Safari でこのページを開いてください。", h("br"),
      "・ノートは 1 行に「種目名 重量×回数×セット数」の形で書くと、きれいに読み取れます。")));
}

async function exportBackup() {
  try {
    await S.downloads.save({ filename: `workout-note-backup-${today()}.json`, data: WN.buildBackup(S.workouts.map(({ sample, ...w }) => w)) });
    toast("保存しました");
  } catch (e) { if (e?.code !== "declined" && e?.code !== "cancelled") toast("保存できませんでした"); }
}

// ===== 保存先（claude.ai の db：自分専用の領域） =====
function newId() { return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`; }
const col = () => S.db.collection("data/users/" + S.uid);
async function putWorkout(w) { await col().doc(w.id).set(JSON.parse(JSON.stringify(w))); }
async function removeWorkout(id) { await col().doc(id).delete(); }
function storeErrorText(e) {
  return e?.code === "quota_exceeded" ? "保存できる記録の上限に達しました。古い記録を削除してください。" : e?.code === "resource_exhausted" ? "操作が多すぎます。少し待ってから保存してください。" : "保存できませんでした。通信状態を確認してもう一度お試しください。";
}

async function addSamples() {
  // グラフなどを試すためのサンプル（約2か月分）。設定から一括で削除できる
  const EX = {
    chest: [["ベンチプレス", 55, .12, 2.5], ["インクラインダンベルプレス", 20, .12, 1], ["ケーブルフライ", 12, .05, 1]],
    back: [["デッドリフト", 90, .35, 2.5], ["ラットプルダウン", 45, .15, 2.5], ["シーテッドロー", 40, .15, 2.5]],
    legs: [["スクワット", 70, .3, 2.5], ["レッグプレス", 120, .6, 5], ["レッグカール", 30, .1, 2.5]],
    shoulders: [["ショルダープレス", 30, .1, 2.5], ["サイドレイズ", 7, .03, 1]],
    arms: [["バーベルカール", 22, .08, 2.5], ["プッシュダウン", 22, .08, 2.5]],
  };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rot = [["chest"], ["back"], ["legs"], ["shoulders", "arms"]];
  const start = WN.addDays(today(), -58), list = [];
  for (let d = start, ri = 0; d < today(); d = WN.addDays(d, rnd() < .55 ? 2 : rnd() < .5 ? 1 : 3)) {
    const day = WN.daysBetween(start, d), parts = rot[ri++ % 4], exercises = [];
    for (const part of parts) for (const [name, base, g, step] of parts.length > 1 ? EX[part].slice(0, 2) : EX[part]) {
      const wt = Math.round((base + g * day + (rnd() - .5) * step) / step) * step;
      exercises.push({ name, part, note: null, sets: [10, 9, 8].map((r) => ({ weight: wt, unit: "kg", reps: Math.max(5, r + Math.round((rnd() - .5) * 2)), note: null })) });
    }
    list.push({ id: "sample-" + d, date: d, title: null, notes: null, exercises, createdAt: d, updatedAt: d, sample: true });
  }
  toast("サンプルを追加しています…");
  try { for (const w of list) await putWorkout(w); toast(`サンプルを${list.length}件追加しました`); } catch (e) { toast(storeErrorText(e)); }
}
async function removeSamples() {
  try { for (const w of S.workouts.filter((x) => x.sample)) await removeWorkout(w.id); toast("サンプルを削除しました"); } catch (e) { toast(storeErrorText(e)); }
}

// ===== 起動 =====
render();
(async () => {
  const claude = window.claude;
  if (!claude?.use) { S.loaded = true; render(); return; }
  const [db, user, sample, downloads] = await Promise.all(["db", "user", "sample", "downloads"].map((n) => claude.use(n).catch(() => null)));
  S.sample = sample; S.downloads = downloads;
  S.sampleText = sample; // AI 分析は画像なしで使える
  if (sample) S.imageLimits = (await sample.limits().catch(() => null))?.images || null;
  if (!sample || !S.imageLimits) S.sample = null;
  const uid = user ? await user.id().catch(() => null) : null;
  if (!db || !uid) { S.loaded = true; render(); return; }
  S.db = db; S.uid = uid;
  loadRules();
  col().onSnapshot((snap) => {
    S.workouts = snap.docs.map((d) => d.data()).filter((w) => w && typeof w.date === "string" && Array.isArray(w.exercises))
      .sort((a, b) => b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt)));
    S.loaded = true; S.storeError = null;
    // 入力中の画面は作り直さない（入力内容やフォーカスを保つため）
    if (S.view !== "edit" && S.view !== "add") render();
  }, (e) => { S.storeError = e.code === "revoked" ? "このページへのアクセスが変わりました。開き直してください。" : "通信状態を確認して、ページを開き直してください。"; S.loaded = true; render(); });
})();
</script>
